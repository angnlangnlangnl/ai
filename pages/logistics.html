<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>智控电商 · 智能物流管理</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        html, body { height: 100%; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: #eef2f8;
            color: #0a1a2b;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* ===== 顶部工具条 ===== */
        .toolbar {
            background: #fff;
            border-bottom: 1px solid #e8edf4;
            padding: 10px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
            flex-shrink: 0;
        }
        .toolbar .tb-left {
            display: flex; align-items: center; gap: 12px;
            font-size: 13px; color: #5f7d95;
            min-width: 0;
        }
        .toolbar .tb-left .status-dot {
            width: 8px; height: 8px; border-radius: 50%;
            background: #0d7c4f;
            animation: pulse 2s infinite;
            flex-shrink: 0;
        }
        @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }
        .toolbar .tb-left strong { color: #0a1e2f; }
        .toolbar .tb-right { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
        .toolbar .tb-btn {
            padding: 6px 14px; border-radius: 20px;
            border: 1px solid #dce5ef; background: #fff;
            color: #1e3a5f; font-size: 12px; font-weight: 500;
            cursor: pointer; display: inline-flex; align-items: center; gap: 5px;
            transition: 0.12s; font-family: inherit; white-space: nowrap;
        }
        .toolbar .tb-btn:hover {
            border-color: #4dabf7; color: #2a7faa; background: #f5f9fe;
        }
        .toolbar .tb-btn i { color: #5f7d95; }
        .toolbar .tb-btn:hover i { color: #4dabf7; }
        .toolbar .tb-btn.primary {
            background: #0a1e2f; border-color: #0a1e2f; color: #fff;
        }
        .toolbar .tb-btn.primary:hover { background: #1a3a5a; }
        .toolbar .tb-btn.primary i { color: rgba(255,255,255,0.7); }

        /* ===== 主体滚动区 ===== */
        .app-body {
            flex: 1;
            overflow-y: auto;
            padding: 16px 20px 20px;
        }
        .app-body::-webkit-scrollbar { width: 6px; }
        .app-body::-webkit-scrollbar-thumb { background: #c8d8e8; border-radius: 10px; }

        /* ===== 快捷 tab ===== */
        .status-tabs {
            display: flex;
            gap: 6px;
            margin-bottom: 14px;
            flex-wrap: wrap;
            background: #fff;
            padding: 8px 12px;
            border-radius: 14px;
            border: 1px solid #e8edf4;
        }
        .status-tab {
            padding: 6px 16px;
            border-radius: 20px;
            border: 1px solid transparent;
            background: transparent;
            font-size: 13px;
            color: #5f7d95;
            cursor: pointer;
            transition: 0.12s;
            font-family: inherit;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            white-space: nowrap;
        }
        .status-tab:hover { background: #f5f9fe; color: #2a7faa; }
        .status-tab.active {
            background: #0a1e2f;
            border-color: #0a1e2f;
            color: #fff;
        }
        .status-tab .tab-count {
            background: rgba(0,0,0,0.08);
            padding: 0 7px;
            border-radius: 10px;
            font-size: 11px;
            font-weight: 600;
            min-width: 18px;
            text-align: center;
        }
        .status-tab.active .tab-count {
            background: rgba(255,255,255,0.18);
        }

        /* ===== 统计卡片 ===== */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 14px;
            margin-bottom: 16px;
        }
        .stat-card {
            background: white;
            padding: 16px 18px;
            border-radius: 14px;
            border: 1px solid #e8edf4;
            box-shadow: 0 2px 8px rgba(10,30,47,0.02);
            transition: 0.15s;
            cursor: pointer;
        }
        .stat-card:hover { box-shadow: 0 6px 20px rgba(10,30,47,0.06); border-color: #c8d8e8; }
        .stat-card .label { font-size: 12px; font-weight: 500; color: #5f7d95; display: flex; align-items: center; gap: 6px; margin-bottom: 4px; }
        .stat-card .value { font-size: 26px; font-weight: 700; color: #0a1e2f; letter-spacing: -0.02em; }
        .stat-card .sub { font-size: 12px; color: #5f7d95; margin-top: 2px; display: flex; gap: 12px; flex-wrap: wrap; }

        /* ===== 卡片 ===== */
        .card {
            background: white;
            border-radius: 14px;
            padding: 16px 18px;
            border: 1px solid #e8edf4;
            box-shadow: 0 2px 8px rgba(10,30,47,0.02);
            transition: 0.15s;
            margin-bottom: 16px;
        }
        .card:hover { border-color: #c8d8e8; }
        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            flex-wrap: wrap;
            gap: 8px;
        }
        .card-header h3 { font-size: 15px; font-weight: 600; color: #0a1e2f; display: flex; align-items: center; gap: 6px; }
        .card-header h3 i { color: #4dabf7; }
        .card-header .action { font-size: 12px; color: #4dabf7; font-weight: 500; cursor: pointer; }
        .card-header .action:hover { color: #2a7faa; }

        /* ===== 筛选栏 ===== */
        .filter-row {
            display: grid;
            grid-template-columns: 1.2fr 1fr 1fr 1fr auto;
            gap: 10px;
            align-items: end;
        }
        .filter-item label {
            display: block;
            font-size: 12px;
            font-weight: 500;
            color: #5f7d95;
            margin-bottom: 4px;
        }
        .filter-item input,
        .filter-item select {
            width: 100%;
            padding: 8px 12px;
            border: 1px solid #dce5ef;
            border-radius: 8px;
            font-size: 13px;
            background: #fafcfe;
            font-family: inherit;
            transition: 0.15s;
            color: #0a1e2f;
            outline: none;
        }
        .filter-item input:focus,
        .filter-item select:focus {
            border-color: #4dabf7;
            background: #fff;
            box-shadow: 0 0 0 3px rgba(77,171,247,0.08);
        }

        /* ===== 批量操作条 ===== */
        .batch-bar {
            display: none;
            background: #0a1e2f;
            color: #fff;
            padding: 10px 16px;
            border-radius: 12px;
            margin-bottom: 12px;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }
        .batch-bar.show { display: flex; }
        .batch-bar .bb-info {
            font-size: 13px;
            font-weight: 500;
        }
        .batch-bar .bb-info strong {
            color: #4dabf7;
        }
        .batch-bar .bb-actions {
            margin-left: auto;
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }
        .batch-bar .bb-btn {
            padding: 5px 14px;
            border-radius: 18px;
            border: 1px solid rgba(255,255,255,0.15);
            background: rgba(255,255,255,0.08);
            color: #fff;
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            transition: 0.12s;
            font-family: inherit;
        }
        .batch-bar .bb-btn:hover {
            background: rgba(255,255,255,0.15);
            border-color: rgba(255,255,255,0.3);
        }
        .batch-bar .bb-btn.primary {
            background: #4dabf7;
            border-color: #4dabf7;
            color: #0a1e2f;
        }
        .batch-bar .bb-btn.primary:hover {
            background: #6bb9f9;
        }

        /* ===== 列表项 ===== */
        .logistics-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 0;
            border-bottom: 1px solid #f0f4f9;
            transition: 0.15s;
        }
        .logistics-item:last-child { border: none; }
        .logistics-item:hover { background: #fafcfe; }
        .logistics-item .checkbox-wrap {
            flex-shrink: 0;
        }
        .logistics-item .checkbox-wrap input {
            width: 16px;
            height: 16px;
            accent-color: #4dabf7;
            cursor: pointer;
        }
        .logistics-item .info { flex: 1; min-width: 0; }
        .logistics-item .info .name { font-weight: 600; color: #0a1e2f; font-size: 14px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
        .logistics-item .info .meta { font-size: 13px; color: #5f7d95; display: flex; gap: 12px; flex-wrap: wrap; margin-top: 2px; }
        .logistics-item .info .meta i { width: 14px; color: #7e9cb0; }
        .logistics-item .right { text-align: right; flex-shrink: 0; display: flex; flex-direction: column; gap: 4px; align-items: flex-end; }

        /* ===== 操作按钮组 ===== */
        .op-group {
            display: flex;
            gap: 4px;
            flex-wrap: wrap;
            justify-content: flex-end;
        }
        .op-btn {
            width: 30px;
            height: 30px;
            border-radius: 8px;
            border: 1px solid #dce5ef;
            background: #fff;
            color: #5f7d95;
            cursor: pointer;
            font-size: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.12s;
            font-family: inherit;
            flex-shrink: 0;
        }
        .op-btn:hover {
            border-color: #4dabf7;
            color: #2a7faa;
            background: #f5f9fe;
        }
        .op-btn.copy:hover { border-color: #0d7c4f; color: #0d7c4f; background: #f0fff8; }
        .op-btn.notify:hover { border-color: #b55a1a; color: #b55a1a; background: #fef7ee; }
        .op-btn.phone:hover { border-color: #7b4fa0; color: #7b4fa0; background: #f9f4ff; }
        .op-btn.track:hover { border-color: #4dabf7; color: #2a7faa; background: #f5f9fe; }
        .op-btn.handle:hover { border-color: #b51a3f; color: #b51a3f; background: #fde8ed; }

        /* ===== 物流进度条 ===== */
        .logistics-progress {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 4px;
            font-size: 12px;
            color: #5f7d95;
            flex-wrap: wrap;
        }
        .logistics-progress .bar {
            flex: 1;
            height: 4px;
            background: #e8edf4;
            border-radius: 10px;
            overflow: hidden;
            min-width: 80px;
        }
        .logistics-progress .bar .fill {
            height: 100%;
            border-radius: 10px;
            background: #4dabf7;
            transition: width 0.5s;
        }
        .logistics-progress .bar .fill.success { background: #0d7c4f; }
        .logistics-progress .bar .fill.danger { background: #b51a3f; }

        /* ===== 通用组件 ===== */
        .badge {
            padding: 2px 12px;
            border-radius: 30px;
            font-size: 11px;
            font-weight: 500;
            white-space: nowrap;
            display: inline-block;
        }
        .badge.success { background: #e6f7ec; color: #0d7c4f; }
        .badge.warning { background: #fef0e6; color: #b55a1a; }
        .badge.danger { background: #fde8ed; color: #b51a3f; }
        .badge.info { background: #e9f0ff; color: #1a5bb5; }
        .badge.blue { background: rgba(77,171,247,0.12); color: #2a7faa; }

        .btn-sm {
            padding: 4px 12px;
            border-radius: 20px;
            border: none;
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            transition: 0.1s;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            font-family: inherit;
        }
        .btn-sm:active { transform: scale(0.95); }
        .btn-sm.primary { background: #0a1e2f; color: white; }
        .btn-sm.primary:hover { background: #1a3a5a; }
        .btn-sm.success { background: #e6f7ec; color: #0d7c4f; }
        .btn-sm.success:hover { background: #c8f0d8; }
        .btn-sm.danger { background: #fde8ed; color: #b51a3f; }
        .btn-sm.danger:hover { background: #fcd0d9; }
        .btn-sm.outline { background: transparent; border: 1px solid #dce5ef; color: #1e3a5f; }
        .btn-sm.outline:hover { background: #f5f8fc; }
        .btn-sm.blue { background: rgba(77,171,247,0.12); color: #2a7faa; }
        .btn-sm.blue:hover { background: rgba(77,171,247,0.2); }

        .flex { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
        .row-two { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 16px; }

        /* ===== 弹窗 ===== */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.5);
            backdrop-filter: blur(4px);
            z-index: 999;
            align-items: center;
            justify-content: center;
        }
        .modal-overlay.show { display: flex; }
        .modal-box {
            background: white;
            border-radius: 20px;
            padding: 24px 28px;
            max-width: 560px;
            width: 92%;
            max-height: 85vh;
            box-shadow: 0 40px 80px rgba(0,0,0,0.3);
            animation: dialogIn 0.25s ease;
            overflow-y: auto;
        }
        .modal-box::-webkit-scrollbar { width: 4px; }
        .modal-box::-webkit-scrollbar-thumb { background: #c8d8e8; border-radius: 10px; }
        @keyframes dialogIn { from { opacity: 0; transform: scale(0.95) translateY(20px); } to { opacity: 1; transform: scale(1) translateY(0); } }
        .modal-box .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 14px;
            padding-bottom: 12px;
            border-bottom: 1px solid #e8edf4;
        }
        .modal-box .modal-header h3 { font-size: 17px; color: #0a1e2f; display: flex; align-items: center; gap: 10px; }
        .modal-box .modal-header .close {
            font-size: 24px; color: #94a3b8; cursor: pointer;
            background: none; border: none; padding: 0 8px; line-height: 1;
        }
        .modal-box .modal-header .close:hover { color: #0a1e2f; }
        .modal-box .modal-body { font-size: 14px; color: #0a1e2f; }
        .modal-box .modal-body .detail-row {
            display: flex; padding: 8px 0; border-bottom: 1px solid #f5f8fc;
        }
        .modal-box .modal-body .detail-row .label { color: #94a3b8; width: 100px; flex-shrink: 0; }
        .modal-box .modal-body .detail-row .value { flex: 1; font-weight: 500; word-break: break-word; }
        .modal-box .modal-actions {
            display: flex; gap: 10px; justify-content: flex-end;
            padding-top: 14px; border-top: 1px solid #e8edf4; margin-top: 14px;
            flex-wrap: wrap;
        }
        .modal-box .form-group { margin-bottom: 12px; }
        .modal-box .form-group label { display: block; font-size: 13px; font-weight: 500; color: #0a1e2f; margin-bottom: 4px; }
        .modal-box .form-group input, .modal-box .form-group textarea, .modal-box .form-group select {
            width: 100%; padding: 8px 14px; border: 1px solid #dce5ef; border-radius: 8px;
            font-size: 14px; background: #fafcfe; font-family: inherit;
        }
        .modal-box .form-group input:focus, .modal-box .form-group textarea:focus {
            outline: none; border-color: #4dabf7; box-shadow: 0 0 0 3px rgba(77,171,247,0.08);
        }
        .modal-box .form-group textarea { min-height: 60px; resize: vertical; }

        /* ===== 物流轨迹时间线 ===== */
        .tracking-timeline { padding: 8px 0; }
        .tracking-timeline .track-node {
            display: flex;
            gap: 14px;
            padding: 6px 0 6px 0;
            position: relative;
        }
        .tracking-timeline .track-node:not(:last-child)::before {
            content: '';
            position: absolute;
            left: 11px;
            top: 26px;
            bottom: 0;
            width: 2px;
            background: #e8edf4;
        }
        .tracking-timeline .track-node .dot {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            color: white;
            flex-shrink: 0;
            z-index: 1;
        }
        .tracking-timeline .track-node .content { flex: 1; }
        .tracking-timeline .track-node .content .status { font-weight: 500; color: #0a1e2f; font-size: 14px; }
        .tracking-timeline .track-node .content .time { font-size: 12px; color: #94a3b8; }
        .tracking-timeline .track-node .content .location { font-size: 13px; color: #5f7d95; }
        .tracking-timeline .track-node .content .desc { font-size: 13px; color: #5f7d95; }

        /* ===== 通知消息气泡 ===== */
        .msg-bubble {
            background: #f0f7fe;
            border-radius: 10px;
            padding: 12px 16px;
            font-size: 13px;
            color: #0a1e2f;
            line-height: 1.7;
            white-space: pre-wrap;
            font-family: inherit;
            border-left: 3px solid #4dabf7;
            margin: 8px 0;
        }

        /* ===== 平台标签 ===== */
        .platform-tag {
            display: inline-block;
            padding: 1px 10px;
            border-radius: 30px;
            font-size: 11px;
            font-weight: 500;
        }
        .platform-tag.taobao { background: #fef0e6; color: #b55a1a; }
        .platform-tag.douyin { background: #e9f0ff; color: #1a5bb5; }
        .platform-tag.pdd { background: #fde8ed; color: #b51a3f; }
        .platform-tag.jd { background: #e6f7ec; color: #0d7c4f; }
        .platform-tag.other { background: #f0f4f9; color: #5f7d95; }

        .scroll-list { max-height: 420px; overflow-y: auto; padding-right: 4px; }
        .scroll-list::-webkit-scrollbar { width: 4px; }
        .scroll-list::-webkit-scrollbar-track { background: #f0f4f9; border-radius: 10px; }
        .scroll-list::-webkit-scrollbar-thumb { background: #c8d8e8; border-radius: 10px; }

        .border-left-warning { border-left: 4px solid #f5b342; }
        .border-left-success { border-left: 4px solid #0d7c4f; }
        .border-left-info { border-left: 4px solid #4dabf7; }

        /* ===== 通知记录 ===== */
        .notification-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 8px 0;
            border-bottom: 1px solid #f5f8fc;
            cursor: pointer;
            transition: 0.12s;
        }
        .notification-item:hover { background: #fafcfe; }
        .notification-item:last-child { border: none; }
        .notification-item .noti-icon {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            color: white;
            flex-shrink: 0;
        }
        .notification-item .noti-content { flex: 1; min-width: 0; }
        .notification-item .noti-content .title { font-weight: 600; color: #0a1e2f; font-size: 13px; }
        .notification-item .noti-content .desc { font-size: 12px; color: #5f7d95; }
        .notification-item .noti-content .time { font-size: 11px; color: #94a3b8; }
        .notification-item .noti-badge { font-size: 10px; padding: 1px 10px; border-radius: 30px; font-weight: 500; flex-shrink: 0; }
        .noti-badge.success { background: #e6f7ec; color: #0d7c4f; }
        .noti-badge.warning { background: #fef0e6; color: #b55a1a; }
        .noti-badge.danger { background: #fde8ed; color: #b51a3f; }
        .noti-badge.info { background: #e9f0ff; color: #1a5bb5; }

        /* ===== 分页 ===== */
        .pagination {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 14px;
            padding-top: 14px;
            border-top: 1px solid #e8edf4;
            flex-wrap: wrap;
            gap: 10px;
        }
        .pagination .pages-info { font-size: 13px; color: #5f7d95; }
        .pagination .pages { display: flex; gap: 6px; flex-wrap: wrap; }
        .page-item {
            padding: 5px 12px;
            border-radius: 8px;
            font-size: 13px;
            cursor: pointer;
            border: 1px solid #dce5ef;
            background: #fff;
            color: #1e3a5f;
            transition: 0.12s;
            user-select: none;
            min-width: 32px;
            text-align: center;
        }
        .page-item:hover:not(.disabled):not(.active) { border-color: #4dabf7; color: #2a7faa; }
        .page-item.active { background: #0a1e2f; border-color: #0a1e2f; color: #fff; }
        .page-item.disabled { opacity: 0.4; cursor: not-allowed; }

        /* ===== 空状态 ===== */
        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: #94a3b8;
        }
        .empty-state i { font-size: 42px; margin-bottom: 10px; display: block; opacity: 0.5; }
        .empty-state p { font-size: 14px; }

        /* ===== Toast ===== */
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: #0a1e2f;
            color: white;
            padding: 12px 28px;
            border-radius: 40px;
            font-size: 14px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            display: none;
            z-index: 99999;
            white-space: nowrap;
            max-width: 90%;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .toast.show { display: block; animation: fadeUp 0.3s ease; }

    <!-- ===== Toast ===== -->
    <div id="toast" class="toast"></div>

    <script>
        // ================================================================
        // ===== 基础工具 =====
        // ================================================================
        function showToast(msg) {
            var toast = document.getElementById('toast');
            toast.innerHTML = msg;
            toast.classList.add('show');
            clearTimeout(toast._timer);
            toast._timer = setTimeout(function() { toast.classList.remove('show'); }, 2500);
        }
        function openModal(id) { document.getElementById(id).classList.add('show'); }
        function closeModal(id) { document.getElementById(id).classList.remove('show'); }

        // ================================================================
        // ===== 数据层 =====
        // ================================================================
        var logisticsProviders = [
            { id: 'SF', name: '顺丰速运', code: 'SF', phone: '95338', site: 'https://www.sf-express.com/chn/sc/waybill/list', color: '#0d7c4f', onTime: 98, score: 95 },
            { id: 'ZTO', name: '中通快递', code: 'ZTO', phone: '95311', site: 'https://www.zto.com/express/expressCheck.html', color: '#4dabf7', onTime: 94, score: 88 },
            { id: 'YTO', name: '圆通速递', code: 'YTO', phone: '95554', site: 'https://www.yto.net.cn/', color: '#f5b342', onTime: 87, score: 82 },
            { id: 'YUNDA', name: '韵达快递', code: 'YUNDA', phone: '95546', site: 'https://www.yundaex.com/cn/index.php', color: '#7b4fa0', onTime: 83, score: 78 }
        ];

        var logisticsOrders = [];
        var orderIdCounter = 1000;
        var currentDetailOrderId = null;
        var currentShipOrderId = null;
        var currentNotifyOrderId = null;
        var currentNotifyDetailId = null;
        var currentHandleOrderId = null;
        var aiNotifications = [];
        var notificationIdCounter = 0;

        var statusMap = {
            '待发货': { badge: 'warning', label: '待发货', icon: 'fa-box' },
            '运输中': { badge: 'info', label: '运输中', icon: 'fa-truck' },
            '派送中': { badge: 'warning', label: '派送中', icon: 'fa-user-clock' },
            '已签收': { badge: 'success', label: '已签收', icon: 'fa-check-circle' },
            '异常': { badge: 'danger', label: '异常', icon: 'fa-exclamation-triangle' }
        };
        var statusFlow = ['待发货', '运输中', '派送中', '已签收'];
        var locations = ['北京转运中心', '上海转运中心', '广州转运中心', '深圳转运中心', '杭州转运中心', '成都转运中心', '武汉转运中心'];
        var platforms = ['淘宝', '抖音', '拼多多', '京东'];

        var surnames = ['王', '张', '李', '刘', '陈', '赵', '周', '吴', '孙', '马'];
        var givenNames = ['婷', '豪', '萱', '阳', '琳', '瑶', '伟', '芳', '军', '敏'];
        var cities = ['北京市朝阳区', '上海市浦东新区', '广州市天河区', '深圳市南山区', '杭州市西湖区', '成都市高新区', '武汉市江汉区'];
        var streets = ['建国路88号', '张杨路88号', '天河路188号', '科技园路68号', '文三路118号', '天府大道188号', '解放大道88号'];

        // 页面状态
        var currentFilter = {
            status: 'all',
            keyword: '',
            phone: '',
            provider: 'all',
            time: 'all'
        };
        var currentPage = 1;
        var PAGE_SIZE = 10;
        var selectedIds = new Set();

        // ================================================================
        // ===== 工具函数 =====
        // ================================================================
        function randomName() { return surnames[Math.floor(Math.random() * surnames.length)] + givenNames[Math.floor(Math.random() * givenNames.length)]; }
        function randomAddress() { return cities[Math.floor(Math.random() * cities.length)] + streets[Math.floor(Math.random() * streets.length)]; }
        function randomProduct() { return products[Math.floor(Math.random() * products.length)]; }
        function randomPlatform() { return platforms[Math.floor(Math.random() * platforms.length)]; }
        function randomPhone() { return '1' + (Math.floor(Math.random() * 9) + 1) + String(Math.floor(Math.random() * 900000000) + 100000000); }
        function maskPhone(p) { return p ? p.slice(0, 3) + '****' + p.slice(-4) : ''; }

        function generateTrackingNumber(providerCode) {
            var prefix = providerCode || 'SF';
            var timestamp = Date.now().toString().slice(-6);
            var random = String(Math.floor(Math.random() * 100000)).padStart(5, '0');
            return prefix + timestamp + random;
        }

        function selectBestProvider() {
            return logisticsProviders[Math.floor(Math.random() * logisticsProviders.length)];
        }

        function getProviderInfo(name) {
            return logisticsProviders.find(function(p) { return p.name === name; });
        }

        function escapeHtml(s) {
            return String(s || '').replace(/[&<>"']/g, function(c) {
                return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
            });
        }

        // ================================================================
        // ===== 复制到剪贴板 =====
        // ================================================================
        function copyToClipboard(text) {
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(text).then(function() {
                    showToast('📋 已复制到剪贴板');
                }).catch(function() {
                    fallbackCopy(text);
                });
            } else {
                fallbackCopy(text);
            }
        }
        function fallbackCopy(text) {
            var ta = document.createElement('textarea');
            ta.value = text;
            ta.style.position = 'fixed';
            ta.style.opacity = '0';
            document.body.appendChild(ta);
            ta.select();
            try {
                document.execCommand('copy');
                showToast('📋 已复制到剪贴板');
            } catch (e) {
                showToast('⚠️ 复制失败，请手动复制');
            }
            document.body.removeChild(ta);
        }

        // ================================================================
        // ===== 构建物流信息文本（用于复制） =====
        // ================================================================
        function buildLogisticsText(order) {
            var lastNode = order.trackingHistory[order.trackingHistory.length - 1];
            return '【订单物流信息】\n' +
                   '订单号：' + order.orderId + '\n' +
                   '商品：' + order.productName + ' × ' + order.quantity + '\n' +
                   '快递：' + order.provider + '\n' +
                   '单号：' + order.trackingNumber + '\n' +
                   '当前状态：' + order.status + '\n' +
                   '最新轨迹：' + (lastNode ? lastNode.location + ' · ' + lastNode.time : '暂无') + '\n' +
                   '预计送达：' + (order.estimatedDelivery || '待更新');
        }

        // ================================================================
        // ===== AI通知服务 =====
        // ================================================================
        var aiMessageTemplates = {
            '淘宝': function(order) {
                return '📦 您的订单已发货！\n订单号: ' + order.orderId + '\n商品: ' + order.productName + ' × ' + order.quantity + '\n快递: ' + order.provider + '\n单号: ' + order.trackingNumber + '\n预计送达: ' + (order.estimatedDelivery || '2-3天') + '\n点击查看物流: https://m.taobao.com/track/' + order.trackingNumber + '\n💬 有问题随时找我~';
            },
            '抖音': function(order) {
                return '🎉 亲，您的订单已发货啦！\n订单号: ' + order.orderId + '\n商品: ' + order.productName + ' × ' + order.quantity + '\n快递: ' + order.provider + ' ' + order.trackingNumber + '\n预计 ' + (order.estimatedDelivery || '2-3天') + ' 送达\n👉 点击查看物流: https://www.douyin.com/track/' + order.trackingNumber + '\n💬 有问题随时找AI客服哦~';
            },
            '拼多多': function(order) {
                return '📦 亲，您的订单已发货！\n订单号: ' + order.orderId + '\n商品: ' + order.productName + ' × ' + order.quantity + '\n物流: ' + order.provider + ' ' + order.trackingNumber + '\n预计送达: ' + (order.estimatedDelivery || '2-3天') + '\n查看物流: https://www.pinduoduo.com/track/' + order.trackingNumber + '\n💬 有问题找AI客服哟~';
            },
            '京东': function(order) {
                return '📦 尊敬的 ' + order.buyerName + '，您的订单已发货！\n订单号: ' + order.orderId + '\n商品: ' + order.productName + ' × ' + order.quantity + '\n快递: ' + order.provider + '\n单号: ' + order.trackingNumber + '\n预计送达: ' + (order.estimatedDelivery || '2-3天') + '\n追踪: https://www.jd.com/track/' + order.trackingNumber + '\n💬 京东AI客服为您服务！';
            }
        };

        function sendAICustomerNotification(order, type) {
            var template = aiMessageTemplates[order.platform] || aiMessageTemplates['淘宝'];
            var message = template(order);
            if (type === 'reminder') {
                message = '📢 温馨提醒\n订单 ' + order.orderId + ' 的包裹当前状态：' + order.status + '\n' +
                          '快递：' + order.provider + '\n单号：' + order.trackingNumber + '\n' +
                          '最新位置：' + (order.trackingHistory[order.trackingHistory.length - 1] || {}).location + '\n' +
                          '请留意签收，有问题随时联系我们~';
            }
            var notification = {
                id: 'noti-' + (++notificationIdCounter),
                orderId: order.orderId,
                orderRefId: order.id,
                platform: order.platform,
                buyerName: order.buyerName,
                productName: order.productName,
                trackingNumber: order.trackingNumber,
                provider: order.provider,
                message: message,
                type: type || 'ship',
                status: '已发送',
                sentAt: new Date().toLocaleString()
            };
            aiNotifications.unshift(notification);
            if (aiNotifications.length > 100) aiNotifications.pop();
            console.log('🤖 [通知-' + order.platform + ']', message);
            return notification;
        }

        // ================================================================
        // ===== 创建订单 =====
        // ================================================================
        function createLogisticsOrder(opts) {
            opts = opts || {};
            var provider = opts.provider || selectBestProvider();
            var trackingNumber = generateTrackingNumber(provider.code);
            var platform = randomPlatform();
            var createdAt = opts.createdAt || new Date().toLocaleString();

            var order = {
                id: 'L-' + Date.now() + '-' + String(++orderIdCounter).padStart(4, '0'),
                orderId: 'PO-' + Date.now().toString().slice(-6) + '-' + String(Math.floor(Math.random() * 1000)).padStart(3, '0'),
                platform: platform,
                productName: randomProduct(),
                quantity: Math.floor(Math.random() * 3) + 1,
                buyerName: randomName(),
                buyerPhone: randomPhone(),
                buyerAddress: randomAddress(),
                provider: provider.name,
                trackingNumber: trackingNumber,
                status: '待发货',
                shippedAt: null,
                deliveredAt: null,
                trackingHistory: [
                    { time: createdAt, status: '订单创建', location: '系统', desc: '订单已创建，等待发货' }
                ],
                isAbnormal: false,
                abnormalReason: null,
                abnormalHandled: false,
                abnormalHandleNote: '',
                aiNotificationSent: false,
                notificationStatus: '待通知',
                createdAt: createdAt,
                updatedAt: createdAt,
                estimatedDelivery: new Date(Date.now() + 2 * 24 * 3600 * 1000).toLocaleString()
            };
            logisticsOrders.push(order);
            return order;
        }

        // ================================================================
        // ===== 发货 =====
        // ================================================================
        function shipOrder(orderId, provider, trackingNumber) {
            var order = logisticsOrders.find(function(o) { return o.id === orderId; });
            if (!order || order.status !== '待发货') return false;

            order.status = '运输中';
            order.provider = provider || order.provider;
            order.trackingNumber = trackingNumber || order.trackingNumber;
            order.shippedAt = new Date().toLocaleString();
            order.updatedAt = new Date().toLocaleString();

            order.trackingHistory.push({
                time: new Date().toLocaleString(),
                status: '运输中',
                location: order.provider + ' · 已揽收',
                desc: '包裹已交由 ' + order.provider + ' 揽收发货'
            });

            sendAICustomerNotification(order, 'ship');
            order.aiNotificationSent = true;
            order.notificationStatus = '已通知';
            return true;
        }

        // ================================================================
        // ===== 筛选逻辑 =====
        // ================================================================
        function matchTime(order) {
            if (currentFilter.time === 'all') return true;
            var created = new Date(order.createdAt);
            var now = new Date();
            var diffDays = (now - created) / (24 * 3600 * 1000);
            if (currentFilter.time === 'today') return created.toDateString() === now.toDateString();
            if (currentFilter.time === 'yesterday') {
                var y = new Date(now.getTime() - 24 * 3600 * 1000);
                return created.toDateString() === y.toDateString();
            }
            if (currentFilter.time === '7days') return diffDays <= 7;
            if (currentFilter.time === '30days') return diffDays <= 30;
            return true;
        }

        function matchFilter(order) {
            if (currentFilter.status !== 'all' && order.status !== currentFilter.status) return false;
            if (currentFilter.provider !== 'all' && order.provider !== currentFilter.provider) return false;
            if (currentFilter.phone) {
                if (!order.buyerPhone.includes(currentFilter.phone)) return false;
            }
            if (currentFilter.keyword) {
                var text = (order.orderId + ' ' + order.trackingNumber + ' ' + order.buyerName + ' ' + order.productName).toLowerCase();
                if (!text.includes(currentFilter.keyword)) return false;
            }
            if (!matchTime(order)) return false;
            return true;
        }

        function getFilteredOrders() {
            return logisticsOrders.filter(matchFilter);
        }

        function isOverdue(order) {
            if (order.status !== '待发货') return false;
            var created = new Date(order.createdAt);
            return (Date.now() - created) > 48 * 3600 * 1000;
        }

        // ================================================================
        // ===== 渲染：Tab 计数 / 统计 / 列表 / 分页 =====
        // ================================================================
        function renderTabCounts() {
            var counts = {
                'all': logisticsOrders.length,
                '待发货': 0,
                '运输中': 0,
                '派送中': 0,
                '已签收': 0,

                '超时未发货': 0
            };

                if (counts[o.status] !== undefined) counts[o.status]++;

            });
            document.getElementById('tabAllCount').textContent = counts['all'];
            document.getElementById('tabPendingCount').textContent = counts['待发货'];
            document.getElementById('tabShippingCount').textContent = counts['运输中'];
            document.getElementById('tabDeliveringCount').textContent = counts['派送中'];
            document.getElementById('tabDeliveredCount').textContent = counts['已签收'];

            document.getElementById('tabOverdueCount').textContent = counts['超时未发货'];

        function renderStats() {
            var pending = logisticsOrders.filter(function(o) { return o.status === '待发货'; }).length;
            var shipping = logisticsOrders.filter(function(o) { return o.status === '运输中'; }).length;
            var delivering = logisticsOrders.filter(function(o) { return o.status === '派送中'; }).length;
            var delivered = logisticsOrders.filter(function(o) { return o.status === '已签收'; }).length;
            var abnormal = logisticsOrders.filter(function(o) { return o.isAbnormal; }).length;

            document.getElementById('pendingCount').textContent = pending;
            document.getElementById('shippingCount').textContent = shipping;
            document.getElementById('deliveringCount').textContent = delivering;
            document.getElementById('deliveredCount').textContent = delivered;
            document.getElementById('abnormalCount').textContent = abnormal;
        }

        function renderOrderList() {
            var container = document.getElementById('orderList');
            var filtered = getFilteredOrders();

            // 超时未发货 特殊处理
            if (currentFilter.overdueOnly) {
                filtered = filtered.filter(isOverdue);
            }

            if (filtered.length === 0) {
                container.innerHTML = '<div class="empty-state"><i class="fas fa-inbox"></i><p>没有符合条件的订单</p></div>';
                document.getElementById('pagesInfo').textContent = '显示 0-0 条 / 共 0 条';
                document.getElementById('pagesContainer').innerHTML = '';
                return;
            }

            // 分页
            var totalPages = Math.max(1, Math.ceil(filtered.length / PAGE_SIZE));
            if (currentPage > totalPages) currentPage = totalPages;
            var start = (currentPage - 1) * PAGE_SIZE;
            var pageData = filtered.slice(start, start + PAGE_SIZE);

            // 表头全选
            var allOnPage = pageData.every(function(o) { return selectedIds.has(o.id); });
            document.getElementById('selectAllCheckbox').checked = allOnPage && pageData.length > 0;

            var html = '';
            pageData.forEach(function(order) {
                var statusInfo = statusMap[order.status] || statusMap['待发货'];
                var checked = selectedIds.has(order.id) ? 'checked' : '';
                var isOverdueOrder = isOverdue(order);

                // 进度条
                var progressPercent = 0;
                var statusIndex = statusFlow.indexOf(order.status);
                if (statusIndex >= 0) progressPercent = ((statusIndex + 1) / statusFlow.length) * 100;
                var barClass = order.isAbnormal ? 'danger' : (order.status === '已签收' ? 'success' : '');

                // 操作按钮（核心）
                var ops = '';
                if (order.status === '待发货') {
                    ops += '<button class="op-btn" title="发货" onclick="event.stopPropagation();openShipDialog(\'' + order.id + '\')" style="border-color:#0d7c4f;color:#0d7c4f;background:#f0fff8;"><i class="fas fa-box"></i></button>';
                }
                ops += '<button class="op-btn copy" title="复制物流信息" onclick="event.stopPropagation();copyOrderInfo(\'' + order.id + '\')"><i class="fas fa-copy"></i></button>';
                if (order.status !== '待发货') {
                    ops += '<button class="op-btn notify" title="通知客户" onclick="event.stopPropagation();openNotifyDialog(\'' + order.id + '\')"><i class="fas fa-bell"></i></button>';
                }
                ops += '<button class="op-btn track" title="查看轨迹" onclick="event.stopPropagation();showLogisticsDetail(\'' + order.id + '\')"><i class="fas fa-map-marker-alt"></i></button>';
                if (order.status === '异常') {
                    ops += '<button class="op-btn handle" title="处理异常" onclick="event.stopPropagation();openHandleDialog(\'' + order.id + '\')"><i class="fas fa-tools"></i></button>';
                }

                html += `
                    <div class="logistics-item">
                        <div class="checkbox-wrap">
                            <input type="checkbox" ${checked} onchange="toggleSelect('${order.id}', this)">
                        </div>
                        <div class="info" onclick="showLogisticsDetail('${order.id}')" style="cursor:pointer;">
                            <div class="name">
                                ${escapeHtml(order.productName)} × ${order.quantity}
                                <span class="badge ${statusInfo.badge}"><i class="fas ${statusInfo.icon}"></i> ${order.status}</span>
                                <span class="platform-tag ${platClass(order.platform)}">${order.platform}</span>
                                ${isOverdueOrder ? '<span class="badge danger"><i class="fas fa-clock"></i> 超时未发货</span>' : ''}
                                ${order.isAbnormal ? '<span class="badge danger"><i class="fas fa-exclamation"></i> 异常</span>' : ''}
                            </div>
                            <div class="meta">
                                <span><i class="fas fa-file-invoice"></i> ${order.orderId}</span>
                                <span><i class="fas fa-user"></i> ${escapeHtml(order.buyerName)}</span>
                                <span><i class="fas fa-mobile-alt" style="color:#7b4fa0;"></i> ${maskPhone(order.buyerPhone)}</span>
                                ${order.status !== '待发货' ? '<span><i class="fas fa-tag"></i> ' + order.trackingNumber + '</span>' : ''}
                                <span><i class="fas fa-store"></i> ${order.provider}</span>
                            </div>
                            ${order.status !== '待发货' ? `
                                <div class="logistics-progress">
                                    <span>待发货</span>
                                    <div class="bar"><div class="fill ${barClass}" style="width:${progressPercent}%;"></div></div>
                                    <span>已签收</span>
                                </div>
                            ` : ''}
                        </div>
                        <div class="right">
                            <div class="op-group">${ops}</div>
                            <span style="font-size:11px;color:#94a3b8;margin-top:2px;">${order.createdAt}</span>
                        </div>
                    </div>
                `;
            });
            container.innerHTML = html;

            // 分页信息
            document.getElementById('pagesInfo').textContent =
                '显示 ' + (start + 1) + '-' + Math.min(start + PAGE_SIZE, filtered.length) + ' 条 / 共 ' + filtered.length + ' 条';

            // 分页按钮
            renderPagination(totalPages);
        }

        function platClass(p) {
            return { '淘宝': 'taobao', '抖音': 'douyin', '拼多多': 'pdd', '京东': 'jd' }[p] || 'other';
        }

        function renderPagination(totalPages) {
            var container = document.getElementById('pagesContainer');
            var html = '';
            html += '<span class="page-item ' + (currentPage === 1 ? 'disabled' : '') + '" onclick="gotoPage(' + (currentPage - 1) + ')"><i class="fas fa-chevron-left"></i></span>';

            var pages = [];
            if (totalPages <= 7) {
                for (var i = 1; i <= totalPages; i++) pages.push(i);
            } else {
                pages.push(1);
                if (currentPage > 3) pages.push('...');
                for (var i = Math.max(2, currentPage - 1); i <= Math.min(totalPages - 1, currentPage + 1); i++) pages.push(i);
                if (currentPage < totalPages - 2) pages.push('...');
                pages.push(totalPages);
            }
            pages.forEach(function(p) {
                if (p === '...') {
                    html += '<span class="page-item disabled">...</span>';
                } else {
                    html += '<span class="page-item ' + (p === currentPage ? 'active' : '') + '" onclick="gotoPage(' + p + ')">' + p + '</span>';
                }
            });

            html += '<span class="page-item ' + (currentPage === totalPages ? 'disabled' : '') + '" onclick="gotoPage(' + (currentPage + 1) + ')"><i class="fas fa-chevron-right"></i></span>';
            container.innerHTML = html;
        }

        function gotoPage(p) {
            var total = getFilteredOrders().length;
            if (currentFilter.overdueOnly) total = getFilteredOrders().filter(isOverdue).length;
            var totalPages = Math.max(1, Math.ceil(total / PAGE_SIZE));
            if (p < 1 || p > totalPages) return;
            currentPage = p;
            renderOrderList();
            document.getElementById('orderList').scrollTop = 0;
        }

        function renderProviderPerformance() {
            var container = document.getElementById('providerPerformance');
            var html = '';
            logisticsProviders.forEach(function(p) {
                var orders = logisticsOrders.filter(function(o) { return o.provider === p.name; });
                var count = orders.length;
                var delivered = orders.filter(function(o) { return o.status === '已签收'; }).length;
                var abnormal = orders.filter(function(o) { return o.isAbnormal; }).length;

                                <span style="font-size:11px;color:#94a3b8;font-weight:400;">客服 ${p.phone}</span>
                            </div>
                            <div class="meta">
                                <span><i class="fas fa-percent"></i> 准时率 ${p.onTime}%</span>
                                <span><i class="fas fa-box"></i> 订单 ${count}单</span>
                                <span><i class="fas fa-check-circle"></i> 妥投 ${rate}%</span>

                            </div>

                        <div class="right">
                            <span style="font-size:12px;color:${p.color};">评分 ${p.score}</span>
                        </div>
                    </div>
                `;
            });
            container.innerHTML = html;
        }

        function renderAll() {
            renderTabCounts();
            renderStats();
            renderOrderList();
            renderNotifications();
            renderProviderPerformance();
        }

            if (el.checked) selectedIds.add(id);
            else selectedIds.delete(id);
            updateBatchBar();
        }

        function toggleSelectAll(el) {
            var filtered = getFilteredOrders();
            if (currentFilter.overdueOnly) filtered = filtered.filter(isOverdue);
            var start = (currentPage - 1) * PAGE_SIZE;
            var pageData = filtered.slice(start, start + PAGE_SIZE);

                if (el.checked) selectedIds.add(o.id);

        function doSendNotification() {
            if (!currentNotifyOrderId) return;
            var order = logisticsOrders.find(function(o) { return o.id === currentNotifyOrderId; });
            if (!order) return;

            var type = document.getElementById('notifyType').value;
            var content = document.getElementById('notifyContent').value.trim();

            var notification = {
                id: 'noti-' + (++notificationIdCounter),
                orderId: order.orderId,
                orderRefId: order.id,
                platform: order.platform,
                buyerName: order.buyerName,
                productName: order.productName,
                trackingNumber: order.trackingNumber,
                provider: order.provider,
                message: content,
                type: type,
                status: '已发送',
                sentAt: new Date().toLocaleString()
            };
            aiNotifications.unshift(notification);
            order.aiNotificationSent = true;
            order.notificationStatus = '已通知';

        function openHandleDialog(orderId) {
            currentHandleOrderId = orderId;
            var order = logisticsOrders.find(function(o) { return o.id === orderId; });
            if (!order) return;

            var body = document.getElementById('handleModalBody');
            body.innerHTML = `

                <div class="detail-row"><span class="label">物流单号</span><span class="value" style="font-family:monospace;">${order.trackingNumber}</span></div>
                <div class="detail-row"><span class="label">快递商</span><span class="value">${order.provider}</span></div>
                <div style="margin:8px 0;padding:10px;background:#fde8ed;border-radius:8px;color:#b51a3f;font-size:13px;">
                    <i class="fas fa-exclamation-triangle"></i> ${order.abnormalReason || '物流信息异常'}
                </div>
                <div class="form-group">
                    <label>处理方式</label>
                    <select id="handleAction">
                        <option value="contacted">已联系快递商催件</option>
                        <option value="customer">已联系客户安抚</option>
                        <option value="refund">客户要求退款，已受理</option>
                        <option value="wait">继续等待，暂不处理</option>
                        <option value="resolve">问题已解决，恢复运输</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>处理备注</label>
                    <textarea id="handleNote" placeholder="记录处理过程，便于交接..."></textarea>
                </div>
            `;
            openModal('handleModal');
        }

        function doHandleAbnormal() {
            if (!currentHandleOrderId) return;
            var order = logisticsOrders.find(function(o) { return o.id === currentHandleOrderId; });
            if (!order) return;

            var action = document.getElementById('handleAction').value;
            var note = document.getElementById('handleNote').value.trim();

            order.abnormalHandled = true;
            order.abnormalHandleNote = note;
            order.handleAction = action;

            if (action === 'resolve') {
                order.isAbnormal = false;
                order.abnormalReason = null;
                order.status = '运输中';
            }
            order.updatedAt = new Date().toLocaleString();
            order.trackingHistory.push({
                time: new Date().toLocaleString(),
                status: '处理',
                location: '客服',
                desc: '异常处理：' + actionLabel(action) + (note ? ' · ' + note : '')
            });

            closeModal('handleModal');
            renderAll();
            showToast('✅ 异常已处理');
        }

        function actionLabel(a) {
            return {
                contacted: '已联系快递商',
                customer: '已联系客户',
                refund: '已受理退款',
                wait: '继续等待',
                resolve: '已恢复运输'
            }[a] || a;
        }

        function openNotifyDetail(notiId) {
            var n = aiNotifications.find(function(x) { return x.id === notiId; });
            if (!n) return;
            currentNotifyDetailId = notiId;
            var body = document.getElementById('notifyDetailBody');
            body.innerHTML = `
                <div class="detail-row"><span class="label">订单号</span><span class="value">${n.orderId}</span></div>
                <div class="detail-row"><span class="label">买家</span><span class="value">${escapeHtml(n.buyerName)}</span></div>
                <div class="detail-row"><span class="label">平台</span><span class="value"><span class="platform-tag ${platClass(n.platform)}">${n.platform}</span></span></div>
                <div class="detail-row"><span class="label">类型</span><span class="value">${n.type === 'reminder' ? '催单提醒' : '发货通知'}</span></div>
                <div class="detail-row"><span class="label">发送时间</span><span class="value">${n.sentAt}</span></div>
                <div style="margin-top:12px;font-size:13px;font-weight:600;color:#0a1e2f;">消息内容</div>
                <div class="msg-bubble">${escapeHtml(n.message)}</div>
            `;
            openModal('notifyDetailModal');
        }

        function resendNotification() {
            if (!currentNotifyDetailId) return;
            var n = aiNotifications.find(function(x) { return x.id === currentNotifyDetailId; });
            if (!n) return;
            var order = logisticsOrders.find(function(o) { return o.id === n.orderRefId; });
            if (!order) { showToast('⚠️ 订单不存在'); return; }

            var newNoti = {
                id: 'noti-' + (++notificationIdCounter),
                orderId: order.orderId,
                orderRefId: order.id,
                platform: order.platform,
                buyerName: order.buyerName,
                productName: order.productName,
                trackingNumber: order.trackingNumber,
                provider: order.provider,
                message: n.message,
                type: n.type,
                status: '已发送',
                sentAt: new Date().toLocaleString()
            };
            aiNotifications.unshift(newNoti);
            closeModal('notifyDetailModal');
            renderAll();
            showToast('✅ 已再次通知客户');
        }

        // ================================================================
        // ===== 批量操作 =====
        // ================================================================
        function batchNotify() {
            if (selectedIds.size === 0) { showToast('⚠️ 请先选择订单'); return; }
            var count = 0;
            selectedIds.forEach(function(id) {
                var order = logisticsOrders.find(function(o) { return o.id === id; });
                if (order && order.status !== '待发货') {
                    sendAICustomerNotification(order, 'reminder');
                    count++;
                }
            });
            clearSelection();
            renderAll();
            showToast('✅ 已批量通知 ' + count + ' 位客户');
        }

        function batchCopy() {
            if (selectedIds.size === 0) { showToast('⚠️ 请先选择订单'); return; }
            var texts = [];
            selectedIds.forEach(function(id) {
                var order = logisticsOrders.find(function(o) { return o.id === id; });
                if (order) texts.push(buildLogisticsText(order));
            });
            copyToClipboard(texts.join('\n\n==========\n\n'));
        }

        function batchExport() {
            if (selectedIds.size === 0) { showToast('⚠️ 请先选择订单'); return; }
            var text = '===== 物流信息批量导出 =====\n生成时间: ' + new Date().toLocaleString() + '\n\n';
            selectedIds.forEach(function(id) {
                var order = logisticsOrders.find(function(o) { return o.id === id; });
                if (order) {
                    text += buildLogisticsText(order) + '\n\n----------\n\n';
                }
            });
            var blob = new Blob([text], { type: 'text/plain' });
            var a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = '物流信息_' + new Date().toISOString().slice(0, 10) + '.txt';
            a.click();
            showToast('📥 已导出 ' + selectedIds.size + ' 条订单');
        }

        // ================================================================
        // ===== 详情弹窗（含操作按钮） =====
        // ================================================================
        function showLogisticsDetail(orderId) {
            currentDetailOrderId = orderId;
            var order = logisticsOrders.find(function(o) { return o.id === orderId; });
            if (!order) return;

            var body = document.getElementById('detailModalBody');
            var actions = document.getElementById('detailModalActions');
            var statusInfo = statusMap[order.status] || statusMap['待发货'];

            // 时间轴
            var timelineHtml = '';
            order.trackingHistory.slice().reverse().forEach(function(t, idx) {
                var isFirst = idx === 0;
                var dotColor = t.status === '异常' ? '#b51a3f' : (isFirst ? '#4dabf7' : '#0d7c4f');
                timelineHtml += `
                    <div class="track-node">
                        <div class="dot" style="background:${dotColor};">
                            <i class="fas ${t.status === '异常' ? 'fa-exclamation' : 'fa-check'}"></i>
                        </div>
                        <div class="content">
                            <div class="status">${t.status}</div>
                            <div class="location">${t.location || '—'}</div>
                            ${t.desc ? '<div class="desc">' + t.desc + '</div>' : ''}
                            <div class="time">${t.time}</div>
                        </div>
                    </div>
                `;
            });

            // 联系快递按钮
            var providerInfo = getProviderInfo(order.provider);
            var contactBtn = providerInfo ? `
                <a class="btn-sm outline" href="tel:${providerInfo.phone}" style="text-decoration:none;">
                    <i class="fas fa-phone"></i> 电话客服 ${providerInfo.phone}
                </a>
                <a class="btn-sm outline" href="${providerInfo.site}" target="_blank" style="text-decoration:none;">
                    <i class="fas fa-external-link-alt"></i> 官网查件
                </a>
            ` : '';

            body.innerHTML = `
                <div class="detail-row"><span class="label">订单号</span><span class="value">${order.orderId}</span></div>
                <div class="detail-row"><span class="label">物流单号</span><span class="value" style="font-family:monospace;color:#4dabf7;">${order.trackingNumber}</span></div>
                <div class="detail-row"><span class="label">商品</span><span class="value">${escapeHtml(order.productName)} × ${order.quantity}</span></div>
                <div class="detail-row"><span class="label">平台</span><span class="value"><span class="platform-tag ${platClass(order.platform)}">${order.platform}</span></span></div>
                <div class="detail-row"><span class="label">买家</span><span class="value">${escapeHtml(order.buyerName)} · ${maskPhone(order.buyerPhone)}</span></div>
                <div class="detail-row"><span class="label">收货地址</span><span class="value">${escapeHtml(order.buyerAddress)}</span></div>
                <div class="detail-row"><span class="label">快递商</span><span class="value">${order.provider}</span></div>
                <div class="detail-row"><span class="label">状态</span><span class="value"><span class="badge ${statusInfo.badge}"><i class="fas ${statusInfo.icon}"></i> ${order.status}</span></span></div>
                <div class="detail-row"><span class="label">通知状态</span><span class="value">${order.aiNotificationSent ? '<span class="badge success">已通知</span>' : '<span class="badge warning">待通知</span>'}</span></div>
                <div class="detail-row"><span class="label">预计送达</span><span class="value">${order.estimatedDelivery || '待更新'}</span></div>
                ${contactBtn ? '<div style="margin-top:10px;display:flex;gap:8px;flex-wrap:wrap;">' + contactBtn + '</div>' : ''}
                ${order.isAbnormal ? '<div style="margin:10px 0;padding:10px;background:#fde8ed;border-radius:8px;color:#b51a3f;font-size:13px;"><i class="fas fa-exclamation-triangle"></i> ' + escapeHtml(order.abnormalReason) + '</div>' : ''}
                ${order.abnormalHandled && order.abnormalHandleNote ? '<div style="margin:10px 0;padding:10px;background:#f0fff8;border-radius:8px;color:#0d7c4f;font-size:13px;"><i class="fas fa-check-circle"></i> 处理备注：' + escapeHtml(order.abnormalHandleNote) + '</div>' : ''}
                <div style="margin-top:12px;padding-top:12px;border-top:1px solid #eef2f6;">
                    <div style="font-weight:600;font-size:14px;margin-bottom:8px;"><i class="fas fa-history"></i> 物流轨迹</div>
                    <div class="tracking-timeline">${timelineHtml}</div>
                </div>
            `;

            // 底部操作按钮
            var actionsHtml = '<button class="btn-sm outline" onclick="closeModal(\'detailModal\')">关闭</button>';
            actionsHtml += '<button class="btn-sm blue" onclick="copyOrderInfo(\'' + order.id + '\')"><i class="fas fa-copy"></i> 复制物流信息</button>';
            if (order.status !== '待发货') {
                actionsHtml += '<button class="btn-sm primary" onclick="closeModal(\'detailModal\');openNotifyDialog(\'' + order.id + '\')"><i class="fas fa-bell"></i> 通知客户</button>';
            }
            if (order.status === '待发货') {
                actionsHtml += '<button class="btn-sm success" onclick="closeModal(\'detailModal\');openShipDialog(\'' + order.id + '\')"><i class="fas fa-box"></i> 发货</button>';
            }
            if (order.status === '异常') {
                actionsHtml += '<button class="btn-sm danger" onclick="closeModal(\'detailModal\');openHandleDialog(\'' + order.id + '\')"><i class="fas fa-tools"></i> 处理异常</button>';
            }
            actions.innerHTML = actionsHtml;

            openModal('detailModal');
        }

        // ================================================================
        // ===== 发货弹窗 =====
        // ================================================================
        function openShipDialog(orderId) {
            currentShipOrderId = orderId;
            var order = logisticsOrders.find(function(o) { return o.id === orderId; });
            if (!order) return;

            var body = document.getElementById('shipModalBody');
            var providerOptions = logisticsProviders.map(function(p) {
                return '<option value="' + p.name + '">' + p.name + '</option>';
            }).join('');

            body.innerHTML = `
                <div class="detail-row"><span class="label">订单号</span><span class="value">${order.orderId}</span></div>
                <div class="detail-row"><span class="label">商品</span><span class="value">${escapeHtml(order.productName)} × ${order.quantity}</span></div>
                <div class="detail-row"><span class="label">平台</span><span class="value"><span class="platform-tag ${platClass(order.platform)}">${order.platform}</span></span></div>
                <div class="detail-row"><span class="label">买家</span><span class="value">${escapeHtml(order.buyerName)} · ${maskPhone(order.buyerPhone)}</span></div>
                <div class="detail-row"><span class="label">收货地址</span><span class="value">${escapeHtml(order.buyerAddress)}</span></div>
                <div style="margin-top:12px;">
                    <div class="form-group">
                        <label>快递公司</label>
                        <select id="shipProvider">${providerOptions}</select>
                    </div>
                    <div class="form-group">
                        <label>物流单号</label>
                        <input type="text" id="shipTrackingNumber" placeholder="请输入物流单号...">
                    </div>
                </div>
                <div style="margin-top:10px;padding:10px;background:#f0f7fe;border-radius:8px;font-size:13px;color:#2a7faa;border-left:3px solid #4dabf7;">
                    <i class="fas fa-robot"></i> 确认发货后，将自动通知买家
                </div>
            `;
            openModal('shipModal');
        }

        function doConfirmShip() {
            if (!currentShipOrderId) return;
            var provider = document.getElementById('shipProvider').value;
            var trackingNumber = document.getElementById('shipTrackingNumber').value.trim();
            if (!trackingNumber) { showToast('⚠️ 请输入物流单号'); return; }

            if (shipOrder(currentShipOrderId, provider, trackingNumber)) {
                closeModal('shipModal');
                renderAll();
                showToast('✅ 订单已发货，已通知买家');
            }
        }

        // ================================================================
        // ===== 模拟物流进度（静默运行，不做展示按钮） =====
        // ================================================================
        function simulateLogisticsUpdate() {
            logisticsOrders.forEach(function(order) {
                if (order.status === '运输中' || order.status === '派送中') {
                    var idx = statusFlow.indexOf(order.status);
                    if (idx < statusFlow.length - 1 && Math.random() < 0.15) {
                        var newStatus = statusFlow[idx + 1];
                        var loc = locations[Math.floor(Math.random() * locations.length)];
                        order.status = newStatus;
                        order.updatedAt = new Date().toLocaleString();
                        if (newStatus === '已签收') order.deliveredAt = new Date().toLocaleString();
                        order.trackingHistory.push({
                            time: new Date().toLocaleString(),
                            status: newStatus,
                            location: loc,
                            desc: newStatus === '已签收' ? '包裹已签收' : '包裹已到达 ' + loc
                        });
                    }
                }
            });
            detectAbnormal();
        }

        function detectAbnormal() {
            var now = new Date();
            logisticsOrders.forEach(function(order) {
                if (order.status === '已签收' || order.isAbnormal) return;
                if (order.status === '待发货') return;
                var hours = (now - new Date(order.updatedAt)) / 3600000;
                if (hours > 24) {
                    order.isAbnormal = true;
                    order.abnormalReason = '物流信息超过24小时未更新';
                    order.status = '异常';
                    order.trackingHistory.push({
                        time: new Date().toLocaleString(),
                        status: '异常',
                        location: '系统',
                        desc: '⚠️ ' + order.abnormalReason
                    });
                }
            });
        }

        // ================================================================
        // ===== 导出报告 =====
        // ================================================================
        function exportReport() {
            var text = '===== 物流报告 =====\n生成时间: ' + new Date().toLocaleString() + '\n\n';
            var pending = logisticsOrders.filter(function(o) { return o.status === '待发货'; }).length;
            var shipping = logisticsOrders.filter(function(o) { return o.status === '运输中'; }).length;
            var delivering = logisticsOrders.filter(function(o) { return o.status === '派送中'; }).length;
            var delivered = logisticsOrders.filter(function(o) { return o.status === '已签收'; }).length;
            var abnormal = logisticsOrders.filter(function(o) { return o.isAbnormal; }).length;

            text += '📊 统计:\n';
            text += '  待发货: ' + pending + '\n';
            text += '  运输中: ' + shipping + '\n';
            text += '  派送中: ' + delivering + '\n';
            text += '  已签收: ' + delivered + '\n';
            text += '  异常: ' + abnormal + '\n\n';

            text += '📋 订单明细:\n';
            logisticsOrders.forEach(function(o) {
                text += '  ' + o.orderId + ' | ' + o.productName + ' | ' + o.status + ' | ' + o.trackingNumber + '\n';
            });

            var blob = new Blob([text], { type: 'text/plain' });
            var a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = '物流报告_' + new Date().toISOString().slice(0, 10) + '.txt';
            a.click();
            showToast('📥 物流报告已导出');
        }

        // ================================================================
        // ===== 初始化 =====
        // ================================================================
        document.addEventListener('DOMContentLoaded', function() {
            // 生成初始数据（含各种状态）
            var initStatuses = ['待发货', '待发货', '待发货', '运输中', '运输中', '派送中', '已签收', '已签收', '已签收', '异常'];
            // 补一些数据以演示分页
            for (var i = 0; i < 22; i++) {
                var order = createLogisticsOrder();
                var s = initStatuses[i % initStatuses.length];
                if (s !== '待发货') {
                    var provider = selectBestProvider();
                    shipOrder(order.id, provider.name, generateTrackingNumber(provider.code));
                    // 推进到目标状态
                    var targetIdx = statusFlow.indexOf(s);
                    var curIdx = statusFlow.indexOf(order.status);
                    while (curIdx < targetIdx && curIdx < statusFlow.length - 1) {
                        curIdx++;
                        order.status = statusFlow[curIdx];
                        order.trackingHistory.push({
                            time: new Date(Date.now() - Math.random() * 24 * 3600 * 1000).toLocaleString(),
                            status: order.status,
                            location: locations[Math.floor(Math.random() * locations.length)],
                            desc: '包裹已更新'
                        });
                    }
                    if (s === '异常') {
                        order.isAbnormal = true;
                        order.abnormalReason = '物流信息超过24小时未更新';
                        order.status = '异常';
                        order.trackingHistory.push({
                            time: new Date().toLocaleString(),
                            status: '异常',
                            location: '系统',
                            desc: '⚠️ ' + order.abnormalReason
                        });
                    }
                }
            }

            // 造 2 个超时未发货
            for (var j = 0; j < 2; j++) {
                var o = createLogisticsOrder();
                o.createdAt = new Date(Date.now() - 3 * 24 * 3600 * 1000).toLocaleString();
                o.updatedAt = o.createdAt;
            }

            renderAll();

            // 静默后台监控（每 15 秒模拟一次物流推进）
            setInterval(function() {
                simulateLogisticsUpdate();
                renderAll();
            }, 15000);

            showToast('📦 智能物流中心已启动');
        });

        // 暴露全局
        window.copyOrderInfo = copyOrderInfo;
        window.openNotifyDialog = openNotifyDialog;
        window.onNotifyTypeChange = onNotifyTypeChange;
        window.doSendNotification = doSendNotification;
        window.openHandleDialog = openHandleDialog;
        window.doHandleAbnormal = doHandleAbnormal;
        window.openNotifyDetail = openNotifyDetail;
        window.resendNotification = resendNotification;
        window.showLogisticsDetail = showLogisticsDetail;
        window.openShipDialog = openShipDialog;
        window.doConfirmShip = doConfirmShip;
        window.applyFilters = applyFilters;
        window.resetFilters = resetFilters;
        window.refreshAll = refreshAll;
        window.switchStatusTab = switchStatusTab;
        window.toggleSelect = toggleSelect;
        window.toggleSelectAll = toggleSelectAll;
        window.clearSelection = clearSelection;
        window.batchNotify = batchNotify;
        window.batchCopy = batchCopy;
        window.batchExport = batchExport;
        window.gotoPage = gotoPage;
        window.exportReport = exportReport;
        window.openModal = openModal;
        window.closeModal = closeModal;
        window.showToast = showToast;
    </script>
</body>
</html>
