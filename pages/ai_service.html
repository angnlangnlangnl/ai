<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>AI 客服</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="../css/common.css">
    <script src="../js/auth.js"></script>
    <script>requireLogin();</script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        html, body { height: 100%; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: #eef2f8;
            color: #0a1a2b;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* ===== 工具条 ===== */
        .toolbar {
            background: #fff;
            border-bottom: 1px solid #e8edf4;
            padding: 10px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
            flex-shrink: 0;
        }
        .toolbar .tb-left {
            display: flex; align-items: center; gap: 12px;
            font-size: 13px; color: #5f7d95;
            min-width: 0;
        }
        .toolbar .tb-left .status-dot {
            width: 8px; height: 8px; border-radius: 50%;
            background: #0d7c4f;
            animation: pulse 2s infinite;
            flex-shrink: 0;
        }
        @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }
        .toolbar .tb-left strong { color: #0a1e2f; }
        .toolbar .tb-right { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
        .toolbar .tb-btn {
            padding: 6px 14px; border-radius: 20px;
            border: 1px solid #dce5ef; background: #fff;
            color: #1e3a5f; font-size: 12px; font-weight: 500;
            cursor: pointer; display: inline-flex; align-items: center; gap: 5px;
            transition: 0.12s; font-family: inherit; white-space: nowrap;
        }
        .toolbar .tb-btn:hover {
            border-color: #4dabf7; color: #2a7faa; background: #f5f9fe;
        }
        .toolbar .tb-btn i { color: #5f7d95; }
        .toolbar .tb-btn:hover i { color: #4dabf7; }

        /* ===== 统计卡片 ===== */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 14px;
            padding: 16px 20px 8px;
            flex-shrink: 0;
        }
        .stat-card {
            background: #fff;
            padding: 14px 18px;
            border-radius: 14px;
            border: 1px solid #e8edf4;
            box-shadow: 0 2px 8px rgba(10,30,47,0.02);
            transition: 0.15s;
        }
        .stat-card:hover {
            box-shadow: 0 6px 20px rgba(10,30,47,0.06);
            border-color: #c8d8e8;
        }
        .stat-card .label {
            font-size: 12px; font-weight: 500; color: #5f7d95;
            display: flex; align-items: center; gap: 6px;
            margin-bottom: 4px;
        }
        .stat-card .label i { color: #4dabf7; }
        .stat-card .value {
            font-size: 22px; font-weight: 700; color: #0a1e2f;
            letter-spacing: -0.02em;
            display: flex; align-items: baseline; gap: 6px;
        }
        .stat-card .value small {
            font-size: 12px; color: #5f7d95; font-weight: 400;
        }
        .stat-card .trend {
            font-size: 11px; font-weight: 500;
            background: #e6f7ec; color: #0d7c4f;
            padding: 1px 8px; border-radius: 20px;
            display: inline-block;
        }
        .stat-card .trend.down { background: #fde8ed; color: #b51a3f; }

        /* ===== 主体布局 ===== */
        .app-body {
            flex: 1;
            display: flex;
            overflow: hidden;
            padding: 8px 20px 20px;
            gap: 14px;
            min-height: 0;
        }

        /* ===== 左侧会话列表 ===== */
        .conv-side {
            width: 280px;
            background: #fff;
            border-radius: 14px;
            border: 1px solid #e8edf4;
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
            overflow: hidden;
            min-height: 0;
        }
        .conv-side .conv-head {
            padding: 12px 14px;
            border-bottom: 1px solid #e8edf4;
            display: flex; justify-content: space-between;
            align-items: center; flex-shrink: 0;
        }
        .conv-side .conv-head h3 {
            font-size: 13px; font-weight: 600; color: #0a1e2f;
            display: flex; align-items: center; gap: 6px;
        }
        .conv-side .conv-head h3 i { color: #4dabf7; }
        .conv-side .conv-head .refresh-btn {
            width: 26px; height: 26px; border-radius: 50%;
            border: none; background: #f0f4f9; color: #5f7d95;
            cursor: pointer; font-size: 12px;
            display: flex; align-items: center; justify-content: center;
            transition: 0.12s;
        }
        .conv-side .conv-head .refresh-btn:hover {
            background: #f0f7fe; color: #2a7faa;
        }

        .conv-filters {
            padding: 8px 12px;
            border-bottom: 1px solid #e8edf4;
            display: flex; gap: 6px; flex-wrap: wrap;
            flex-shrink: 0;
        }
        .conv-filter {
            padding: 3px 10px;
            border-radius: 20px;
            border: 1px solid #dce5ef;
            background: #fff;
            font-size: 11px;
            color: #5f7d95;
            cursor: pointer;
            transition: 0.12s;
            font-family: inherit;
        }
        .conv-filter:hover { border-color: #4dabf7; color: #2a7faa; }
        .conv-filter.active {
            background: #0a1e2f; border-color: #0a1e2f; color: #fff;
        }

        .conv-list {
            flex: 1;
            overflow-y: auto;
            padding: 8px 10px;
            min-height: 0;
        }
        .conv-list::-webkit-scrollbar { width: 4px; }
        .conv-list::-webkit-scrollbar-thumb { background: #dce5ef; border-radius: 10px; }

        .conv-item {
            display: flex;
            gap: 10px;
            padding: 10px 10px;
            border-radius: 10px;
            margin-bottom: 4px;
            cursor: pointer;
            transition: 0.12s;
            border: 1px solid transparent;
            position: relative;
        }
        .conv-item:hover { background: #f5f8fc; border-color: #e8edf4; }
        .conv-item.active {
            background: #f0f7fe;
            border-color: rgba(77,171,247,0.3);
        }

        .conv-avatar {
            width: 38px; height: 38px;
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            color: #fff;
            font-size: 14px;
            font-weight: 600;
            flex-shrink: 0;
            position: relative;
        }
        .conv-avatar .online-dot {
            position: absolute; bottom: 0; right: 0;
            width: 10px; height: 10px; border-radius: 50%;
            background: #0d7c4f;
            border: 2px solid #fff;
        }
        .conv-avatar .offline-dot {
            position: absolute; bottom: 0; right: 0;
            width: 10px; height: 10px; border-radius: 50%;
            background: #94a3b8;
            border: 2px solid #fff;
        }

        .conv-info {
            flex: 1; min-width: 0;
            display: flex; flex-direction: column; gap: 2px;
        }
        .conv-info .conv-name {
            font-size: 13px; font-weight: 600; color: #0a1e2f;
            display: flex; align-items: center; gap: 6px;
            overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
        }
        .conv-info .conv-name .plat-tag {
            font-size: 10px;
            padding: 1px 6px;
            border-radius: 20px;
            flex-shrink: 0;
        }
        .conv-info .conv-preview {
            font-size: 12px; color: #5f7d95;
            overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
        }
        .conv-info .conv-time {
            font-size: 10px; color: #94a3b8;
        }
        .conv-unread {
            position: absolute;
            top: 10px; right: 10px;
            min-width: 18px; height: 18px;
            padding: 0 5px;
            border-radius: 20px;
            background: #b51a3f; color: #fff;
            font-size: 10px; font-weight: 600;
            display: flex; align-items: center; justify-content: center;
        }

        /* 平台徽章 */
        .plat-tag.taobao { background: #fef0e6; color: #b55a1a; }
        .plat-tag.douyin { background: #e9f0ff; color: #1a5bb5; }
        .plat-tag.pdd { background: #fde8ed; color: #b51a3f; }
        .plat-tag.jd { background: #e6f7ec; color: #0d7c4f; }

        /* ===== 右侧聊天区 ===== */
        .chat-panel {
            flex: 1;
            background: #fff;
            border-radius: 14px;
            border: 1px solid #e8edf4;
            display: flex;
            flex-direction: column;
            min-width: 0;
            min-height: 0;
            overflow: hidden;
        }
        .chat-panel .chat-head {
            padding: 12px 18px;
            border-bottom: 1px solid #e8edf4;
            display: flex; justify-content: space-between;
            align-items: center; flex-shrink: 0; gap: 10px;
            flex-wrap: wrap;
        }
        .chat-panel .chat-head .user-info {
            display: flex; align-items: center; gap: 10px;
            min-width: 0;
        }
        .chat-panel .chat-head .user-info .avatar {
            width: 38px; height: 38px; border-radius: 50%;
            background: linear-gradient(135deg, #4dabf7, #6a5cff);
            color: #fff; font-size: 15px; font-weight: 600;
            display: flex; align-items: center; justify-content: center;
            flex-shrink: 0;
        }
        .chat-panel .chat-head .user-info .name {
            font-size: 15px; font-weight: 600; color: #0a1e2f;
            display: flex; align-items: center; gap: 8px;
            flex-wrap: wrap;
        }
        .chat-panel .chat-head .user-info .sub {
            font-size: 12px; color: #5f7d95;
            margin-top: 2px;
        }
        .chat-panel .chat-head .actions { display: flex; gap: 8px; flex-wrap: wrap; }
        .chat-panel .chat-head .actions .btn-sm {
            padding: 6px 14px; border-radius: 20px;
            border: 1px solid #dce5ef; background: #fff;
            font-size: 12px; color: #1e3a5f; cursor: pointer;
            display: inline-flex; align-items: center; gap: 4px;
            transition: 0.12s; font-family: inherit;
        }
        .chat-panel .chat-head .actions .btn-sm:hover {
            border-color: #4dabf7; color: #2a7faa; background: #f5f9fe;
        }
        .chat-panel .chat-head .actions .btn-sm.primary {
            background: #0a1e2f; border-color: #0a1e2f; color: #fff;
        }
        .chat-panel .chat-head .actions .btn-sm.primary:hover {
            background: #1a3a5a;
        }
        .chat-panel .chat-head .actions .btn-sm.primary i { color: rgba(255,255,255,0.7); }

        /* 消息列表 */
        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 18px 22px;
            background: #f8fafc;
            display: flex; flex-direction: column; gap: 14px;
            min-height: 0;
        }
        .chat-messages::-webkit-scrollbar { width: 5px; }
        .chat-messages::-webkit-scrollbar-thumb { background: #dce5ef; border-radius: 10px; }

        .msg-row {
            display: flex;
            gap: 10px;
            max-width: 78%;
            animation: msgIn 0.3s ease;
        }
        @keyframes msgIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .msg-row.from-user { align-self: flex-start; }
        .msg-row.from-ai { align-self: flex-start; }
        .msg-row.from-agent { align-self: flex-end; flex-direction: row-reverse; }

        .msg-row .avatar {
            width: 34px; height: 34px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            color: #fff; font-size: 14px; flex-shrink: 0;
        }
        .msg-row.from-user .avatar { background: #b55a1a; }
        .msg-row.from-ai .avatar {
            background: linear-gradient(135deg, #4dabf7, #2a7faa);
        }
        .msg-row.from-agent .avatar { background: #0d7c4f; }

        .msg-row .bubble-wrap {
            display: flex; flex-direction: column; gap: 4px;
            min-width: 0;
        }
        .msg-row .bubble {
            padding: 10px 14px;
            border-radius: 14px;
            font-size: 14px;
            line-height: 1.6;
            word-break: break-word;
            box-shadow: 0 1px 3px rgba(10,30,47,0.04);
        }
        .msg-row.from-user .bubble {
            background: #fff;
            border: 1px solid #e8edf4;
            border-radius: 4px 14px 14px 14px;
            color: #0a1e2f;
        }
        .msg-row.from-ai .bubble {
            background: linear-gradient(135deg, #f0f7fe, #e6f3ff);
            border: 1px solid #b8d8f7;
            border-radius: 4px 14px 14px 14px;
            color: #0a1e2f;
        }
        .msg-row.from-ai .bubble::before {
            content: '';
            display: block;
            height: 0;
        }
        .msg-row.from-agent .bubble {
            background: #0a1e2f;
            color: #fff;
            border-radius: 14px 4px 14px 14px;
        }

        .msg-row .meta {
            font-size: 10px;
            color: #94a3b8;
            display: flex;
            gap: 6px;
            align-items: center;
        }
        .msg-row.from-agent .meta { justify-content: flex-end; }
        .msg-row .meta .ai-tag {
            background: #4dabf7;
            color: #fff;
            padding: 1px 6px;
            border-radius: 8px;
            font-size: 9px;
            font-weight: 600;
        }
        .msg-row .meta .agent-tag {
            background: #0d7c4f;
            color: #fff;
            padding: 1px 6px;
            border-radius: 8px;
            font-size: 9px;
            font-weight: 600;
        }

        /* AI 正在输入 */
        .typing-indicator {
            display: none;
            align-items: center;
            gap: 10px;
            padding: 6px 0;
        }
        .typing-indicator.show { display: flex; }
        .typing-indicator .avatar {
            width: 30px; height: 30px; border-radius: 50%;
            background: linear-gradient(135deg, #4dabf7, #2a7faa);
            display: flex; align-items: center; justify-content: center;
            color: #fff; font-size: 12px;
        }
        .typing-indicator .dots {
            background: #fff;
            border: 1px solid #e8edf4;
            border-radius: 14px;
            padding: 8px 14px;
            display: flex; gap: 4px;
        }
        .typing-indicator .dots span {
            width: 6px; height: 6px;
            border-radius: 50%;
            background: #94a3b8;
            animation: dotPulse 1.2s infinite;
        }
        .typing-indicator .dots span:nth-child(2) { animation-delay: 0.2s; }
        .typing-indicator .dots span:nth-child(3) { animation-delay: 0.4s; }
        @keyframes dotPulse {
            0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
            30% { transform: translateY(-4px); opacity: 1; }
        }

        /* 快捷回复 */
        .quick-replies {
            padding: 8px 18px 0;
            border-top: 1px solid #e8edf4;
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            flex-shrink: 0;
            background: #fff;
        }
        .quick-replies .qr-label {
            font-size: 11px;
            color: #94a3b8;
            align-self: center;
            margin-right: 4px;
        }
        .qr-btn {
            padding: 5px 12px;
            border-radius: 20px;
            border: 1px solid #dce5ef;
            background: #fff;
            font-size: 12px;
            color: #5f7d95;
            cursor: pointer;
            transition: 0.12s;
            font-family: inherit;
        }
        .qr-btn:hover {
            border-color: #4dabf7;
            color: #2a7faa;
            background: #f5f9fe;
        }

        /* 输入区 */
        .chat-input-area {
            background: #fff;
            padding: 12px 18px calc(14px + env(safe-area-inset-bottom, 0px));
            display: flex;
            gap: 10px;
            align-items: flex-end;
            flex-shrink: 0;
        }
        .chat-input-area .attach-btn {
            width: 38px; height: 38px;
            border-radius: 50%;
            border: 1px solid #e8edf4;
            background: #fff;
            color: #5f7d95;
            cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            font-size: 14px;
            flex-shrink: 0;
            transition: 0.12s;
            font-family: inherit;
        }
        .chat-input-area .attach-btn:hover {
            border-color: #4dabf7; color: #2a7faa; background: #f5f9fe;
        }
        .chat-input-area .input-wrap {
            flex: 1;
            background: #f8fafc;
            border: 1px solid #e8edf4;
            border-radius: 12px;
            padding: 4px 14px;
            transition: 0.15s;
            display: flex;
            align-items: flex-end;
        }
        .chat-input-area .input-wrap:focus-within {
            border-color: #4dabf7;
            box-shadow: 0 0 0 3px rgba(77,171,247,0.08);
            background: #fff;
        }
        .chat-input-area textarea {
            flex: 1;
            border: none;
            background: transparent;
            padding: 8px 0;
            font-size: 14px;
            font-family: inherit;
            resize: none;
            outline: none;
            max-height: 100px;
            color: #0a1e2f;
            line-height: 1.5;
        }
        .chat-input-area textarea::placeholder { color: #94a3b8; }
        .chat-input-area .send-btn {
            width: 42px; height: 42px;
            border-radius: 50%;
            border: none;
            background: #0a1e2f;
            color: #fff;
            font-size: 16px;
            cursor: pointer;
            transition: 0.15s;
            flex-shrink: 0;
            display: flex; align-items: center; justify-content: center;
        }
        .chat-input-area .send-btn:hover:not(:disabled) {
            background: #1a3a5a; transform: scale(1.05);
        }
        .chat-input-area .send-btn:disabled {
            opacity: 0.4; cursor: not-allowed; transform: none;
        }

        /* ===== 空状态 ===== */
        .empty-chat {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #94a3b8;
            padding: 40px;
            text-align: center;
        }
        .empty-chat i {
            font-size: 56px;
            color: #dce5ef;
            margin-bottom: 16px;
        }
        .empty-chat h3 {
            font-size: 18px;
            color: #0a1e2f;
            margin-bottom: 6px;
        }
        .empty-chat p {
            font-size: 13px;
            max-width: 400px;
            line-height: 1.6;
        }

        /* ===== Toast ===== */
        .global-toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: #0a1e2f;
            color: #fff;
            padding: 12px 28px;
            border-radius: 40px;
            font-size: 14px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            z-index: 9999;
            white-space: nowrap;
            display: none;
            max-width: 90vw;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .global-toast.show { display: block; animation: fadeUp 0.3s ease; }
        @keyframes fadeUp {
            from { opacity: 0; transform: translateX(-50%) translateY(20px); }
            to { opacity: 1; transform: translateX(-50%) translateY(0); }
        }

        /* ===== 响应式 ===== */
        @media (max-width: 1200px) {
            .stats-grid { grid-template-columns: repeat(2, 1fr); }
        }
        @media (max-width: 900px) {
            .app-body { flex-direction: column; padding: 8px 12px 12px; gap: 10px; }
            .conv-side {
                width: 100%;
                max-height: 220px;
                flex-shrink: 0;
            }
            .chat-panel { flex: 1; min-height: 0; }
        }
        @media (max-width: 768px) {
            .stats-grid {
                padding: 12px 12px 4px;
                gap: 10px;
            }
            .stat-card { padding: 10px 14px; }
            .stat-card .value { font-size: 18px; }
            .toolbar { padding: 8px 12px; }
            .chat-head { padding: 10px 12px; }
            .chat-messages { padding: 12px 12px; gap: 10px; }
            .msg-row { max-width: 88%; }
            .msg-row .bubble { font-size: 13.5px; padding: 9px 12px; }
            .msg-row .avatar { width: 30px; height: 30px; font-size: 12px; }
            .quick-replies { padding: 6px 12px 0; }
            .chat-input-area { padding: 10px 12px calc(12px + env(safe-area-inset-bottom, 0px)); }
            .chat-input-area textarea { font-size: 16px; }
        }
        @media (max-width: 480px) {
            .stats-grid { grid-template-columns: 1fr 1fr; }
            .conv-side { max-height: 180px; }
            .toolbar .tb-btn span { display: none; }
            .chat-panel .chat-head .actions .btn-sm span { display: none; }
        }
    </style>
</head>
<body>

<!-- ===== 工具条 ===== -->
<div class="toolbar">
    <div class="tb-left">
        <span class="status-dot"></span>
        <span>AI 客服在线 · 已接入 <strong>DeepSeek</strong> · 自动回复已开启</span>
    </div>
    <div class="tb-right">
        <button class="tb-btn" onclick="refreshAll()" title="刷新会话">
            <i class="fas fa-sync-alt"></i><span> 刷新</span>
        </button>
        <button class="tb-btn" onclick="markAllRead()" title="全部已读">
            <i class="fas fa-check-double"></i><span> 全部已读</span>
        </button>
        <button class="tb-btn" onclick="showToast('⚙️ AI 客服设置（演示）')" title="AI 设置">
            <i class="fas fa-cog"></i><span> AI 设置</span>
        </button>
    </div>
</div>

<!-- ===== 统计卡片 ===== -->
<div class="stats-grid">
    <div class="stat-card">
        <div class="label"><i class="fas fa-comments"></i> 今日会话</div>
        <div class="value" id="statTotal">1,284</div>
    </div>
    <div class="stat-card">
        <div class="label"><i class="fas fa-robot"></i> AI 处理</div>
        <div class="value" id="statAI">1,023 <small>79.6%</small></div>

        ],
        c5: [

            { id: 'm2', from: 'ai', text: '竹编包目前库存充足，下单后24小时内发货哦。', time: '13:20' }
        ],
        c6: [
            { id: 'm1', from: 'user', text: '茶叶礼盒的保质期？', time: '12:50' },
            { id: 'm2', from: 'ai', text: '云山茶叶礼盒保质期18个月，建议置于阴凉干燥处存放。', time: '12:50' }
        ]
    };

    /* ============================================================
       初始化
       ============================================================ */
    document.addEventListener('DOMContentLoaded', function () {
        state.conversations = JSON.parse(JSON.stringify(DEMO_CONVERSATIONS));
        state.messagesMap = JSON.parse(JSON.stringify(DEMO_MESSAGES));
        renderConvList();
        bindInputEvents();
    });

    function bindInputEvents() {
        const input = document.getElementById('msgInput');
        input.addEventListener('input', function () { updateSendBtn(); });
    }

    /* ============================================================
       会话列表渲染
       ============================================================ */
    function renderConvList() {
        const container = document.getElementById('convList');
        let list = state.conversations;

        if (state.filterPlatform !== 'all') {
            list = list.filter(c => c.platform === state.filterPlatform);
        }

        if (list.length === 0) {
            container.innerHTML = '<div style="text-align:center;padding:20px;color:#94a3b8;font-size:13px;">暂无会话</div>';
            return;
        }

        const platClass = {
            '淘宝': 'taobao',
            '抖音': 'douyin',
            '拼多多': 'pdd',
            '京东': 'jd'
        };

        container.innerHTML = list.map(c => `
            <div class="conv-item ${c.id === state.currentId ? 'active' : ''}"
                 onclick="openConv('${c.id}')">
                <div class="conv-avatar" style="background:${c.avatarColor};">
                    ${c.avatarText}
                    <span class="${c.online ? 'online-dot' : 'offline-dot'}"></span>
                </div>
                <div class="conv-info">
                    <div class="conv-name">
                        ${escapeHtml(c.name)}
                        <span class="plat-tag ${platClass[c.platform] || ''}">${c.platform}</span>
                    </div>
                    <div class="conv-preview">${escapeHtml(c.lastMsg)}</div>
                    <div class="conv-time">${c.lastTime}</div>
                </div>
                ${c.unread > 0 ? `<div class="conv-unread">${c.unread > 99 ? '99+' : c.unread}</div>` : ''}
            </div>
        `).join('');
    }

    /* ============================================================
       筛选
       ============================================================ */
    function filterConv(plat, el) {
        state.filterPlatform = plat;
        document.querySelectorAll('.conv-filter').forEach(b => b.classList.remove('active'));
        el.classList.add('active');
        renderConvList();
    }

    /* ============================================================
       打开会话
       ============================================================ */
    function openConv(id) {
        const conv = state.conversations.find(c => c.id === id);
        if (!conv) return;
        state.currentId = id;

        // 标记已读
        conv.unread = 0;
        renderConvList();

        // 显示聊天区
        document.getElementById('emptyChat').style.display = 'none';
        document.getElementById('chatHead').style.display = 'flex';
        document.getElementById('chatMessages').style.display = 'flex';
        document.getElementById('quickReplies').style.display = 'flex';
        document.getElementById('chatInputArea').style.display = 'flex';

        // 头部信息
        document.getElementById('chatAvatar').textContent = conv.avatarText;
        document.getElementById('chatAvatar').style.background = conv.avatarColor;
        document.getElementById('chatName').innerHTML =
            `${escapeHtml(conv.name)} <span class="plat-tag ${platClass(conv.platform)}">${conv.platform}</span>`;
        document.getElementById('chatSub').textContent =
            `客户 ID: ${conv.id.toUpperCase()} · ${conv.online ? '在线' : '离线'}`;

        // 渲染消息
        renderMessages(id);

        // 滚动到底部
        scrollMessagesToBottom();

        // 聚焦输入框
        setTimeout(() => document.getElementById('msgInput').focus(), 100);
    }

    function platClass(p) {
        return { '淘宝': 'taobao', '抖音': 'douyin', '拼多多': 'pdd', '京东': 'jd' }[p] || '';
    }

    /* ============================================================
       消息渲染
       ============================================================ */
    function renderMessages(convId) {
        const list = document.getElementById('messagesList');
        const msgs = state.messagesMap[convId] || [];

        if (msgs.length === 0) {
            list.innerHTML = '<div style="text-align:center;padding:20px;color:#94a3b8;font-size:13px;">暂无消息</div>';
            return;
        }

        list.innerHTML = msgs.map(m => {
            const avatarText = m.from === 'agent' ? '客服'
                              : m.from === 'ai' ? 'AI'
                              : '客';
            const avatarIcon = m.from === 'agent'
                ? '<i class="fas fa-user-headset"></i>'
                : m.from === 'ai'
                    ? '<i class="fas fa-robot"></i>'
                    : '<i class="fas fa-user"></i>';

            const meta = `
                <div class="meta">
                    ${m.from === 'ai' ? '<span class="ai-tag">AI</span>' : ''}
                    ${m.from === 'agent' ? '<span class="agent-tag">客服</span>' : ''}
                    <span>${m.time}</span>
                </div>
            `;

            return `
                <div class="msg-row from-${m.from}">
                    <div class="avatar">${avatarIcon}</div>
                    <div class="bubble-wrap">
                        <div class="bubble">${escapeHtml(m.text).replace(/\n/g, '<br>')}</div>
                        ${meta}
                    </div>
                </div>
            `;
        }).join('');
    }

    function scrollMessagesToBottom() {
        const container = document.getElementById('chatMessages');
        setTimeout(() => {
            container.scrollTop = container.scrollHeight;
        }, 50);
    }

    /* ============================================================
       发送消息
       ============================================================ */
    function sendMsg() {
        const input = document.getElementById('msgInput');
        const text = input.value.trim();
        if (!text || state.isReplying) return;
        if (!state.currentId) {
            showToast('⚠️ 请先选择会话');
            return;
        }

        const convId = state.currentId;
        const time = nowTime();

        // 加入消息
        if (!state.messagesMap[convId]) state.messagesMap[convId] = [];
        state.messagesMap[convId].push({
            id: 'm_' + Date.now(),
            from: 'agent',
            text: text,
            time: time
        });

        // 更新会话预览
        const conv = state.conversations.find(c => c.id === convId);
        if (conv) {
            conv.lastMsg = text;
            conv.lastTime = time;
        }

        // 清空输入
        input.value = '';
        autoResize(input);
        updateSendBtn();

        // 渲染
        renderMessages(convId);
        renderConvList();
        scrollMessagesToBottom();

        // 模拟客户回复（2秒后）
        state.isReplying = true;
        setTimeout(() => {
            simulateCustomerReply(convId);
            state.isReplying = false;
        }, 1500 + Math.random() * 1500);
    }

    function sendQuick(text) {
        const input = document.getElementById('msgInput');
        input.value = text;
        autoResize(input);
        updateSendBtn();
        sendMsg();
    }

    /* ============================================================
       模拟客户回复
       ============================================================ */
    function simulateCustomerReply(convId) {
        const replies = [
            '好的，谢谢',
            '明白了',
            '那我再看看',
            '可以优惠一点吗？',
            '什么时候能到货？',
            '这个质量怎么样？',
            '嗯嗯，我先考虑下',
            '好的，那我下单了'
        ];
        const reply = replies[Math.floor(Math.random() * replies.length)];
        const time = nowTime();

        if (!state.messagesMap[convId]) state.messagesMap[convId] = [];
        state.messagesMap[convId].push({
            id: 'm_' + Date.now(),
            from: 'user',
            text: reply,
            time: time
        });

        const conv = state.conversations.find(c => c.id === convId);
        if (conv) {
            conv.lastMsg = reply;
            conv.lastTime = time;
            if (state.currentId !== convId) {
                conv.unread = (conv.unread || 0) + 1;
            }
        }

        if (state.currentId === convId) {
            renderMessages(convId);
            scrollMessagesToBottom();
        }
        renderConvList();

        // AI 自动回复（可选）
        if (state.aiAutoReplyOn && state.currentId === convId) {
            setTimeout(() => autoAIReply(convId, reply), 1200);
        }
    }

    /* ============================================================
       AI 自动回复
       ============================================================ */
    function autoAIReply(convId, userText) {
        const aiReply = generateAIReply(userText);
        if (!aiReply) return;

        const typing = document.getElementById('typingIndicator');
        if (state.currentId === convId) {
            typing.classList.add('show');
            scrollMessagesToBottom();
        }

        setTimeout(() => {
            typing.classList.remove('show');
            if (!state.messagesMap[convId]) state.messagesMap[convId] = [];
            state.messagesMap[convId].push({
                id: 'm_' + Date.now(),
                from: 'ai',
                text: aiReply,
                time: nowTime()
            });

            const conv = state.conversations.find(c => c.id === convId);
            if (conv) {
                conv.lastMsg = aiReply;
                conv.lastTime = nowTime();
            }

            if (state.currentId === convId) {
                renderMessages(convId);
                scrollMessagesToBottom();
            }
            renderConvList();
        }, 1200);
    }

    function generateAIReply(text) {
        const t = text.toLowerCase();
        if (t.includes('优惠') || t.includes('便宜') || t.includes('打折')) {
            return '亲，我们目前有满200减30的活动，可以在下单时自动使用哦~';
        }
        if (t.includes('到货') || t.includes('发货') || t.includes('物流')) {
            return '一般下单后24小时内发货，中通/圆通 2-3 天可送达，具体以物流信息为准。';
        }
        if (t.includes('质量') || t.includes('怎么样')) {
            return '我们的商品都是精选优质货源，好评率99%以上，支持7天无理由退换，请放心购买~';
        }
        if (t.includes('考虑') || t.includes('看看')) {
            return '好的，随时为您服务~ 有任何问题欢迎再来咨询😊';
        }
        if (t.includes('下单') || t.includes('买')) {
            return '好的，感谢您的支持！我们会尽快为您安排发货~';
        }
        if (t.includes('谢谢') || t.includes('感谢')) {
            return '不客气，祝您购物愉快！有需要随时联系我~';
        }
        return null; // 不自动回复
    }

    /* ============================================================
       转人工 / 接管 / 结束
       ============================================================ */
    function transferToHuman() {
        if (!state.currentId) return;
        showToast('🔄 已转接人工客服，请稍等...');
        setTimeout(() => {
            sendSystemMessage(state.currentId, '【系统】会话已转人工客服');
        }, 600);
    }

    function takeOver() {
        if (!state.currentId) return;
        showToast('✋ 你已接管此会话');
        sendSystemMessage(state.currentId, '【系统】客服已接管本会话');
    }

    function closeCurrentConv() {
        if (!state.currentId) return;
        if (!confirm('确定结束当前会话？')) return;
        const convId = state.currentId;
        state.conversations = state.conversations.filter(c => c.id !== convId);
        delete state.messagesMap[convId];
        state.currentId = null;
        renderConvList();

        // 隐藏聊天区
        document.getElementById('emptyChat').style.display = 'flex';
        document.getElementById('chatHead').style.display = 'none';
        document.getElementById('chatMessages').style.display = 'none';
        document.getElementById('quickReplies').style.display = 'none';
        document.getElementById('chatInputArea').style.display = 'none';

        showToast('✅ 会话已结束');
    }

    function sendSystemMessage(convId, text) {
        if (!state.messagesMap[convId]) state.messagesMap[convId] = [];
        state.messagesMap[convId].push({
            id: 'm_' + Date.now(),
            from: 'ai',
            text: text,
            time: nowTime(),
            system: true
        });
        if (state.currentId === convId) {
            renderMessages(convId);
            scrollMessagesToBottom();
        }
    }

    /* ============================================================
       其他操作
       ============================================================ */
    function refreshAll() {
        renderConvList();
        showToast('🔄 已刷新会话列表');
    }

    function markAllRead() {
        state.conversations.forEach(c => c.unread = 0);
        renderConvList();
        showToast('✅ 已全部标记为已读');
    }

    /* ============================================================
       工具
       ============================================================ */
    function nowTime() {
        const d = new Date();
        return d.getHours().toString().padStart(2, '0') + ':' + d.getMinutes().toString().padStart(2, '0');
    }

    function escapeHtml(s) {
        return String(s || '').replace(/[&<>"']/g, c => ({
            '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
        })[c]);
    }

    function autoResize(el) {
        el.style.height = 'auto';
        el.style.height = Math.min(el.scrollHeight, 100) + 'px';
        updateSendBtn();
    }

    function updateSendBtn() {
        const input = document.getElementById('msgInput');
        const btn = document.getElementById('sendBtn');
        btn.disabled = !input.value.trim() || state.isReplying;
    }

    function handleMsgKey(e) {
        if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            sendMsg();
        }
    }

    function showToast(msg) {
        const t = document.getElementById('toast');
        t.textContent = msg;
        t.classList.add('show');
        clearTimeout(t._timer);
        t._timer = setTimeout(() => t.classList.remove('show'), 2200);
    }

    /* 暴露到全局 */
    window.openConv = openConv;
    window.filterConv = filterConv;
    window.sendMsg = sendMsg;
    window.sendQuick = sendQuick;
    window.transferToHuman = transferToHuman;
    window.takeOver = takeOver;
    window.closeCurrentConv = closeCurrentConv;
    window.refreshAll = refreshAll;
    window.markAllRead = markAllRead;
    window.handleMsgKey = handleMsgKey;
    window.autoResize = autoResize;

    console.log('💬 AI 客服页已加载');
</script>
