    async function sendPickedCoupon() {
        if (!state.pickedCoupon) return;
        if (!state.currentId) return;

        const convId = state.currentId;
        const c = state.pickedCoupon;

        if (!state.messagesMap[convId]) state.messagesMap[convId] = [];
        state.messagesMap[convId].push({
            id: 'm_' + Date.now(),
            from: 'agent',
            text: `送您一张「${c.name}」，满${c.threshold}减${c.discount}，点击立即领取~`,
            time: nowTime(),
            coupon_card: c
        });

        const conv = state.conversations.find(x => x.id === convId);
        if (conv) {
            conv.lastMsg = `[优惠券] ${c.name}`;
            conv.lastTime = nowTime();
        }

        renderMessages(convId);
        renderConvList();
        scrollMessagesToBottom();

        closeCouponPicker();
        state.pickedCoupon = null;

        showToast(`🎟️ 已发送「${c.name}」`);
    }

    /* ============================================================
       发送消息
       ============================================================ */
    function sendMsg() {
        const input = document.getElementById('msgInput');
        const text = input.value.trim();
        if (!text || state.isReplying) return;
        if (!state.currentId) { showToast('⚠️ 请先选择会话'); return; }

        const convId = state.currentId;
        const time = nowTime();

        if (!state.messagesMap[convId]) state.messagesMap[convId] = [];
        state.messagesMap[convId].push({
            id: 'm_' + Date.now(),
            from: 'agent',
            text: text,
            time: time
        });

        const conv = state.conversations.find(c => c.id === convId);
        if (conv) { conv.lastMsg = text; conv.lastTime = time; }

        input.value = '';
        autoResize(input);
        updateSendBtn();
        renderMessages(convId);
        renderConvList();
        scrollMessagesToBottom();

        state.isReplying = true;
        setTimeout(() => {
            simulateCustomerReply(convId);
            state.isReplying = false;
        }, 1500 + Math.random() * 1500);
    }

    /* ============================================================
       客户回复 + AI 自动回复
       ============================================================ */
    function simulateCustomerReply(convId) {
        const replies = [
            '好的，谢谢', '明白了', '可以优惠一点吗？',
            '什么时候能到货？', '这个质量怎么样？',
            '能发个实物图看看吗？', '有使用教程吗？',
            '这个多少钱？', '有什么推荐的吗？', '好的，那我下单了'
        ];
        const reply = replies[Math.floor(Math.random() * replies.length)];
        const time = nowTime();

        if (!state.messagesMap[convId]) state.messagesMap[convId] = [];
        state.messagesMap[convId].push({
            id: 'm_' + Date.now(),
            from: 'user',
            text: reply,
            time: time
        });

        const conv = state.conversations.find(c => c.id === convId);
        if (conv) {
            conv.lastMsg = reply;
            conv.lastTime = time;
            if (state.currentId !== convId) conv.unread = (conv.unread || 0) + 1;
        }

        if (state.currentId === convId) {
            renderMessages(convId);
            scrollMessagesToBottom();
        }
        renderConvList();

        const takeover = state.takeoverState[convId] || 'ai';
        if (state.aiAutoReplyOn && takeover === 'ai' && state.currentId === convId) {
            if (state.aiTimers[convId]) clearTimeout(state.aiTimers[convId]);
            state.aiTimers[convId] = setTimeout(() => {
                if (state.takeoverState[convId] !== 'ai') return;
                autoAIReply(convId, reply);
                delete state.aiTimers[convId];
            }, 1200);
        }
    }

    async function autoAIReply(convId, userText) {
        if (state.takeoverState[convId] !== 'ai') return;

        const typing = document.getElementById('typingIndicator');
        if (state.currentId === convId) {
            typing.classList.add('show');
            scrollMessagesToBottom();
        }

        const msgs = state.messagesMap[convId] || [];
        const history = msgs.slice(-8).map(m => ({
            role: m.from === 'user' ? 'user' : 'ai',
            text: m.text || ''
        })).filter(m => m.text);

        let replyData = null;
        try {
            const res = await fetch(BACKEND_URL + '/api/ai/parse', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    text: userText,
                    session_id: 'conv_' + convId,
                    history: history,
                    conv_id: convId
                })
            });
            if (res.ok) replyData = await res.json();
        } catch (e) {
            console.warn('后端 AI 回复失败', e);
        }

        let replyText = '';
        let kbHits = [];
        let assets = [];

        if (replyData && replyData.type === 'chat' && replyData.text) {
            replyText = replyData.text;
            kbHits = replyData.kb_hits || [];
            assets = replyData.assets || [];
        } else {
            replyText = generateLocalReply(userText) || '好的，我帮您看看~';
            if (/图|看看|实物|视频/.test(userText)) {
                assets = searchLocalAssets(userText).slice(0, 2);
            }
        }

        const recommendedProducts = await smartRecommendProducts(userText);

        setTimeout(async () => {
            if (state.takeoverState[convId] !== 'ai') {
                typing.classList.remove('show');
                return;
            }
            typing.classList.remove('show');

            if (!state.messagesMap[convId]) state.messagesMap[convId] = [];

            state.messagesMap[convId].push({
                id: 'm_' + Date.now(),
                from: 'ai',
                text: replyText,
                time: nowTime(),
                kb_hits: kbHits,
                assets: assets
            });

            if (recommendedProducts && recommendedProducts.length > 0) {
                const cards = recommendedProducts.map(p => ({
                    id: p.id, name: p.name, price: p.price,
                    original_price: p.original_price || null,
                    main_image: p.main_image || '',
                    sales: p.sales || 0, stock: p.stock || 0,
                    platform: p.platform || '', spec: p.spec || '',
                    rating: p.rating || '', tags: p.tags || [],
                    url: generateProductUrl(p)
                }));

                if (cards.length === 1) {
                    state.messagesMap[convId].push({
                        id: 'm_' + Date.now() + '_card',
                        from: 'ai', text: '', time: nowTime(),
                        product_card: cards[0]
                    });
                } else {
                    state.messagesMap[convId].push({
                        id: 'm_' + Date.now() + '_cards',
                        from: 'ai', text: '', time: nowTime(),
                        product_cards: cards
                    });
                }
            }

            const conv = state.conversations.find(c => c.id === convId);
            if (conv) {
                conv.lastMsg = replyText.slice(0, 30);
                conv.lastTime = nowTime();
            }

            if (state.currentId === convId) {
                renderMessages(convId);
                scrollMessagesToBottom();
            }
            renderConvList();
        }, 800);
    }

    async function smartRecommendProducts(userText) {
        const triggers = ['多少钱', '什么价格', '有哪些', '有什么', '推荐', '款式', '看看', '商品', '款', '什么价位', '报价'];
        const shouldTrigger = triggers.some(w => userText.includes(w));
        if (!shouldTrigger) return [];

        if (!state.productsCache || state.productsCache.length === 0) {
            await loadProducts();
        }
        if (state.productsCache.length === 0) return [];

        try {
            const res = await fetch(BACKEND_URL + '/api/ai/recommend-products', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ text: userText, max_results: 3 })
            });
            if (res.ok) {
                const data = await res.json();
                if (data.success && data.products && data.products.length > 0) {
                    return data.products;
                }
            }
        } catch (e) {
            console.warn('AI 推荐失败，降级到本地匹配', e);
        }

        return localRecommendProducts(userText);
    }

    function localRecommendProducts(userText) {
        const keywords = ['茶', '竹编', '核桃', '皂', '陶瓷', '扇', '姜茶', '丝巾', '礼盒'];
        let matches = [];
        for (const kw of keywords) {
            if (userText.includes(kw)) {
                const found = state.productsCache.filter(p =>
                    (p.name + ' ' + (p.tags || []).join(' ')).includes(kw)
                );
                matches.push(...found);
            }
        }
        const seen = new Set();
        matches = matches.filter(p => {
            if (seen.has(p.id)) return false;
            seen.add(p.id);
            return true;
        });
        if (matches.length < 3) {
            const sorted = state.productsCache.slice().sort((a, b) => (b.sales || 0) - (a.sales || 0));
            for (const p of sorted) {
                if (matches.length >= 3) break;
                if (!seen.has(p.id)) {
                    matches.push(p);
                    seen.add(p.id);
                }
            }
        }
        return matches.slice(0, 3);
    }

    function generateLocalReply(text) {
        const t = text.toLowerCase();
        if (t.includes('优惠') || t.includes('便宜') || t.includes('打折')) return '亲，我们目前有满200减30的活动，可以在下单时自动使用哦~';
        if (t.includes('到货') || t.includes('发货') || t.includes('物流')) return '一般下单后24小时内发货，中通/圆通 2-3 天可送达。';
        if (t.includes('质量') || t.includes('怎么样')) return '我们的商品都是精选优质货源，好评率99%以上，支持7天无理由退换。';
        if (t.includes('下单') || t.includes('买')) return '好的，感谢您的支持！我们会尽快为您安排发货~';
        if (t.includes('谢谢') || t.includes('感谢')) return '不客气，祝您购物愉快！有需要随时联系我~';
        return null;
    }

    function searchLocalAssets(text) {
        const keywords = text.replace(/[能发个看看吗有实物图视频的教程]/g, '').trim();
        if (!keywords) return state.assetItems.slice(0, 2);
        return state.assetItems.filter(a => {
            const hay = (a.name + ' ' + (a.tags || []).join(' ') + ' ' + (a.product_name || '')).toLowerCase();
            return keywords.split('').some(ch => ch.length > 0 && hay.includes(ch));
        }).slice(0, 2);
    }

    /* ============================================================
       知识库 / 素材库加载
       ============================================================ */
    async function loadKb() {
        try {
            const res = await fetch(BACKEND_URL + '/api/kb/list');
            const data = await res.json();
            if (data.success) {
                state.kbItems = data.items || [];
                state.kbStats = data.stats || {};
                state.kbCategories = data.categories || [];
                renderKb();
                updateBadges();
            }
        } catch (e) { console.warn('加载知识库失败', e); }
    }

    function renderKb() {
        const grid = document.getElementById('kbGrid');
        const empty = document.getElementById('kbEmpty');
        let list = state.kbItems.slice();
        const keyword = (document.getElementById('kbSearch').value || '').trim().toLowerCase();
        const statusFilter = document.getElementById('kbStatusFilter').value;

        if (keyword) {
            list = list.filter(x => {
                const hay = (x.title + ' ' + (x.content || '') + ' ' + (x.tags || []).join(' ')).toLowerCase();
                return hay.includes(keyword);
            });
        }
        if (statusFilter === 'enabled') list = list.filter(x => x.enabled !== false);
        if (statusFilter === 'disabled') list = list.filter(x => x.enabled === false);

        if (list.length === 0) {
            grid.innerHTML = '';
            empty.style.display = 'block';
            return;
        }
        empty.style.display = 'none';

        grid.innerHTML = list.map(item => `
            <div class="kb-card ${item.enabled === false ? 'disabled' : ''}">
                <div class="kb-head">
                    <div class="kb-title">${escapeHtml(item.title)}</div>
                    <div class="kb-cat">${escapeHtml(item.category_name || item.category || '')}</div>
                </div>
                <div class="kb-summary">${escapeHtml((item.content || '').slice(0, 100))}</div>
            </div>
        `).join('');
    }

    function filterKb() { renderKb(); }

    async function loadAssets() {
        try {
            const res = await fetch(BACKEND_URL + '/api/assets/list');
            const data = await res.json();
            if (data.success) {
                state.assetItems = data.items || [];
                renderAssets();
                updateBadges();
            }
        } catch (e) { console.warn('加载素材库失败', e); }
    }

    function renderAssets() {
        const grid = document.getElementById('assetGrid');
        const empty = document.getElementById('assetEmpty');
        let list = state.assetItems;
        const keyword = (document.getElementById('assetSearch').value || '').trim().toLowerCase();
        const typeFilter = document.getElementById('assetTypeFilter').value;

        if (typeFilter !== 'all') list = list.filter(x => x.type === typeFilter);
        if (keyword) {
            list = list.filter(x => {
                const hay = (x.name + ' ' + (x.tags || []).join(' ') + ' ' + (x.product_name || '')).toLowerCase();
                return hay.includes(keyword);
            });
        }

        if (list.length === 0) {
            grid.innerHTML = '';
            empty.style.display = 'block';
            return;
        }
        empty.style.display = 'none';

        grid.innerHTML = list.map(a => {
            const preview = a.type === 'image'
                ? `<img src="${a.url}" alt="${escapeHtml(a.name)}" loading="lazy">`
                : `<video src="${a.url}" preload="metadata" muted playsinline></video><i class="fas fa-play video-icon"></i>`;
            return `
                <div class="asset-card">
                    <div class="asset-preview">
                        ${preview}
                        <span class="asset-type-badge">${a.type === 'image' ? '🖼️ 图' : '🎬 视频'}</span>
                    </div>
                    <div class="asset-info">
                        <div class="asset-name">${escapeHtml(a.name)}</div>
                    </div>
                    <div class="asset-actions">
                        <button class="asset-btn send" onclick="sendAsset('${a.id}')">
                            <i class="fas fa-paper-plane"></i> 发送
                        </button>
                    </div>
                </div>
            `;
        }).join('');
    }

    function filterAssets() { renderAssets(); }

    function sendAsset(id) {
        const a = state.assetItems.find(x => x.id === id);
        if (!a) return;
        if (!state.currentId) { showToast('⚠️ 请先选择会话'); return; }

        switchTab('chat', document.querySelectorAll('.chat-tab')[0]);

        if (!state.messagesMap[state.currentId]) state.messagesMap[state.currentId] = [];
        state.messagesMap[state.currentId].push({
            id: 'm_' + Date.now(),
            from: 'agent',
            text: '',
            time: nowTime(),
            assets: [a]
        });

        const conv = state.conversations.find(c => c.id === state.currentId);
        if (conv) {
            conv.lastMsg = `[${a.type === 'image' ? '图片' : '视频'}] ${a.name}`;
            conv.lastTime = nowTime();
        }

        renderMessages(state.currentId);
        renderConvList();
        scrollMessagesToBottom();
        showToast('📤 已发送素材');
    }

    function quickSendAsset() {
        switchTab('assets', document.querySelectorAll('.chat-tab')[2]);
    }

    function updateBadges() {
        document.getElementById('kbBadge').textContent = state.kbItems.length;
        document.getElementById('assetsBadge').textContent = state.assetItems.length;
        document.getElementById('toolbarKbCount').textContent = state.kbItems.length;
        document.getElementById('toolbarAssetCount').textContent = state.assetItems.length;
    }

    /* ============================================================
       接管 / 转人工（功能逻辑保持不变）
       ============================================================ */
    function transferToHuman() {
        if (!state.currentId) return;
        const convId = state.currentId;
        if (state.aiTimers[convId]) { clearTimeout(state.aiTimers[convId]); delete state.aiTimers[convId]; }
        state.takeoverState[convId] = 'human';
        document.getElementById('typingIndicator').classList.remove('show');
        sendSystemMessage(convId, '【系统】会话已转人工客服');
        renderChatActions(convId);
        renderConvList();
        showToast('👤 已转人工');
    }

    function takeOver() {
        if (!state.currentId) return;
        const convId = state.currentId;
        state.takeoverState[convId] = 'ai';
        sendSystemMessage(convId, '【系统】AI 已接管本会话');
        renderChatActions(convId);
        renderConvList();
        showToast('🤖 AI 已接管');
    }

    function releaseToAI() {
        if (!state.currentId) return;
        const convId = state.currentId;
        state.takeoverState[convId] = 'ai';
        sendSystemMessage(convId, '【系统】已释放给 AI 接管');
        renderChatActions(convId);
        renderConvList();
        showToast('🤖 已释放给 AI');
    }

    function closeCurrentConv() {
        if (!state.currentId) return;
        if (!confirm('确定结束当前会话？')) return;
        const convId = state.currentId;
        if (state.aiTimers[convId]) { clearTimeout(state.aiTimers[convId]); delete state.aiTimers[convId]; }
        state.conversations = state.conversations.filter(c => c.id !== convId);
        delete state.messagesMap[convId];
        delete state.takeoverState[convId];
        state.currentId = null;
        state.userScrolledUp = false;
        state.hasNewMessageWhileScrolledUp = false;
        renderConvList();
        document.getElementById('emptyChat').style.display = 'flex';
        document.getElementById('chatHead').style.display = 'none';
        document.getElementById('chatMessages').style.display = 'none';
        document.getElementById('quickReplies').style.display = 'none';
        document.getElementById('chatInputArea').style.display = 'none';
        updateScrollBottomBtn();
        showToast('✅ 会话已结束');
    }

    function sendSystemMessage(convId, text) {
        if (!state.messagesMap[convId]) state.messagesMap[convId] = [];
        state.messagesMap[convId].push({
            id: 'm_' + Date.now(),
            from: 'ai', text: text, time: nowTime(), system: true
        });
        if (state.currentId === convId) {
            renderMessages(convId);
            scrollMessagesToBottom();
        }
    }

    /* ============================================================
       工具
       ============================================================ */
    function refreshAll() {
        renderConvList();
        loadKb();
        loadAssets();
        loadProducts();
        loadCoupons();
        if (state.currentId) renderChatActions(state.currentId);
        showToast('🔄 已刷新');
    }

    function markAllRead() {
        state.conversations.forEach(c => c.unread = 0);
        renderConvList();
        showToast('✅ 已全部标记为已读');
    }

    function showKbDetail(id) {
        const item = state.kbItems.find(x => x.id === id);
        if (!item) return;
        alert(`标题：${item.title}\n分类：${item.category_name || item.category || '-'}\n\n内容：\n${(item.content || '').slice(0, 800)}`);
    }

    function nowTime() {
        const d = new Date();
        return d.getHours().toString().padStart(2, '0') + ':' + d.getMinutes().toString().padStart(2, '0');
    }

    function escapeHtml(s) {
        return String(s || '').replace(/[&<>"']/g, c => ({
            '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
        })[c]);
    }

    function formatNumber(n) {
        if (!n) return '0';
        if (n >= 10000) return (n / 10000).toFixed(1) + '万';
        return n.toLocaleString('zh-CN');
    }

    function autoResize(el) {
        el.style.height = 'auto';
        el.style.height = Math.min(el.scrollHeight, 100) + 'px';
        updateSendBtn();
    }

    function updateSendBtn() {
        const input = document.getElementById('msgInput');
        const btn = document.getElementById('sendBtn');
        btn.disabled = !input.value.trim() || state.isReplying;
    }

    function handleMsgKey(e) {
        if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            sendMsg();
        }
    }

    function showToast(msg) {
        const t = document.getElementById('toast');
        t.textContent = msg;
        t.classList.add('show');
        clearTimeout(t._timer);
        t._timer = setTimeout(() => t.classList.remove('show'), 2200);
    }

    function closeLightbox() {
        document.getElementById('lightbox').classList.remove('show');
    }

    console.log('💬 AI 客服页已加载（修复 scrollMessagesToBottom 提升问题）');
