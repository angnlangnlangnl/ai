<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>订单管理</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="../css/common.css">
    <script src="../js/auth.js"></script>
    <script>requireLogin();</script>
    <style>
        body {
            padding: 20px 28px 40px;
            background: #eef2f8;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto,
                         'PingFang SC', 'Microsoft YaHei', sans-serif;
            color: #0a1a2b;
        }

        /* 统计卡片 */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 16px;
            margin-bottom: 24px;
        }
        .stat-card {
            background: #fff;
            padding: 18px 20px;
            border-radius: 16px;
            border: 1px solid #e8edf4;
            box-shadow: 0 2px 8px rgba(10,30,47,0.02);
            transition: 0.15s;
        }
        .stat-card:hover {
            box-shadow: 0 6px 20px rgba(10,30,47,0.06);
            border-color: #c8d8e8;
        }
        .stat-card .label {
            font-size: 13px;
            font-weight: 500;
            color: #5f7d95;
            display: flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 6px;
        }
        .stat-card .value {
            font-size: 28px;
            font-weight: 700;
            color: #0a1e2f;
            letter-spacing: -0.02em;
        }
        .stat-card .sub {
            font-size: 12px;
            color: #5f7d95;
            margin-top: 4px;
        }

        /* 卡片 */
        .card {
            background: #fff;
            border-radius: 16px;
            padding: 18px 20px;
            border: 1px solid #e8edf4;
            box-shadow: 0 2px 8px rgba(10,30,47,0.02);
            margin-bottom: 16px;
        }
        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 14px;
        }
        .card-header h3 {
            font-size: 15px;
            font-weight: 600;
            color: #0a1e2f;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .card-header h3 i { color: #4dabf7; }
        .card-header .action {
            font-size: 12px;
            color: #4dabf7;
            font-weight: 500;
            cursor: pointer;
        }

        /* 表单 */
        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr 1fr;
            gap: 14px;
        }
        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            color: #0a1e2f;
            margin-bottom: 4px;
        }
        .form-group input,
        .form-group select {
            width: 100%;
            padding: 8px 14px;
            border: 1px solid #dce5ef;
            border-radius: 8px;
            font-size: 14px;
            background: #fafcfe;
            font-family: inherit;
        }
        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: #4dabf7;
            box-shadow: 0 0 0 3px rgba(77,171,247,0.08);
        }

        /* 表格 */
        .table-wrap { overflow-x: auto; }
        .table-wrap table { width: 100%; border-collapse: collapse; font-size: 13px; }
        .table-wrap th {
            text-align: left;
            padding: 10px 4px 8px 0;
            font-weight: 600;
            color: #5f7d95;
            border-bottom: 1px solid #e8edf4;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }
        .table-wrap td {
            padding: 12px 4px;
            border-bottom: 1px solid #f0f4f9;
            color: #0a1e2f;
        }
        .table-wrap tr:last-child td { border: none; }
        .table-wrap tr:hover td { background: #fafcfe; }

        /* 徽章 */
        .badge {
            padding: 3px 12px;
            border-radius: 30px;
            font-size: 11px;
            font-weight: 500;
            white-space: nowrap;
            display: inline-block;
        }
        .badge.taobao { background: #fef0e6; color: #b55a1a; }
        .badge.douyin { background: #e9f0ff; color: #1a5bb5; }
        .badge.pdd { background: #fde8ed; color: #b51a3f; }
        .badge.jd { background: #e6f7ec; color: #0d7c4f; }
        .badge.success { background: #e6f7ec; color: #0d7c4f; }
        .badge.warning { background: #fef0e6; color: #b55a1a; }
        .badge.danger { background: #fde8ed; color: #b51a3f; }
        .badge.info { background: #e9f0ff; color: #1a5bb5; }

        /* 按钮 */
        .btn-sm {
            padding: 5px 14px;
            border-radius: 20px;
            border: none;
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            transition: 0.1s;
        }
        .btn-sm.primary { background: #0a1e2f; color: #fff; }
        .btn-sm.outline { background: transparent; border: 1px solid #dce5ef; color: #1e3a5f; }
        .btn-sm.danger  { background: #fde8ed; color: #b51a3f; }
        .btn-sm:active  { transform: scale(0.95); }

        /* 分页 */
        .pagination {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 14px;
            padding-top: 14px;
            border-top: 1px solid #e8edf4;
            flex-wrap: wrap;
            gap: 10px;
        }
        .pagination .pages {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }
        .page-item {
            padding: 5px 12px;
            border-radius: 8px;
            font-size: 13px;
            cursor: pointer;
            border: 1px solid #dce5ef;
            background: #fff;
            color: #1e3a5f;
            transition: 0.1s;
        }
        .page-item:hover { border-color: #4dabf7; color: #2a7faa; }
        .page-item.active { background: #0a1e2f; border-color: #0a1e2f; color: #fff; }

        @media (max-width: 1200px) {
            .stats-grid { grid-template-columns: repeat(2, 1fr); }
            .form-row { grid-template-columns: 1fr 1fr; }
        }
        @media (max-width: 768px) {
            body { padding: 14px; }
            .stats-grid { grid-template-columns: 1fr; }
            .form-row { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

<!-- 统计卡片 -->
<div class="stats-grid">
    <div class="stat-card">
        <div class="label"><i class="fas fa-shopping-cart" style="color:#4dabf7;"></i> 总订单</div>
        <div class="value">347</div>
        <div class="sub">今日 +56</div>
    </div>
    <div class="stat-card">
        <div class="label"><i class="fas fa-check-circle" style="color:#0d7c4f;"></i> 待发货</div>
        <div class="value">89</div>
        <div class="sub">需处理</div>
    </div>
    <div class="stat-card">
        <div class="label"><i class="fas fa-truck" style="color:#4dabf7;"></i> 运输中</div>
        <div class="value">156</div>
        <div class="sub">正常</div>
    </div>
    <div class="stat-card">
        <div class="label"><i class="fas fa-times-circle" style="color:#b51a3f;"></i> 退款/售后</div>
        <div class="value">12</div>
        <div class="sub">需关注 5</div>
    </div>
</div>

<!-- 筛选 -->
<div class="card">
    <div class="card-header">
        <h3><i class="fas fa-filter"></i> 订单筛选</h3>
        <span class="action" onclick="showToast('🔄 已重置筛选条件')">
