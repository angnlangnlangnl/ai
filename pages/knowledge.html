<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>知识库管理</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="../css/common.css">
    <script src="../js/auth.js"></script>
    <script>requireLogin();</script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        html, body { height: 100%; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: #eef2f8;
            color: #0a1a2b;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* ===== 工具条 ===== */
        .toolbar {
            background: #fff;
            border-bottom: 1px solid #e8edf4;
            padding: 10px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
            flex-shrink: 0;
        }
        .toolbar .tb-left {
            display: flex; align-items: center; gap: 12px;
            font-size: 13px; color: #5f7d95;
        }
        .toolbar .tb-left strong { color: #0a1e2f; }
        .toolbar .tb-right {
            display: flex; gap: 8px; align-items: center; flex-wrap: wrap;
        }
        .toolbar .tb-btn {
            padding: 6px 14px; border-radius: 20px;
            border: 1px solid #dce5ef; background: #fff;
            color: #1e3a5f; font-size: 12px; font-weight: 500;
            cursor: pointer; display: inline-flex; align-items: center; gap: 5px;
            transition: 0.12s; font-family: inherit; white-space: nowrap;
        }
        .toolbar .tb-btn:hover {
            border-color: #4dabf7; color: #2a7faa; background: #f5f9fe;
        }
        .toolbar .tb-btn i { color: #5f7d95; }
        .toolbar .tb-btn:hover i { color: #4dabf7; }
        .toolbar .tb-btn.primary {
            background: #0a1e2f;
            border-color: #0a1e2f;
            color: #fff;
        }
        .toolbar .tb-btn.primary:hover { background: #1a3a5a; }
        .toolbar .tb-btn.primary i { color: rgba(255,255,255,0.7); }

        /* ===== 主体 ===== */
        .app-body {
            flex: 1;
            overflow-y: auto;
            padding: 16px 20px 20px;
        }
        .app-body::-webkit-scrollbar { width: 6px; }
        .app-body::-webkit-scrollbar-thumb { background: #c8d8e8; border-radius: 10px; }

        /* ===== 统计 ===== */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 14px;
            margin-bottom: 16px;
        }
        .stat-card {
            background: #fff;
            padding: 16px 18px;
            border-radius: 14px;
            border: 1px solid #e8edf4;
            box-shadow: 0 2px 8px rgba(10,30,47,0.02);
            transition: 0.15s;
        }
        .stat-card:hover {
            box-shadow: 0 6px 20px rgba(10,30,47,0.06);
            border-color: #c8d8e8;
        }
        .stat-card .label {
            font-size: 12px; font-weight: 500; color: #5f7d95;
            display: flex; align-items: center; gap: 6px;
            margin-bottom: 6px;
        }
        .stat-card .label i { color: #4dabf7; }
        .stat-card .value {
            font-size: 24px; font-weight: 700; color: #0a1e2f;
            letter-spacing: -0.02em;
        }
        .stat-card .value small {
            font-size: 12px; color: #5f7d95; font-weight: 400;
        }
        .stat-card .sub {
            font-size: 12px; color: #5f7d95;
            margin-top: 4px;
        }

        /* ===== 卡片 ===== */
        .card {
            background: #fff;
            border-radius: 14px;
            border: 1px solid #e8edf4;
            padding: 16px 20px;
            margin-bottom: 16px;
            box-shadow: 0 2px 8px rgba(10,30,47,0.02);
        }

        /* ===== 筛选栏 ===== */
        .filter-bar {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
            margin-bottom: 14px;
        }
        .filter-bar input[type="text"],
        .filter-bar select {
            padding: 8px 12px;
            border-radius: 10px;
            border: 1px solid #dce5ef;
            background: #fff;
            font-size: 13px;
            font-family: inherit;
            outline: none;
            color: #0a1e2f;
        }
        .filter-bar input[type="text"]:focus,
        .filter-bar select:focus {
            border-color: #4dabf7;
            box-shadow: 0 0 0 3px rgba(77,171,247,0.08);
        }
        .filter-bar input[type="text"] {
            flex: 1;
            min-width: 180px;
        }
        .filter-bar .btn-sm {
            padding: 8px 16px;
            border-radius: 20px;
            border: none;
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            transition: 0.12s;
            font-family: inherit;
            white-space: nowrap;
        }
        .filter-bar .btn-sm.primary {
            background: #0a1e2f; color: #fff;
        }
        .filter-bar .btn-sm.primary:hover { background: #1a3a5a; }
        .filter-bar .btn-sm.outline {
            background: #fff; color: #1e3a5f;
            border: 1px solid #dce5ef;
        }
        .filter-bar .btn-sm.outline:hover {
            border-color: #4dabf7; color: #2a7faa; background: #f5f9fe;
        }
        .filter-bar .btn-sm.blue {
            background: rgba(77,171,247,0.12); color: #2a7faa;
        }
        .filter-bar .btn-sm.blue:hover { background: rgba(77,171,247,0.2); }

        /* ===== 分类树 ===== */
        .kb-category-tree {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            padding: 10px 12px;
            background: #f8fafc;
            border-radius: 10px;
            border: 1px solid #e8edf4;
            margin-bottom: 14px;
        }
        .kb-cat-chip {
            padding: 5px 12px;
            border-radius: 20px;
            background: #fff;
            color: #5f7d95;
            font-size: 12px;
            cursor: pointer;
            border: 1px solid #dce5ef;
            transition: 0.12s;
        }
        .kb-cat-chip:hover {
            border-color: #4dabf7;
            color: #2a7faa;
        }
        .kb-cat-chip.active {
            background: #0a1e2f;
            color: #fff;
            border-color: #0a1e2f;
        }
        .kb-cat-chip .count {
            font-size: 10px;
            color: #94a3b8;
            margin-left: 4px;
        }
        .kb-cat-chip.active .count {
            color: rgba(255,255,255,0.6);
        }

        /* ===== 知识卡片 ===== */
        .kb-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 14px;
        }
        .kb-card {
            background: #fff;
            border-radius: 14px;
            border: 1px solid #e8edf4;
            padding: 16px;
            transition: 0.15s;
            position: relative;
        }
        .kb-card:hover {
            box-shadow: 0 6px 20px rgba(10,30,47,0.08);
            border-color: #c8d8e8;
            transform: translateY(-2px);
        }
        .kb-card.disabled {
            opacity: 0.55;
            background: #f5f7fa;
        }
        .kb-card.pinned {
            border-color: #f5b342;
            box-shadow: 0 0 0 1px #f5b342 inset;
        }
        .kb-card .kb-head {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 10px;
            gap: 8px;
        }
        .kb-card .kb-title {
            font-size: 15px;
            font-weight: 600;
            color: #0a1e2f;
            line-height: 1.4;
            flex: 1;
            word-break: break-word;
        }
        .kb-card .kb-title .pin-icon {
            color: #f5b342;
            margin-right: 4px;
        }
        .kb-card .kb-cat {
            font-size: 10px;
            padding: 3px 10px;
            border-radius: 20px;
            background: #f0f7fe;
            color: #2a7faa;
            flex-shrink: 0;
            white-space: nowrap;
            font-weight: 500;
        }
        .kb-card .kb-summary {
            font-size: 13px;
            color: #5f7d95;
            line-height: 1.6;
            margin: 8px 0;
            overflow: hidden;
            text-overflow: ellipsis;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
        }
        .kb-card .kb-tags {
            display: flex;
            gap: 4px;
            flex-wrap: wrap;
            margin: 10px 0;
        }
        .kb-card .kb-tag {
            font-size: 11px;
            padding: 3px 10px;
            border-radius: 20px;
            background: #f0f4f9;
            color: #5f7d95;
        }
        .kb-card .kb-foot {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 11px;
            color: #94a3b8;
            padding-top: 10px;
            border-top: 1px solid #f0f4f9;
            gap: 8px;
            flex-wrap: wrap;
        }
        .kb-card .kb-foot .kb-stat {
            display: flex;
            gap: 10px;
        }
        .kb-card .kb-foot .kb-stat span {
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }
        .kb-card-actions {
            display: flex;
            gap: 6px;
            padding-top: 10px;
            margin-top: 10px;
            border-top: 1px solid #f0f4f9;
        }
        .kb-act-btn {
            flex: 1;
            padding: 7px;
            border-radius: 8px;
            border: 1px solid #dce5ef;
            background: #fff;
            color: #5f7d95;
            cursor: pointer;
            font-size: 12px;
            transition: 0.12s;
            font-family: inherit;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
        }
        .kb-act-btn:hover {
            border-color: #4dabf7;
            color: #2a7faa;
            background: #f5f9fe;
        }
        .kb-act-btn.danger:hover {
            border-color: #b51a3f;
            color: #b51a3f;
            background: #fde8ed;
        }

        /* ===== 空状态 ===== */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #94a3b8;
        }
        .empty-state i {
            font-size: 56px;
            color: #dce5ef;
            margin-bottom: 14px;
            display: block;
        }
        .empty-state h3 {
            font-size: 16px;
            color: #0a1e2f;
            margin-bottom: 6px;
        }
        .empty-state p { font-size: 13px; }

        /* ===== 上传弹窗 ===== */
        .upload-modal {
            position: fixed;
            inset: 0;
            background: rgba(10,30,47,0.55);
            backdrop-filter: blur(4px);
            z-index: 9999;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .upload-modal.show { display: flex; animation: fadeIn 0.2s ease; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .upload-box {
            background: #fff;
            border-radius: 16px;
            max-width: 500px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: 0 24px 64px rgba(0,0,0,0.3);
            animation: slideUp 0.25s ease;
        }
        @keyframes slideUp {
            from { transform: translateY(20px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        .upload-head {
            padding: 18px 22px 14px;
            border-bottom: 1px solid #e8edf4;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .upload-head h3 {
            font-size: 16px;
            font-weight: 600;
            color: #0a1e2f;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .upload-head h3 i { color: #4dabf7; }
        .upload-head .close {
            width: 30px; height: 30px;
            border-radius: 50%;
            border: none;
            background: #f0f4f9;
            color: #5f7d95;
            cursor: pointer;
            font-size: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .upload-head .close:hover { background: #fde8ed; color: #b51a3f; }
        .upload-body { padding: 18px 22px; }
        .upload-body .form-group { margin-bottom: 14px; }
        .upload-body label {
            display: block;
            font-size: 12px;
            font-weight: 500;
            color: #5f7d95;
            margin-bottom: 6px;
        }
        .upload-body label .req { color: #b51a3f; }
        .upload-body input[type="text"],
        .upload-body select {
            width: 100%;
            padding: 10px 14px;
            border: 1px solid #dce5ef;
            border-radius: 10px;
            background: #fafcfe;
            font-size: 13px;
            font-family: inherit;
            outline: none;
            color: #0a1e2f;
        }
        .upload-body input[type="text"]:focus,
        .upload-body select:focus {
            border-color: #4dabf7;
            background: #fff;
            box-shadow: 0 0 0 3px rgba(77,171,247,0.08);
        }
        .upload-body .file-input-wrap {
            border: 2px dashed #dce5ef;
            border-radius: 10px;
            padding: 24px;
            text-align: center;
            cursor: pointer;
            transition: 0.15s;
            background: #fafcfe;
        }
        .upload-body .file-input-wrap:hover {
            border-color: #4dabf7;
            background: #f5f9fe;
        }
        .upload-body .file-input-wrap.dragover {
            border-color: #4dabf7;
            background: #f0f7fe;
        }
        .upload-body .file-input-wrap i {
            font-size: 32px;
            color: #4dabf7;
            margin-bottom: 8px;
            display: block;
        }
        .upload-body .file-input-wrap p {
            font-size: 13px;
            color: #5f7d95;
        }
        .upload-body .file-input-wrap small {
            font-size: 11px;
            color: #94a3b8;
            display: block;
            margin-top: 4px;
        }
        .upload-body .selected-file {
            background: #f0f7fe;
            border-radius: 10px;
            padding: 10px 14px;
            margin-top: 8px;
            font-size: 13px;
            color: #2a7faa;
            display: none;
            align-items: center;
            gap: 8px;
        }
        .upload-body .selected-file.show { display: flex; }
        .upload-body .selected-file .name {
            flex: 1;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .upload-foot {
            display: flex;
            gap: 10px;
            padding: 14px 22px;
            border-top: 1px solid #e8edf4;
            background: #fafcfe;
        }
        .upload-foot .btn {
            flex: 1;
            padding: 11px 18px;
            border-radius: 10px;
            border: none;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            font-family: inherit;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            transition: 0.15s;
        }
        .upload-foot .btn.primary {
            background: #0a1e2f;
            color: #fff;
        }
        .upload-foot .btn.primary:hover { background: #1a3a5a; }
        .upload-foot .btn.primary:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .upload-foot .btn.outline {
            background: #fff;
            border: 1px solid #dce5ef;
            color: #1e3a5f;
            flex: 0 0 auto;
        }
        .upload-foot .btn.outline:hover { background: #f5f8fc; }

        /* ============================================================
           ★ 编辑弹窗：加宽 + 分屏 + 富文本
           ============================================================ */
        .edit-modal .upload-box {
            max-width: 1200px;
            width: 94vw;
            max-height: 94vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            padding: 0;
        }
        .edit-modal .upload-head {
            padding: 16px 24px 14px;
            background: #fff;
            border-bottom: 1px solid #e8edf4;
            flex-shrink: 0;
        }
        .edit-modal .upload-head .head-actions {
            display: flex;
            gap: 8px;
            align-items: center;
            margin-left: auto;
            margin-right: 12px;
        }
        .edit-modal .upload-head .head-actions .mode-btn {
            padding: 5px 12px;
            border-radius: 8px;
            border: 1px solid #dce5ef;
            background: #fff;
            color: #5f7d95;
            font-size: 12px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            transition: 0.12s;
            font-family: inherit;
        }
        .edit-modal .upload-head .head-actions .mode-btn:hover {
            border-color: #4dabf7;
            color: #2a7faa;
        }
        .edit-modal .upload-head .head-actions .mode-btn.active {
            background: #0a1e2f;
            color: #fff;
            border-color: #0a1e2f;
        }

        .edit-modal .upload-body {
            padding: 16px 24px;
            overflow-y: auto;
            flex: 1;
        }
        .edit-modal .upload-body::-webkit-scrollbar { width: 6px; }
        .edit-modal .upload-body::-webkit-scrollbar-thumb {
            background: #c8d8e8;
            border-radius: 10px;
        }

        .edit-modal .edit-meta-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
            margin-bottom: 14px;
        }

        /* ===== 工具栏 ===== */
        .md-toolbar {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
            padding: 8px 10px;
            background: #f8fafc;
            border: 1px solid #e8edf4;
            border-bottom: none;
            border-radius: 10px 10px 0 0;
            align-items: center;
        }
        .md-tool-btn {
            width: 30px;
            height: 30px;
            border-radius: 6px;
            border: none;
            background: transparent;
            color: #5f7d95;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            transition: 0.12s;
            font-family: inherit;
        }
        .md-tool-btn:hover {
            background: #e8edf4;
            color: #2a7faa;
        }
        .md-tool-btn.active {
            background: #0a1e2f;
            color: #fff;
        }
        .md-tool-divider {
            width: 1px;
            height: 20px;
            background: #dce5ef;
            margin: 0 4px;
        }

        /* ===== 分屏容器 ===== */
        .edit-split {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
            min-height: 480px;
        }
        .edit-split.mode-edit-only { grid-template-columns: 1fr; }
        .edit-split.mode-preview-only { grid-template-columns: 1fr; }
        .edit-split.mode-edit-only .edit-preview-wrap { display: none; }
        .edit-split.mode-preview-only .edit-editor-wrap { display: none; }

        .edit-editor-wrap,
        .edit-preview-wrap {
            display: flex;
            flex-direction: column;
            min-width: 0;
            border: 1px solid #e8edf4;
            border-radius: 10px;
            overflow: hidden;
            background: #fff;
        }

        .edit-pane-head {
            padding: 8px 14px;
            background: #f8fafc;
            border-bottom: 1px solid #e8edf4;
            font-size: 12px;
            font-weight: 600;
            color: #5f7d95;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .edit-pane-head .pane-count {
            font-size: 11px;
            color: #94a3b8;
            font-weight: 400;
        }

        .edit-content-area {
            flex: 1;
            width: 100%;
            padding: 14px 18px;
            border: none;
            background: #fff;
            font-size: 14px;
            font-family: 'SF Mono', Monaco, 'Cascadia Code', Consolas, monospace;
            line-height: 1.7;
            outline: none;
            color: #0a1e2f;
            resize: none;
            min-height: 440px;
        }
        .edit-content-area::placeholder { color: #b8c8d8; }

        /* ===== Markdown 预览 ===== */
        .edit-preview {
            flex: 1;
            padding: 14px 20px;
            overflow-y: auto;
            font-size: 14px;
            line-height: 1.75;
            color: #0a1e2f;
            background: #fff;
            min-height: 440px;
        }
        .edit-preview::-webkit-scrollbar { width: 6px; }
        .edit-preview::-webkit-scrollbar-thumb {
            background: #dce5ef;
            border-radius: 10px;
        }
        .edit-preview h1 {
            font-size: 24px;
            font-weight: 700;
            margin: 16px 0 10px;
            padding-bottom: 8px;
            border-bottom: 2px solid #e8edf4;
            color: #0a1e2f;
        }
        .edit-preview h1:first-child { margin-top: 0; }
        .edit-preview h2 {
            font-size: 20px;
            font-weight: 700;
            margin: 18px 0 10px;
            padding-bottom: 6px;
            border-bottom: 1px solid #e8edf4;
            color: #0a1e2f;
        }
        .edit-preview h3 {
            font-size: 16px;
            font-weight: 600;
            margin: 14px 0 8px;
            color: #0a1e2f;
        }
        .edit-preview h4 {
            font-size: 14px;
            font-weight: 600;
            margin: 12px 0 6px;
            color: #2a7faa;
        }
        .edit-preview p {
            margin: 8px 0;
        }
        .edit-preview strong { font-weight: 700; color: #0a1e2f; }
        .edit-preview em { font-style: italic; color: #5f7d95; }
        .edit-preview code {
            background: #f0f4f9;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 13px;
            color: #b55a1a;
            font-family: 'SF Mono', Monaco, monospace;
        }
        .edit-preview pre {
            background: #0a1e2f;
            color: #e2e8f0;
            padding: 12px 16px;
            border-radius: 8px;
            overflow-x: auto;
            margin: 10px 0;
            font-size: 13px;

        /* 分屏响应式 */

<script>
    const BACKEND_URL = 'https://ai-ecommerce-backend-production-0776.up.railway.app';

    const state = {
        kbItems: [],
        kbStats: {},
        kbCategories: [],
        kbFilterCategory: 'all',
        kbFile: null,
        editMode: 'split'
    };

    document.addEventListener('DOMContentLoaded', function () {
        loadKb();
        bindDragEvents();
        bindGlobalShortcuts();
    });

    function bindDragEvents() {
        const kbWrap = document.getElementById('kbFileWrap');
        ['dragenter', 'dragover'].forEach(ev => kbWrap.addEventListener(ev, e => {
            e.preventDefault();
            kbWrap.classList.add('dragover');
        }));
        ['dragleave', 'drop'].forEach(ev => kbWrap.addEventListener(ev, e => {
            e.preventDefault();
            kbWrap.classList.remove('dragover');
        }));
        kbWrap.addEventListener('drop', e => {
            const file = e.dataTransfer.files[0];
            if (file) {
                document.getElementById('kbFileInput').files = e.dataTransfer.files;
                onKbFileSelected({ target: { files: [file] } });
            }
        });
    }

    // ★ 全局快捷键（弹窗打开时）
    function bindGlobalShortcuts() {
        document.addEventListener('keydown', function (e) {
            const modal = document.getElementById('kbEditModal');
            if (!modal || !modal.classList.contains('show')) return;

            // Ctrl+S 保存
            if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's') {
                e.preventDefault();
                submitKbEdit();
            }
            // Esc 关闭
            if (e.key === 'Escape') {
                closeKbEdit();
            }
        });
    }

    // ============================================================
    // Markdown 编辑
    // ============================================================
    function onEditInput() {
        const ta = document.getElementById('editKbContent');
        const preview = document.getElementById('editPreview');
        const count = document.getElementById('editPaneCount');
        const counter = document.getElementById('editKbContentLen');

        const text = ta.value;
        if (count) count.textContent = text.length + ' 字';
        if (counter) counter.textContent = `（${text.length} 字）`;

        renderMarkdownPreview(text, preview);
    }

    function renderMarkdownPreview(text, preview) {
        if (!text || !text.trim()) {
            preview.innerHTML = '<div class="md-empty"><i class="fas fa-eye"></i><br>暂无内容，输入后自动预览</div>';
            return;
        }
        preview.innerHTML = markdownToHtml(text);
    }

    // ============================================================
    // 极简 Markdown 渲染（不依赖第三方库）
    // ============================================================
    function markdownToHtml(md) {
        let html = escapeHtml(md);

        // 代码块 ```xxx```
        const codeBlocks = [];
        html = html.replace(/```([\s\S]*?)```/g, function (_, code) {
            const idx = codeBlocks.length;
            codeBlocks.push(code);
            return `\u0000CODE${idx}\u0000`;
        });

        // 行内代码 `xxx`
        html = html.replace(/`([^`\n]+)`/g, '<code>$1</code>');

        // 分割线
        html = html.replace(/^---$/gm, '<hr>');

        // 标题
        html = html.replace(/^###### (.+)$/gm, '<h4>$1</h4>');
        html = html.replace(/^##### (.+)$/gm, '<h4>$1</h4>');
        html = html.replace(/^#### (.+)$/gm, '<h4>$1</h4>');
        html = html.replace(/^### (.+)$/gm, '<h3>$1</h3>');
        html = html.replace(/^## (.+)$/gm, '<h2>$1</h2>');
        html = html.replace(/^# (.+)$/gm, '<h1>$1</h1>');

        // 引用
        html = html.replace(/^&gt; (.+)$/gm, '<blockquote>$1</blockquote>');
        html = html.replace(/<\/blockquote>\n<blockquote>/g, '\n');

        // 加粗 / 斜体 / 删除线
        html = html.replace(/\*\*([^*\n]+)\*\*/g, '<strong>$1</strong>');
        html = html.replace(/\*([^*\n]+)\*/g, '<em>$1</em>');
        html = html.replace(/~~([^~\n]+)~~/g, '<del>$1</del>');

        // 链接 [text](url)
        html = html.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank">$1</a>');

        // 表格
        html = renderTables(html);

        // 列表
        html = renderLists(html);

        // 段落换行
        html = html.split('\n\n').map(function (block) {
            if (/^<(h[1-6]|ul|ol|blockquote|pre|table|hr|div)/.test(block.trim())) {
                return block;
            }
            return '<p>' + block.replace(/\n/g, '<br>') + '</p>';
        }).join('\n');

        // 还原代码块
        html = html.replace(/\u0000CODE(\d+)\u0000/g, function (_, i) {
            return '<pre><code>' + codeBlocks[parseInt(i, 10)] + '</code></pre>';
        });

        return html;
    }

    function renderTables(html) {
        const lines = html.split('\n');
        const out = [];
        let i = 0;
        while (i < lines.length) {
            if (lines[i].includes('|') && i + 1 < lines.length && /^\s*\|?[\s\-:|]+\|[\s\-:|]+$/.test(lines[i + 1])) {
                const header = lines[i].split('|').map(s => s.trim()).filter(s => s);
                const rows = [];
                i += 2;
                while (i < lines.length && lines[i].includes('|')) {
                    const cells = lines[i].split('|').map(s => s.trim());
                    rows.push(cells.filter((_, idx) => idx > 0 && idx < cells.length - 1));
                    i++;
                }
                let table = '<table><thead><tr>';
                header.forEach(h => { table += `<th>${h}</th>`; });
                table += '</tr></thead><tbody>';
                rows.forEach(row => {
                    table += '<tr>';
                    row.forEach(c => { table += `<td>${c}</td>`; });
                    table += '</tr>';
                });
                table += '</tbody></table>';
                out.push(table);
            } else {
                out.push(lines[i]);
                i++;
            }
        }
        return out.join('\n');
    }

    function renderLists(html) {
        const lines = html.split('\n');
        const out = [];
        let inUl = false, inOl = false;
        lines.forEach(line => {
            if (/^\s*[-*]\s+(.+)$/.test(line)) {
                if (inOl) { out.push('</ol>'); inOl = false; }
                if (!inUl) { out.push('<ul>'); inUl = true; }
                out.push('<li>' + line.replace(/^\s*[-*]\s+/, '') + '</li>');
            } else if (/^\s*\d+\.\s+(.+)$/.test(line)) {
                if (inUl) { out.push('</ul>'); inUl = false; }
                if (!inOl) { out.push('<ol>'); inOl = true; }
                out.push('<li>' + line.replace(/^\s*\d+\.\s+/, '') + '</li>');
            } else {
                if (inUl) { out.push('</ul>'); inUl = false; }
                if (inOl) { out.push('</ol>'); inOl = false; }
                out.push(line);
            }
        });
        if (inUl) out.push('</ul>');
        if (inOl) out.push('</ol>');
        return out.join('\n');
    }

    // ============================================================
    // 工具栏命令
    // ============================================================
    function mdCmd(cmd) {
        const ta = document.getElementById('editKbContent');
        const start = ta.selectionStart;
        const end = ta.selectionEnd;
        const selected = ta.value.substring(start, end);
        const before = ta.value.substring(0, start);
        const after = ta.value.substring(end);

        let newText = '', newCursorStart = start, newCursorEnd = start;

        const wrap = (pre, suf, placeholder) => {
            const content = selected || placeholder;
            newText = pre + content + suf;
            newCursorStart = start + pre.length;
            newCursorEnd = newCursorStart + content.length;
        };

        const prefixLine = (prefix, placeholder) => {
            const lineStart = before.lastIndexOf('\n') + 1;
            const insertAt = lineStart;
            newText = prefix + (selected || placeholder);
            // 简化：在当前位置插入
            ta.value = ta.value.substring(0, start) + newText + after;
            ta.selectionStart = start + prefix.length;
            ta.selectionEnd = start + prefix.length + (selected || placeholder).length;
            onEditInput();
            ta.focus();
            return;
        };

        switch (cmd) {
            case 'bold': wrap('**', '**', '粗体文字'); break;
            case 'italic': wrap('*', '*', '斜体文字'); break;
            case 'strike': wrap('~~', '~~', '删除线'); break;
            case 'code': wrap('`', '`', 'code'); break;
            case 'codeblock':
                newText = '\n```\n' + (selected || 'code here') + '\n```\n';
                newCursorStart = start + 4;
                newCursorEnd = newCursorStart + (selected || 'code here').length;
                break;
            case 'link': wrap('[', '](https://)', '链接文字'); break;
            case 'h1': prefixLine('# ', '标题1'); return;
            case 'h2': prefixLine('## ', '标题2'); return;
            case 'h3': prefixLine('### ', '标题3'); return;
            case 'ul': prefixLine('- ', '列表项'); return;
            case 'ol': prefixLine('1. ', '列表项'); return;
            case 'quote': prefixLine('> ', '引用内容'); return;
            case 'table':
                newText = '\n| 列1 | 列2 | 列3 |\n| --- | --- | --- |\n| 内容 | 内容 | 内容 |\n';
                newCursorStart = start + newText.length;
                newCursorEnd = newCursorStart;
                break;
            case 'hr':
                newText = '\n---\n';
                newCursorStart = start + newText.length;
                newCursorEnd = newCursorStart;
                break;
            case 'undo':
                document.execCommand && document.execCommand('undo');
                return;
            default: return;
        }

        ta.value = before + newText + after;
        ta.selectionStart = newCursorStart;
        ta.selectionEnd = newCursorEnd;
        onEditInput();
        ta.focus();
    }

    // ============================================================
    // 编辑区快捷键
    // ============================================================
    function onEditKeyDown(e) {
        const ta = e.target;

        // Ctrl+S 保存
        if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's') {
            e.preventDefault();
            submitKbEdit();
            return;
        }
        // Ctrl+B 加粗
        if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'b') {
            e.preventDefault();
            mdCmd('bold');
            return;
        }
        // Ctrl+I 斜体
        if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'i') {
            e.preventDefault();
            mdCmd('italic');
            return;
        }
        // Ctrl+K 链接
        if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') {
            e.preventDefault();
            mdCmd('link');
            return;
        }
        // Ctrl+1~4 标题
        if ((e.ctrlKey || e.metaKey) && ['1', '2', '3', '4'].includes(e.key)) {
            e.preventDefault();
            mdCmd('h' + e.key);
            return;
        }
        // Tab 缩进
        if (e.key === 'Tab') {
            e.preventDefault();
            const start = ta.selectionStart;
            const end = ta.selectionEnd;
            if (e.shiftKey) {
                // Shift+Tab 取消缩进
                const before = ta.value.substring(0, start);
                const lineStart = before.lastIndexOf('\n') + 1;
                if (ta.value.substring(lineStart, lineStart + 4) === '    ') {
                    ta.value = ta.value.substring(0, lineStart) + ta.value.substring(lineStart + 4);
                    ta.selectionStart = ta.selectionEnd = Math.max(lineStart, start - 4);
                } else if (ta.value.substring(lineStart, lineStart + 1) === '\t') {
                    ta.value = ta.value.substring(0, lineStart) + ta.value.substring(lineStart + 1);
                    ta.selectionStart = ta.selectionEnd = Math.max(lineStart, start - 1);
                }
            } else {
                // Tab 插入 4 空格
                ta.value = ta.value.substring(0, start) + '    ' + ta.value.substring(end);
                ta.selectionStart = ta.selectionEnd = start + 4;
            }
            onEditInput();
            return;
        }
        // Enter 自动续写列表
        if (e.key === 'Enter' && !e.shiftKey) {
            const start = ta.selectionStart;
            const before = ta.value.substring(0, start);
            const lineStart = before.lastIndexOf('\n') + 1;
            const lineText = before.substring(lineStart);
            const ulMatch = lineText.match(/^(\s*)([-*])\s+(.*)$/);
            const olMatch = lineText.match(/^(\s*)(\d+)\.\s+(.*)$/);
            if (ulMatch) {
                if (ulMatch[3].trim() === '') {
                    // 空列表 → 取消列表
                    e.preventDefault();
                    ta.value = ta.value.substring(0, lineStart) + ta.value.substring(start);
                    ta.selectionStart = ta.selectionEnd = lineStart;
                    onEditInput();
                } else {
                    e.preventDefault();
                    const indent = ulMatch[1];
                    const ins = '\n' + indent + ulMatch[2] + ' ';
                    ta.value = ta.value.substring(0, start) + ins + ta.value.substring(ta.selectionEnd);
                    ta.selectionStart = ta.selectionEnd = start + ins.length;
                    onEditInput();
                }
            } else if (olMatch) {
                if (olMatch[3].trim() === '') {
                    e.preventDefault();
                    ta.value = ta.value.substring(0, lineStart) + ta.value.substring(start);
                    ta.selectionStart = ta.selectionEnd = lineStart;
                    onEditInput();
                } else {
                    e.preventDefault();
                    const indent = olMatch[1];
                    const nextNum = parseInt(olMatch[2], 10) + 1;
                    const ins = '\n' + indent + nextNum + '. ';
                    ta.value = ta.value.substring(0, start) + ins + ta.value.substring(ta.selectionEnd);
                    ta.selectionStart = ta.selectionEnd = start + ins.length;
                    onEditInput();
                }
            }
        }
    }

    // ============================================================
    // 分屏同步滚动（可选）

    function syncScroll() {
        // 只同步滚动比例，不严格对齐
        const ta = document.getElementById('editKbContent');
        const preview = document.getElementById('editPreview');
        if (!ta || !preview) return;
        const ratio = ta.scrollTop / Math.max(1, ta.scrollHeight - ta.clientHeight);

    }

    // ============================================================
    // 加载
    // ============================================================
    async function loadKb() {
        try {
            const res = await fetch(BACKEND_URL + '/api/kb/list');
            const data = await res.json();
            if (data.success) {
                state.kbItems = data.items || [];
                state.kbStats = data.stats || {};
                state.kbCategories = data.categories || [];
                fillKbCategorySelects();
                renderKbCategoryTree();
                renderKb();
                updateStats();
            }
        } catch (e) {
            console.warn('加载知识库失败', e);
        }
    }

    function updateStats() {
        const items = state.kbItems;
        const enabled = items.filter(x => x.enabled !== false).length;
        const disabled = items.length - enabled;
        let totalHits = 0, totalSat = 0, totalUnsat = 0;
        items.forEach(x => {
            const s = state.kbStats[x.id];
            if (s) {
                totalHits += s.hit_count || 0;
                totalSat += s.satisfied || 0;
                totalUnsat += s.unsatisfied || 0;
            }
        });
        const feedbackTotal = totalSat + totalUnsat;
        const satRate = feedbackTotal > 0 ? Math.round(totalSat / feedbackTotal * 100) + '%' : '-';

        document.getElementById('statKbTotal').textContent = items.length;
        document.getElementById('statKbEnabled').textContent = enabled;
        document.getElementById('statKbDisabled').textContent = disabled;
        document.getElementById('statKbHits').textContent = totalHits;
        document.getElementById('statKbSatisfaction').textContent = satRate;
        document.getElementById('statKbFeedback').textContent = feedbackTotal;
        document.getElementById('statKbCatCount').textContent = flattenCategories(state.kbCategories, 0).length;
        document.getElementById('toolbarKbCount').textContent = items.length;
    }

    function flattenCategories(tree, depth, result) {
        if (!result) result = [];
        tree.forEach(n => {
            result.push({ id: n.id, name: n.name, icon: n.icon || '', depth: depth });
            if (n.children && n.children.length > 0) {
                flattenCategories(n.children, depth + 1, result);
            }
        });
        return result;
    }

    function fillKbCategorySelects() {
        const flat = flattenCategories(state.kbCategories || [], 0, []);
        const catSel = document.getElementById('kbCategory');
        if (catSel) {
            catSel.innerHTML = flat.map(x => `<option value="${x.id}">${'　'.repeat(x.depth)}${x.icon} ${escapeHtml(x.name)}</option>`).join('');
        }
        const editSel = document.getElementById('editKbCategory');
        if (editSel) {
            editSel.innerHTML = flat.map(x => `<option value="${x.id}">${'　'.repeat(x.depth)}${x.icon} ${escapeHtml(x.name)}</option>`).join('');
        }
        const parentSel = document.getElementById('newCatParent');
        if (parentSel) {
            const cur = parentSel.value;
            parentSel.innerHTML = '<option value="">作为一级分类</option>' +
                flat.map(x => `<option value="${x.id}">${'　'.repeat(x.depth)}${x.icon} ${escapeHtml(x.name)}</option>`).join('');
            parentSel.value = cur;
        }
    }

    function renderKbCategoryTree() {
        const tree = document.getElementById('kbCategoryTree');
        const flat = flattenCategories(state.kbCategories || [], 0, []);
        const counts = {};
        state.kbItems.forEach(item => {
            counts[item.category] = (counts[item.category] || 0) + 1;
        });
        tree.innerHTML = `
            <span class="kb-cat-chip ${state.kbFilterCategory === 'all' ? 'active' : ''}"
                  onclick="filterKbByCategory('all')">全部 <span class="count">(${state.kbItems.length})</span></span>
            ${flat.map(x => `
                <span class="kb-cat-chip ${state.kbFilterCategory === x.id ? 'active' : ''}"
                      onclick="filterKbByCategory('${x.id}')">
                    ${'　'.repeat(x.depth)}${x.icon} ${escapeHtml(x.name)}
                    <span class="count">(${counts[x.id] || 0})</span>
                </span>
            `).join('')}
        `;
    }

    function filterKbByCategory(catId) {
        state.kbFilterCategory = catId;
        renderKbCategoryTree();
        renderKb();
    }

    function renderKb() {
        const grid = document.getElementById('kbGrid');
        const empty = document.getElementById('kbEmpty');

        let list = state.kbItems.slice();
        const keyword = (document.getElementById('kbSearch').value || '').trim().toLowerCase();
        const statusFilter = document.getElementById('kbStatusFilter').value;
        const sortBy = document.getElementById('kbSortBy').value;

        if (state.kbFilterCategory !== 'all') {
            list = list.filter(x => x.category === state.kbFilterCategory);
        }
        if (keyword) {
            list = list.filter(x => {
                const hay = (x.title + ' ' + (x.content || '') + ' ' + (x.tags || []).join(' ')).toLowerCase();
                return hay.includes(keyword);
            });
        }
        if (statusFilter === 'enabled') list = list.filter(x => x.enabled !== false);
        if (statusFilter === 'disabled') list = list.filter(x => x.enabled === false);
        if (statusFilter === 'pinned') list = list.filter(x => x.pinned);

        if (sortBy === 'hit') {
            list.sort((a, b) => (state.kbStats[b.id]?.hit_count || 0) - (state.kbStats[a.id]?.hit_count || 0));
        } else if (sortBy === 'title') {
            list.sort((a, b) => (a.title || '').localeCompare(b.title || ''));
        }

        document.getElementById('kbCount').textContent = list.length;

        if (list.length === 0) {
            grid.innerHTML = '';
            empty.style.display = 'block';
            return;
        }
        empty.style.display = 'none';

        grid.innerHTML = list.map(item => {
            const enabled = item.enabled !== false;
            const pinned = !!item.pinned;
            const stat = state.kbStats[item.id] || {};
            const hitCount = stat.hit_count || 0;
            const satisfied = stat.satisfied || 0;
            const unsatisfied = stat.unsatisfied || 0;
            const tagBadges = (item.tags || []).map(t => `<span class="kb-tag">${escapeHtml(t)}</span>`).join('');

            return `
                <div class="kb-card ${enabled ? '' : 'disabled'} ${pinned ? 'pinned' : ''}">
                    <div class="kb-head">
                        <div class="kb-title">
                            ${pinned ? '<i class="fas fa-thumbtack pin-icon"></i>' : ''}
                            ${escapeHtml(item.title)}
                        </div>
                        <div class="kb-cat">${escapeHtml(item.category_name || item.category || '未分类')}</div>
                    </div>
                    <div class="kb-summary">${escapeHtml((item.content || '').slice(0, 180))}${item.content && item.content.length > 180 ? '...' : ''}</div>
                    ${tagBadges ? `<div class="kb-tags">${tagBadges}</div>` : ''}
                    <div class="kb-foot">
                        <span><i class="fas fa-clock"></i> ${item.updated_at || item.uploaded_at || ''}</span>
                        <div class="kb-stat">
                            <span title="命中次数"><i class="fas fa-fire"></i> ${hitCount}</span>
                            <span title="满意"><i class="fas fa-thumbs-up" style="color:#0d7c4f;"></i> ${satisfied}</span>
                            <span title="不满意"><i class="fas fa-thumbs-down" style="color:#b51a3f;"></i> ${unsatisfied}</span>
                        </div>
                    </div>
                    <div class="kb-card-actions">
                        <button class="kb-act-btn" onclick="editKb('${item.id}')" title="编辑">
                            <i class="fas fa-edit"></i> 编辑
                        </button>
                        <button class="kb-act-btn" onclick="toggleKb('${item.id}', ${!enabled})" title="${enabled ? '停用' : '启用'}">
                            <i class="fas fa-${enabled ? 'toggle-on' : 'toggle-off'}"></i> ${enabled ? '停用' : '启用'}
                        </button>
                        <button class="kb-act-btn" onclick="pinKb('${item.id}', ${!pinned})" title="${pinned ? '取消置顶' : '置顶'}">
                            <i class="fas fa-thumbtack"></i> ${pinned ? '取消' : '置顶'}
                        </button>
                        <button class="kb-act-btn danger" onclick="deleteKb('${item.id}')" title="删除">
                            <i class="fas fa-trash-alt"></i>
                        </button>
                    </div>
                </div>
            `;
        }).join('');
    }

    function openKbUpload() {
        document.getElementById('kbTitle').value = '';
        document.getElementById('kbTags').value = '';
        document.getElementById('kbFileInput').value = '';
        document.getElementById('kbSelectedFile').classList.remove('show');

        document.getElementById('kbUploadModal').classList.remove('show');

    function onKbFileSelected(e) {
        const file = e.target.files[0];
        if (!file) return;
        state.kbFile = file;
        document.getElementById('kbFileName').textContent = file.name;
        document.getElementById('kbFileSize').textContent = formatSize(file.size);
        document.getElementById('kbSelectedFile').classList.add('show');

    async function submitKbUpload() {
        const title = document.getElementById('kbTitle').value.trim();
        if (!title) { showToast('⚠️ 请填写标题'); return; }
        if (!state.kbFile) { showToast('⚠️ 请选择文件'); return; }

        const btn = document.getElementById('kbSubmitBtn');
        btn.disabled = true;
        btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> 上传中...';

        try {
            const formData = new FormData();
            formData.append('file', state.kbFile);
            formData.append('title', title);
            formData.append('category', document.getElementById('kbCategory').value);
            formData.append('tags', document.getElementById('kbTags').value);

            const res = await fetch(BACKEND_URL + '/api/kb/upload', {
                method: 'POST',
                body: formData
            });
            const data = await res.json();
            if (data.success) {
                showToast('✅ ' + data.message);
                closeKbUpload();
                loadKb();
            } else {
                showToast('❌ ' + (data.message || '上传失败'));
            }
        } catch (e) {
            showToast('❌ 网络错误');
        } finally {
            btn.disabled = false;
            btn.innerHTML = '<i class="fas fa-upload"></i> 上传';
        }
    }

    // ============================================================
    // 批量导入
    // ============================================================
    function openKbBatchUpload() {
        const input = document.createElement('input');
        input.type = 'file';
        input.multiple = true;
        input.accept = '.txt,.md,.markdown,.json,.csv,.pdf,.docx';
        input.onchange = async function () {
            const files = Array.from(input.files);
            if (files.length === 0) return;
            if (files.length > 20) { showToast('⚠️ 单次最多 20 个文件'); return; }

            const category = state.kbFilterCategory !== 'all' ? state.kbFilterCategory : 'cat_other';
            const formData = new FormData();
            files.forEach(f => formData.append('files', f));
            formData.append('category', category);
            formData.append('tags', '');

            showToast('⏳ 正在上传 ' + files.length + ' 个文件...');
            try {
                const res = await fetch(BACKEND_URL + '/api/kb/batch-upload', {
                    method: 'POST',
                    body: formData
                });
                const data = await res.json();
                if (data.success) {
                    showToast('✅ ' + data.message);
                    loadKb();
                } else {
                    showToast('❌ ' + (data.message || '上传失败'));
                }
            } catch (e) {
                showToast('❌ 网络错误');
            }
        };
        input.click();
    }

    function editKb(id) {
        const item = state.kbItems.find(x => x.id === id);
        if (!item) return;
        document.getElementById('editKbId').value = id;
        document.getElementById('editKbTitle').value = item.title || '';
        document.getElementById('editKbTags').value = (item.tags || []).join(',');
        document.getElementById('editKbContent').value = item.content || '';

        // 重置为分屏模式
        switchEditMode('split');

        // 首次渲染预览
        onEditInput();

        // 设置分类
        setTimeout(() => {
            document.getElementById('editKbCategory').value = item.category || 'cat_other';
        }, 50);

        document.getElementById('kbEditModal').classList.add('show');

        // 聚焦编辑器
        setTimeout(() => {
            document.getElementById('editKbContent').focus();
        }, 100);
    }
    function closeKbEdit() {
        document.getElementById('kbEditModal').classList.remove('show');
    }
    async function submitKbEdit() {
        const id = document.getElementById('editKbId').value;
        const title = document.getElementById('editKbTitle').value.trim();
        if (!title) { showToast('⚠️ 标题不能为空'); return; }

        const btn = document.getElementById('kbEditSubmitBtn');
        btn.disabled = true;
        btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> 保存中...';

        try {
            const res = await fetch(BACKEND_URL + '/api/kb/update', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    id: id,
                    title: title,
                    content: document.getElementById('editKbContent').value,
                    category: document.getElementById('editKbCategory').value,
                    tags: document.getElementById('editKbTags').value.split(',').map(t => t.trim()).filter(Boolean)
                })
            });
            const data = await res.json();
            if (data.success) {
                showToast('✅ 已保存');
                closeKbEdit();
                loadKb();
            } else {
                showToast('❌ ' + (data.message || '保存失败'));

        } catch (e) {
            showToast('❌ 网络错误');
        } finally {
            btn.disabled = false;
            btn.innerHTML = '<i class="fas fa-save"></i> 保存 (Ctrl+S)';
        }
    }

                </button>
            </div>
        `).join('');
    }
    async function submitNewCategory() {
        const name = document.getElementById('newCatName').value.trim();
        const parent_id = document.getElementById('newCatParent').value || null;
        if (!name) { showToast('⚠️ 请填写分类名'); return; }

        try {
            const res = await fetch(BACKEND_URL + '/api/kb/categories/create', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name, parent_id })
            });
            const data = await res.json();
            if (data.success) {
                showToast('✅ 已添加分类');
                document.getElementById('newCatName').value = '';
                await loadKb();
                fillKbCategorySelects();
                renderCategoryList();
            } else {
                showToast('❌ ' + (data.message || '添加失败'));
            }
        } catch (e) {
            showToast('❌ 网络错误');
        }
    }
    async function deleteCategory(id) {
        if (!confirm('确定删除该分类？')) return;
        try {
            const res = await fetch(BACKEND_URL + '/api/kb/categories/delete', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ id })
            });
            const data = await res.json();
            if (data.success) {
                showToast('✅ 已删除分类');
                await loadKb();
                fillKbCategorySelects();
                renderCategoryList();
            }
        } catch (e) {
            showToast('❌ 网络错误');
        }
    }

    // ============================================================
    // 工具
    // ============================================================
    function escapeHtml(s) {
        return String(s || '').replace(/[&<>"']/g, c => ({
            '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
        })[c]);
    }
    function formatSize(bytes) {
        if (!bytes) return '0B';
        if (bytes < 1024) return bytes + 'B';
        if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + 'KB';
        return (bytes / 1024 / 1024).toFixed(1) + 'MB';
    }
    function showToast(msg) {
        const t = document.getElementById('toast');
        t.textContent = msg;
        t.classList.add('show');
        clearTimeout(t._timer);
        t._timer = setTimeout(() => t.classList.remove('show'), 2200);
    }

    window.submitKbUpload = submitKbUpload;

    window.toggleKb = toggleKb;
    window.pinKb = pinKb;
    window.deleteKb = deleteKb;
    window.filterKbByCategory = filterKbByCategory;
    window.openKbAutoGenerate = openKbAutoGenerate;
    window.openKbCategoryModal = openKbCategoryModal;
    window.closeKbCategoryModal = closeKbCategoryModal;
    window.submitNewCategory = submitNewCategory;
    window.deleteCategory = deleteCategory;
    window.switchEditMode = switchEditMode;

    window.syncScroll = syncScroll;

    console.log('📚 知识库管理页已加载（富文本 + 实时预览 + 分屏 + 快捷键）');
