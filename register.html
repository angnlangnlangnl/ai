<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>注册 · 智控电商 AI</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; overflow: hidden; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto,
                         'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: #050912;
            color: #e6f1ff;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        /* 背景 */
        .aurora {
            position: fixed;
            border-radius: 50%;
            filter: blur(120px);
            opacity: 0.5;
            z-index: 0;
            pointer-events: none;
        }
        .aurora.a1 {
            width: 600px; height: 600px;
            background: radial-gradient(circle, #1e90ff 0%, transparent 70%);
            top: -200px; left: -180px;
            animation: drift1 18s ease-in-out infinite;
        }
        .aurora.a2 {
            width: 500px; height: 500px;
            background: radial-gradient(circle, #6a5cff 0%, transparent 70%);
            bottom: -180px; right: -160px;
            animation: drift2 22s ease-in-out infinite;
        }
        @keyframes drift1 {
            0%, 100% { transform: translate(0, 0) scale(1); }
            50%      { transform: translate(60px, 50px) scale(1.15); }
        }
        @keyframes drift2 {
            0%, 100% { transform: translate(0, 0) scale(1); }
            50%      { transform: translate(-60px, -50px) scale(1.2); }
        }
        .grid-bg {
            position: fixed;
            inset: 0;
            z-index: 0;
            background-image:
                linear-gradient(rgba(77, 171, 247, 0.06) 1px, transparent 1px),
                linear-gradient(90deg, rgba(77, 171, 247, 0.06) 1px, transparent 1px);
            background-size: 60px 60px;
            mask-image: radial-gradient(circle at 50% 50%, #000 30%, transparent 75%);
            -webkit-mask-image: radial-gradient(circle at 50% 50%, #000 30%, transparent 75%);
            pointer-events: none;
        }

        /* 注册卡片 */
        .register-card {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 460px;
            margin: 20px;
            background: rgba(15, 25, 45, 0.7);
            border-radius: 24px;
            padding: 40px 40px 30px;
            backdrop-filter: blur(24px) saturate(180%);
            -webkit-backdrop-filter: blur(24px) saturate(180%);
            border: 1px solid rgba(77, 171, 247, 0.18);
            box-shadow:
                0 20px 60px rgba(0, 0, 0, 0.5),
                0 0 80px rgba(77, 171, 247, 0.08);
            animation: fadeIn 0.6s ease;
            max-height: calc(100vh - 40px);
            overflow-y: auto;
        }
        .register-card::-webkit-scrollbar { width: 4px; }
        .register-card::-webkit-scrollbar-thumb {
            background: rgba(77, 171, 247, 0.3);
            border-radius: 10px;
        }
        .register-card::before {
            content: '';
            position: absolute;
            top: 0; left: -100%;
            width: 100%; height: 2px;
            background: linear-gradient(90deg,
                transparent, #4dabf7, #00d4ff, #4dabf7, transparent);
            animation: scan 4s linear infinite;
        }
        @keyframes scan {
            0%   { left: -100%; }
            100% { left: 100%; }
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(30px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        /* 卡片头 */
        .card-head {
            text-align: center;
            margin-bottom: 24px;
        }
        .card-logo {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 54px;
            height: 54px;
            border-radius: 16px;
            background: linear-gradient(135deg, rgba(77, 171, 247, 0.2), rgba(106, 92, 255, 0.15));
            border: 1px solid rgba(77, 171, 247, 0.3);
            margin-bottom: 14px;
            position: relative;
            box-shadow: 0 0 40px rgba(77, 171, 247, 0.25);
        }
        .card-logo::before {
            content: '';
            position: absolute;
            inset: -2px;
            border-radius: 16px;
            background: linear-gradient(135deg, #4dabf7, #6a5cff, #00d4ff);
            opacity: 0.4;
            filter: blur(12px);
            z-index: -1;
            animation: glow 3s ease-in-out infinite;
        }
        @keyframes glow {
            0%, 100% { opacity: 0.3; }
            50%      { opacity: 0.6; }
        }
        .card-logo i {
            font-size: 24px;
            color: #4dabf7;
            filter: drop-shadow(0 0 8px rgba(77, 171, 247, 0.8));
        }
        .card-title {
            font-size: 22px;
            font-weight: 700;
            color: #fff;
        }
        .card-desc {
            font-size: 13px;
            color: #7a9cc7;
            margin-top: 4px;
        }

        /* 表单 */
        .form-group { margin-bottom: 16px; }
        .form-group label {
            display: block;
            font-size: 12px;
            font-weight: 500;
            color: #7a9cc7;
            margin-bottom: 8px;
            letter-spacing: 0.05em;
            text-transform: uppercase;
        }
        .input-wrap {
            position: relative;
            border-radius: 12px;
            background: rgba(5, 12, 25, 0.5);
            border: 1px solid rgba(77, 171, 247, 0.15);
            transition: 0.2s;
        }
        .input-wrap:focus-within {
            border-color: #4dabf7;
            background: rgba(5, 12, 25, 0.8);
            box-shadow: 0 0 0 4px rgba(77, 171, 247, 0.12),
                        0 0 30px rgba(77, 171, 247, 0.15);
        }
        .input-wrap i {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: #4a6a8c;
            font-size: 14px;
            transition: 0.2s;
            pointer-events: none;
        }
        .input-wrap:focus-within i { color: #4dabf7; }
        .input-wrap input {
            width: 100%;
            padding: 14px 16px 14px 46px;
            background: transparent;
            border: none;
            outline: none;
            font-size: 14px;
            color: #fff;
            font-family: inherit;
        }
        .input-wrap input::placeholder { color: #4a6a8c; }
        .input-wrap input:-webkit-autofill,
        .input-wrap input:-webkit-autofill:hover,
        .input-wrap input:-webkit-autofill:focus {
            -webkit-text-fill-color: #fff;
            transition: background-color 5000s ease-in-out 0s;
        }

        /* 密码强度 */
        .pwd-strength {
            display: flex;
            gap: 4px;
            margin-top: 8px;
        }
        .pwd-strength .bar {
            flex: 1;
            height: 3px;
            background: rgba(77, 171, 247, 0.15);
            border-radius: 3px;
            transition: 0.3s;
        }
        .pwd-strength .bar.on { background: #4dabf7; box-shadow: 0 0 6px rgba(77, 171, 247, 0.6); }
        .pwd-strength .bar.mid { background: #f5b342; box-shadow: 0 0 6px rgba(245, 179, 66, 0.6); }
        .pwd-strength .bar.weak { background: #b51a3f; box-shadow: 0 0 6px rgba(181, 26, 63, 0.6); }
        .pwd-strength .bar.strong { background: #0d7c4f; box-shadow: 0 0 6px rgba(13, 124, 79, 0.6); }
        .pwd-hint {
            font-size: 12px;
            color: #5a7fa8;
            margin-top: 6px;
            min-height: 16px;
        }

        /* 复选框 */
        .agree-row {
            display: flex;
            align-items: flex-start;
            gap: 8px;
            margin: 18px 0;
            font-size: 13px;
            color: #7a9cc7;
            line-height: 1.6;
        }
        .agree-row label {
            display: flex;
            align-items: flex-start;
            gap: 8px;
            cursor: pointer;
            user-select: none;
        }
        .agree-row input[type="checkbox"] {
            appearance: none;
            -webkit-appearance: none;
            width: 16px;
            height: 16px;
            border-radius: 5px;
            border: 1px solid rgba(77, 171, 247, 0.4);
            background: rgba(5, 12, 25, 0.5);
            cursor: pointer;
            position: relative;
            transition: 0.15s;
            flex-shrink: 0;
            margin-top: 2px;
        }
        .agree-row input[type="checkbox"]:checked {
            background: linear-gradient(135deg, #4dabf7, #6a5cff);
            border-color: #4dabf7;
        }
        .agree-row input[type="checkbox"]:checked::after {
            content: '';
            position: absolute;
            left: 4px;
            top: 1px;
            width: 5px;
            height: 9px;
            border: solid #fff;
            border-width: 0 2px 2px 0;
            transform: rotate(45deg);
        }
        .agree-row a {
            color: #4dabf7;
            text-decoration: none;
        }
        .agree-row a:hover { color: #00d4ff; text-decoration: underline; }

        /* 注册按钮 */
        .register-btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(135deg, #1e6fd9, #4dabf7, #00d4ff);
            background-size: 200% 200%;
            color: #fff;
            font-size: 14px;
            font-weight: 600;
            letter-spacing: 0.1em;
            cursor: pointer;
            transition: 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            position: relative;
            overflow: hidden;
            box-shadow: 0 8px 24px rgba(77, 171, 247, 0.3);
        }
        .register-btn:hover {
            background-position: 100% 0;
            transform: translateY(-2px);
            box-shadow: 0 12px 32px rgba(77, 171, 247, 0.5);
        }
        .register-btn:active { transform: translateY(0); }

        /* 底部 */
        .card-foot {
            margin-top: 22px;
            padding-top: 18px;
            border-top: 1px solid rgba(77, 171, 247, 0.12);
            text-align: center;
            font-size: 13px;
            color: #5a7fa8;
        }
        .card-foot a {
            color: #4dabf7;
            text-decoration: none;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            transition: 0.15s;
        }
        .card-foot a:hover {
            color: #00d4ff;
            text-shadow: 0 0 12px rgba(0, 212, 255, 0.5);
        }

        /* 错误 */
        .error-box {
            background: rgba(181, 26, 63, 0.12);
            border: 1px solid rgba(181, 26, 63, 0.4);
            color: #ff6b8a;
            padding: 10px 14px;
            border-radius: 10px;
            font-size: 13px;
            margin-bottom: 14px;
            display: none;
            align-items: center;
            gap: 8px;
        }
        .error-box.show { display: flex; animation: shake 0.35s; }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25%      { transform: translateX(-6px); }
            75%      { transform: translateX(6px); }
        }

        /* Toast */
        .toast {
            position: fixed;
            bottom: 36px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(15, 25, 45, 0.95);
            color: #e6f1ff;
            padding: 13px 28px;
            border-radius: 40px;
            font-size: 14px;
            border: 1px solid rgba(77, 171, 247, 0.3);
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.4),
                        0 0 20px rgba(77, 171, 247, 0.2);
            backdrop-filter: blur(20px);
            display: none;
            z-index: 9999;
            white-space: nowrap;
        }
        .toast.show { display: block; animation: toastIn 0.35s ease; }
        @keyframes toastIn {
            from { opacity: 0; transform: translateX(-50%) translateY(20px); }
            to   { opacity: 1; transform: translateX(-50%) translateY(0); }
        }

        .spinner {
            display: inline-block;
            width: 14px;
            height: 14px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        @media (max-width: 480px) {
            .register-card { padding: 28px 22px 24px; }
            .card-title { font-size: 19px; }
        }
    </style>
</head>
<body>

<div class="aurora a1"></div>
<div class="aurora a2"></div>
<div class="grid-bg"></div>

<div class="register-card">
    <div class="card-head">
        <div class="card-logo">
            <i class="fas fa-user-plus"></i>
        </div>
        <div class="card-title">创建账号</div>
        <div class="card-desc">加入智控电商 AI 运营平台</div>
    </div>

    <div class="error-box" id="errorBox">
        <i class="fas fa-exclamation-circle"></i>
        <span id="errorText">请检查输入内容</span>
    </div>

    <form id="registerForm" onsubmit="return handleRegister(event)">
        <div class="form-group">
            <label>账号</label>
            <div class="input-wrap">
                <i class="fas fa-user"></i>
                <input type="text" id="regUsername" placeholder="4-20位字母或数字"
                       autocomplete="username" required>
            </div>
        </div>

        <div class="form-group">
            <label>邮箱</label>
            <div class="input-wrap">
                <i class="fas fa-envelope"></i>
                <input type="email" id="regEmail" placeholder="用于找回密码"
                       autocomplete="email" required>
            </div>
        </div>

        <div class="form-group">
            <label>密码</label>
            <div class="input-wrap">
                <i class="fas fa-lock"></i>
                <input type="password" id="regPassword" placeholder="至少8位，含字母和数字"
                       autocomplete="new-password" required oninput="checkPwdStrength(this.value)">
            </div>
            <div class="pwd-strength">
                <div class="bar" id="bar1"></div>
                <div class="bar" id="bar2"></div>
                <div class="bar" id="bar3"></div>
                <div class="bar" id="bar4"></div>
            </div>
            <div class="pwd-hint" id="pwdHint">密码强度：待输入</div>
        </div>

        <div class="form-group">
            <label>确认密码</label>
            <div class="input-wrap">
                <i class="fas fa-lock"></i>
                <input type="password" id="regPassword2" placeholder="再次输入密码"
                       autocomplete="new-password" required>
            </div>
        </div>

        <div class="agree-row">
            <label>
                <input type="checkbox" id="agree">
                <span>我已阅读并同意
                    <a href="javascript:showToast('📄 用户协议')">《用户协议》</a>
                    和
                    <a href="javascript:showToast('📄 隐私政策')">《隐私政策》</a>
                </span>
            </label>
        </div>

        <button type="submit" class="register-btn" id="registerBtn">
            <i class="fas fa-user-plus"></i>
            <span>创 建 账 号</span>
        </button>
    </form>

    <div class="card-foot">
        已有账号？
        <a href="login.html">
            <i class="fas fa-sign-in-alt"></i> 立即登录
        </a>
    </div>
</div>

<div class="toast" id="toast"></div>

<script>
    /* ===== 密码强度检查 ===== */
    function checkPwdStrength(pwd) {
        const bars = [
            document.getElementById('bar1'),
            document.getElementById('bar2'),
            document.getElementById('bar3'),
            document.getElementById('bar4')
        ];
        const hint = document.getElementById('pwdHint');
        bars.forEach(b => { b.className = 'bar'; });

        if (!pwd) {
            hint.textContent = '密码强度：待输入';
            hint.style.color = '#5a7fa8';
            return;
        }

        let score = 0;
        if (pwd.length >= 8) score++;
        if (/[a-z]/.test(pwd) && /[A-Z]/.test(pwd)) score++;
        if (/\d/.test(pwd)) score++;
        if (/[^a-zA-Z0-9]/.test(pwd)) score++;

        const labels = ['弱', '中', '强', '极强'];
        const colors = ['#b51a3f', '#f5b342', '#4dabf7', '#0d7c4f'];

        for (let i = 0; i < score; i++) {
            bars[i].classList.add(score <= 1 ? 'weak' : score === 2 ? 'mid' : score === 3 ? 'on' : 'strong');
        }

        hint.textContent = '密码强度：' + labels[Math.max(0, score - 1)];
        hint.style.color = colors[Math.max(0, score - 1)];
    }

    /* ===== 处理注册 ===== */
    function handleRegister(e) {
        e.preventDefault();

        const btn = document.getElementById('registerBtn');
        const errBox = document.getElementById('errorBox');
        const errText = document.getElementById('errorText');

        const username = document.getElementById('regUsername').value.trim();
        const email = document.getElementById('regEmail').value.trim();
        const pwd = document.getElementById('regPassword').value;
        const pwd2 = document.getElementById('regPassword2').value;
        const agree = document.getElementById('agree').checked;

        // 校验
        function fail(msg) {
            errText.textContent = msg;
            errBox.classList.add('show');
        }

        if (username.length < 4 || username.length > 20) return fail('账号长度需 4-20 位');
        if (!/^[a-zA-Z0-9_]+$/.test(username)) return fail('账号只能包含字母、数字、下划线');
        if (!/^\S+@\S+\.\S+$/.test(email)) return fail('请输入正确的邮箱');
        if (pwd.length < 8) return fail('密码至少 8 位');
        if (!/[a-zA-Z]/.test(pwd) || !/\d/.test(pwd)) return fail('密码需包含字母和数字');
        if (pwd !== pwd2) return fail('两次密码不一致');
        if (!agree) return fail('请先同意用户协议');

        errBox.classList.remove('show');

        // loading
        btn.disabled = true;
        btn.innerHTML = '<span class="spinner"></span> <span>注册中...</span>';

        setTimeout(function () {
            // 演示：直接成功
            btn.innerHTML = '<i class="fas fa-check"></i> <span>注册成功，正在跳转...</span>';
            showToast('🎉 注册成功！即将跳转登录');

            setTimeout(function () {
                location.href = 'login.html';
            }, 1200);
        }, 900);
    }

    /* ===== Toast ===== */
    function showToast(msg) {
        const t = document.getElementById('toast');
        t.textContent = msg;
        t.classList.add('show');
        clearTimeout(t._timer);
        t._timer = setTimeout(() => t.classList.remove('show'), 2200);
    }
</script>
</body>
</html>
