<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智控电商 · 运营后台</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto,
                         'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: #eef2f8;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* ===== 侧边栏 ===== */
        .sidebar {
            width: 220px;
            background: #0a1e2f;
            color: #b8cfe0;
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
            height: 100vh;
            overflow-y: auto;
            box-shadow: 2px 0 20px rgba(10, 30, 47, 0.08);
            z-index: 100;
        }
        .sidebar::-webkit-scrollbar { width: 3px; }
        .sidebar::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.15);
            border-radius: 10px;
        }
        .sidebar .logo {
            padding: 22px 20px 28px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .sidebar .logo i {
            font-size: 26px;
            color: #4dabf7;
            background: rgba(77, 171, 247, 0.12);
            padding: 8px;
            border-radius: 12px;
        }
        .sidebar .logo span {
            font-size: 18px;
            font-weight: 700;
            color: #fff;
        }
        .sidebar .logo .badge {
            font-size: 10px;
            background: #4dabf7;
            color: #0a1e2f;
            padding: 2px 10px;
            border-radius: 30px;
            font-weight: 600;
            margin-left: auto;
        }
        .sidebar .nav { flex: 1; padding: 16px 12px 20px; }
        .sidebar .section-label {
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: #5a7f99;
            padding: 14px 12px 6px;
            font-weight: 600;
        }
        .sidebar .section-label:first-of-type { padding-top: 0; }
        .sidebar .item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 14px;
            border-radius: 10px;
            color: #9bb4cc;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: 0.15s;
            margin-bottom: 2px;
            position: relative;
        }
        .sidebar .item i {
            width: 18px;
            font-size: 15px;
            text-align: center;
            color: #5a7f99;
        }
        .sidebar .item:hover {
            background: rgba(255, 255, 255, 0.05);
            color: #d4e4f0;
        }
        .sidebar .item:hover i { color: #7aaed9; }
        .sidebar .item.active {
            background: rgba(77, 171, 247, 0.12);
            color: #fff;
        }
        .sidebar .item.active i { color: #4dabf7; }
        .sidebar .item.active::before {
            content: '';
            position: absolute;
            left: 0;
            top: 20%;
            height: 60%;
            width: 3px;
            background: #4dabf7;
            border-radius: 0 4px 4px 0;
        }
        .sidebar .item .tag {
            margin-left: auto;
            background: rgba(77, 171, 247, 0.15);
            color: #4dabf7;
            font-size: 10px;
            padding: 2px 10px;
            border-radius: 30px;
            font-weight: 600;
        }
        .sidebar .bottom {
            padding: 16px 20px 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            font-size: 13px;
            color: #5a7f99;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* ===== 主内容区 ===== */
        .main {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-width: 0;
            height: 100vh;
        }
        .topbar {
            background: #fff;
            padding: 14px 28px;
            border-bottom: 1px solid #e8edf4;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
        }
        .topbar .left h2 {
            font-size: 18px;
            font-weight: 600;
            color: #0a1e2f;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .topbar .left p {
            font-size: 12px;
            color: #5f7d95;
            margin-top: 2px;
        }
        .topbar .right {
            display: flex;
            gap: 10px;
            align-items: center;
        }
        .topbar .right .btn {
            padding: 6px 16px;
            border-radius: 30px;
            border: 1px solid #dce5ef;
            background: #fff;
            font-size: 13px;
            font-weight: 500;
            color: #1e3a5f;
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            transition: 0.1s;
        }
        .topbar .right .btn:hover {
            background: #f5f9fe;
            border-color: #4dabf7;
        }
        .topbar .right .avatar {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            background: #4dabf7;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 15px;
            font-weight: 600;
        }

        /* ===== iframe 容器 ===== */
        .content-frame {
            flex: 1;
            width: 100%;
            border: none;
            background: #eef2f8;
        }

        /* ===== 响应式 ===== */
        @media (max-width: 768px) {
            .sidebar { width: 60px; }
            .sidebar .logo span,
            .sidebar .logo .badge,
            .sidebar .item span,
            .sidebar .section-label,
            .sidebar .bottom span,
            .sidebar .item .tag { display: none; }
            .sidebar .logo { padding: 16px 12px; justify-content: center; }
            .sidebar .item { justify-content: center; padding: 12px; }
            .topbar { padding: 12px 16px; }
            .topbar .left h2 { font-size: 15px; }
        }
    </style>
</head>
<body>

<!-- ===== 左侧导航 ===== -->
<div class="sidebar">
    <div class="logo">
        <i class="fas fa-bolt"></i>
        <span>智控电商</span>
        <span class="badge">v3.0</span>
    </div>
    <div class="nav">

        <!-- ========== 经营总览 ========== -->
        <div class="section-label">经营总览</div>
        <div class="item active"
             data-page="pages/ai_assistant.html"
             data-title="AI 助手"
             data-desc="自然语言驱动的经营操作">
            <i class="fas fa-robot"></i><span>AI 助手</span>
        </div>
        <div class="item"
             data-page="pages/images.html"
             data-title="图片素材"
             data-desc="素材管理 · AI 生成">
            <i class="fas fa-images"></i><span>图片素材</span>
        </div>
        <div class="item"
             data-page="pages/logs.html"
             data-title="操作日志"
             data-desc="系统操作记录审计">
            <i class="fas fa-history"></i><span>操作日志</span>
        </div>

        <!-- ========== 商品与交易 ========== -->
        <div class="section-label">商品与交易</div>
        <div class="item"
             data-page="pages/商品管理.html"
             data-title="商品管理"
             data-desc="跨平台商品发布 · 库存同步">
            <i class="fas fa-box"></i><span>商品管理</span>
        </div>

        <!-- ========== 运营支持 ========== -->
        <div class="section-label">运营支持</div>
        <div class="item"
             data-page="pages/素材生成.html"
             data-title="素材生成"
             data-desc="AI 生成商品主图 / 详情 / 视频">
            <i class="fas fa-magic"></i><span>素材生成</span>
        </div>
        <div class="item"
             data-page="pages/渠道货源.html"
             data-title="渠道货源"
             data-desc="1688 / 供应链选品 · 一键铺货">
            <i class="fas fa-plug"></i><span>渠道货源</span>
        </div>
        <div class="item"
             data-page="pages/智能采购系统.html"
             data-title="智能采购"
             data-desc="AI 驱动的采购决策">
            <i class="fas fa-cart-plus"></i><span>智能采购</span>
        </div>
        <div class="item"
             data-page="pages/智能物流管理.html"
             data-title="智能物流"
             data-desc="全链路物流追踪 · 智能调度">
            <i class="fas fa-truck"></i><span>智能物流</span>
        </div>

        <!-- ========== AI 智能赋能 ========== -->
        <div class="section-label">AI 智能赋能</div>
        <div class="item"
             data-page="pages/ai-service.html"
             data-title="AI 客服"
             data-desc="全平台客服消息统一接入 · 自动回复">
            <i class="fas fa-headset"></i><span>AI 客服</span>
            <span class="tag">NEW</span>
        </div>
        <div class="item"
             data-page="pages/customer.html"
             data-title="客资聚合"
             data-desc="跨平台客户合并 · 360° 画像">
            <i class="fas fa-users"></i><span>客资聚合</span>
            <span class="tag">89</span>
        </div>
        <div class="item"
             data-page="pages/competitor.html"
             data-title="同行竞品"
             data-desc="竞品价格监控 · 销量趋势">
            <i class="fas fa-eye"></i><span>同行竞品</span>
        </div>
        <div class="item"
             data-page="pages/diagnosis.html"
             data-title="经营诊断"
             data-desc="AI 驱动 · 智能预测 · 问题诊断">
            <i class="fas fa-stethoscope"></i><span>经营诊断</span>
        </div>

        <!-- ========== 订单与库存 ========== -->
        <div class="section-label">订单与库存</div>
        <div class="item"
             data-page="pages/orders.html"
             data-title="订单管理"
             data-desc="全渠道订单统一管理 · 发货 · 售后">
            <i class="fas fa-shopping-cart"></i><span>订单管理</span>
            <span class="tag">23</span>
        </div>
        <div class="item"
             data-page="pages/inventory.html"
             data-title="库存管理"
             data-desc="多平台库存同步 · 防超卖 · 预警">
            <i class="fas fa-warehouse"></i><span>库存管理</span>
        </div>

        <!-- ========== 系统配置 ========== -->
        <div class="section-label">系统配置</div>
        <div class="item"
             data-page="pages/channels-config.html"
             data-title="渠道管理"
             data-desc="平台店铺授权 · API 状态监控">
            <i class="fas fa-link"></i><span>渠道管理</span>
        </div>
        <div class="item"
             data-page="pages/settings.html"
             data-title="系统设置"
             data-desc="账户 · 通知 · 同步 · AI 配置">
            <i class="fas fa-cog"></i><span>系统设置</span>
        </div>

    </div>
    <div class="bottom">
        <i class="fas fa-shield-alt"></i>
        <span>数据加密 · 安全</span>
    </div>
</div>

<!-- ===== 主内容区 ===== -->
<div class="main">
    <div class="topbar">
        <div class="left">
            <h2 id="pageTitle">
                <i class="fas fa-robot" style="color:#4dabf7;"></i> AI 助手
            </h2>
            <p id="pageDesc">自然语言驱动的经营操作</p>
        </div>
        <div class="right">
            <span class="btn" id="refreshBtn">
                <i class="fas fa-sync-alt"></i> 刷新
            </span>
            <span class="btn" id="openNewBtn">
                <i class="fas fa-external-link-alt"></i> 新窗口打开
            </span>
            <span class="avatar">T</span>
        </div>
    </div>

    <!-- iframe 容器，加载子页面 -->
    <iframe id="contentFrame"
            class="content-frame"
            src="pages/ai_assistant.html"
            name="contentFrame"></iframe>
</div>

<script>
    /* ============================================================
       index.html 主控脚本
       ============================================================ */
    var frame      = document.getElementById('contentFrame');
    var pageTitle  = document.getElementById('pageTitle');
    var pageDesc   = document.getElementById('pageDesc');
    var currentPage = 'pages/ai_assistant.html';

    /* ===== 导航点击切换 ===== */
    document.querySelectorAll('.sidebar .item').forEach(function (item) {
        item.addEventListener('click', function () {
            // 高亮
            document.querySelectorAll('.sidebar .item').forEach(function (i) {
                i.classList.remove('active');
            });
            this.classList.add('active');

            // 读取数据
            var page  = this.dataset.page;
            var title = this.dataset.title;
            var desc  = this.dataset.desc;

            currentPage = page;

            // 更新顶栏
            pageTitle.innerHTML = '<i class="fas fa-circle" style="color:#4dabf7;font-size:8px;"></i> ' + title;
            pageDesc.textContent = desc;

            // 切换 iframe
            frame.src = page;

            // 同步 URL hash（可选，便于刷新后保持页面）
            location.hash = '#/' + page;
        });
    });

    /* ===== 刷新按钮 ===== */
    document.getElementById('refreshBtn').addEventListener('click', function () {
        frame.src = frame.src;  // 重新加载 iframe
    });

    /* ===== 新窗口打开 ===== */
    document.getElementById('openNewBtn').addEventListener('click', function () {
        window.open(currentPage, '_blank');
    });

    /* ===== 监听子页面 postMessage ===== */
    window.addEventListener('message', function (e) {
        var data = e.data || {};

        // 子页面想改父标题
        if (data.type === 'title') {
            pageTitle.innerHTML = '<i class="fas fa-circle" style="color:#4dabf7;font-size:8px;"></i> ' + data.value;
        }
        // 子页面想弹全局 toast
        if (data.type === 'toast') {
            showToast(data.value);
        }
        // 子页面想跳转其它板块
        if (data.type === 'navigate' && data.page) {
            document.querySelectorAll('.sidebar .item').forEach(function (i) {
                if (i.dataset.page === data.page) {
                    i.click();
                }
            });
        }
    });

    /* ===== 全局 Toast（父级自身用） ===== */
    function showToast(msg) {
        var toast = document.getElementById('toast');
        if (!toast) {
            toast = document.createElement('div');
            toast.id = 'toast';
            toast.className = 'toast';
            document.body.appendChild(toast);
        }
        toast.innerHTML = msg;
        toast.classList.add('show');
        clearTimeout(toast._timer);
        toast._timer = setTimeout(function () {
            toast.classList.remove('show');
        }, 2500);
    }

    /* ===== 根据 hash 恢复页面（可选） ===== */
    window.addEventListener('DOMContentLoaded', function () {
        var hash = location.hash.replace('#/', '');
        if (hash) {
            document.querySelectorAll('.sidebar .item').forEach(function (i) {
                if (i.dataset.page === hash) {
                    i.click();
                }
            });
        }
    });
</script>
</body>
</html>
