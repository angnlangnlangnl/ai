<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 · 智控电商 AI</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        /* ============================================================
           全局
           ============================================================ */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; overflow: hidden; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto,
                         'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: #050912;
            color: #e6f1ff;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            perspective: 1200px;
        }

        /* ============================================================
           ① 背景：动态星云粒子
           ============================================================ */
        #bgCanvas {
            position: fixed;
            inset: 0;
            z-index: 0;
            display: block;
        }

        /* ============================================================
           ② 背景光晕（呼吸 + 缓慢漂移）
           ============================================================ */
        .aurora {
            position: fixed;
            border-radius: 50%;
            filter: blur(120px);
            opacity: 0.55;
            z-index: 1;
            pointer-events: none;
        }
        .aurora.a1 {
            width: 620px; height: 620px;
            background: radial-gradient(circle, #1e90ff 0%, transparent 70%);
            top: -220px; left: -180px;
            animation: drift1 18s ease-in-out infinite;
        }
        .aurora.a2 {
            width: 540px; height: 540px;
            background: radial-gradient(circle, #6a5cff 0%, transparent 70%);
            bottom: -200px; right: -160px;
            animation: drift2 22s ease-in-out infinite;
        }
        .aurora.a3 {
            width: 380px; height: 380px;
            background: radial-gradient(circle, #00d4ff 0%, transparent 70%);
            top: 40%; left: 45%;
            animation: drift3 26s ease-in-out infinite;
        }
        @keyframes drift1 {
            0%, 100% { transform: translate(0, 0) scale(1); }
            50%      { transform: translate(80px, 60px) scale(1.15); }
        }
        @keyframes drift2 {
            0%, 100% { transform: translate(0, 0) scale(1); }
            50%      { transform: translate(-70px, -50px) scale(1.2); }
        }
        @keyframes drift3 {
            0%, 100% { transform: translate(0, 0) scale(1); opacity: 0.4; }
            50%      { transform: translate(-90px, 40px) scale(1.3); opacity: 0.7; }
        }

        /* ============================================================
           ③ 网格线（科技感底纹）
           ============================================================ */
        .grid-bg {
            position: fixed;
            inset: 0;
            z-index: 1;
            background-image:
                linear-gradient(rgba(77, 171, 247, 0.06) 1px, transparent 1px),
                linear-gradient(90deg, rgba(77, 171, 247, 0.06) 1px, transparent 1px);
            background-size: 60px 60px;
            mask-image: radial-gradient(circle at 50% 50%, #000 30%, transparent 75%);
            -webkit-mask-image: radial-gradient(circle at 50% 50%, #000 30%, transparent 75%);
            pointer-events: none;
        }

        /* ============================================================
           ④ 主容器（左右分栏）
           ============================================================ */
        .login-wrap {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 1100px;
            margin: 0 auto;
            padding: 20px;
            display: grid;
            grid-template-columns: 1.1fr 1fr;
            gap: 60px;
            align-items: center;
            animation: fadeIn 0.8s ease;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(30px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        /* ============================================================
           ⑤ 左侧品牌区
           ============================================================ */
        .brand-side {
            color: #e6f1ff;
        }
        .brand-tag {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 6px 16px;
            border-radius: 30px;
            background: rgba(77, 171, 247, 0.1);
            border: 1px solid rgba(77, 171, 247, 0.3);
            font-size: 12px;
            font-weight: 500;
            color: #4dabf7;
            letter-spacing: 0.05em;
            margin-bottom: 24px;
            backdrop-filter: blur(10px);
        }
        .brand-tag i { font-size: 11px; animation: pulse 2s ease-in-out infinite; }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50%      { opacity: 0.4; }
        }

        .brand-title {
            font-size: 52px;
            font-weight: 800;
            line-height: 1.15;
            letter-spacing: -0.02em;
            margin-bottom: 20px;
        }
        .brand-title .gradient-text {
            background: linear-gradient(135deg, #4dabf7 0%, #6a5cff 50%, #00d4ff 100%);
            background-size: 200% 200%;
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: gradientMove 4s ease infinite;
        }
        @keyframes gradientMove {
            0%, 100% { background-position: 0% 50%; }
            50%      { background-position: 100% 50%; }
        }

        .brand-subtitle {
            font-size: 16px;
            color: #7a9cc7;
            line-height: 1.8;
            margin-bottom: 40px;
            min-height: 52px;
        }
        .brand-subtitle .cursor {
            display: inline-block;
            width: 2px;
            height: 18px;
            background: #4dabf7;
            margin-left: 3px;
            vertical-align: middle;
            animation: blink 1s step-end infinite;
        }
        @keyframes blink {
            0%, 100% { opacity: 1; }
            50%      { opacity: 0; }
        }

        /* 数据指标 */
        .brand-stats {
            display: flex;
            gap: 40px;
            padding-top: 30px;
            border-top: 1px solid rgba(77, 171, 247, 0.15);
        }
        .stat-item .num {
            font-size: 32px;
            font-weight: 700;
            background: linear-gradient(135deg, #4dabf7, #00d4ff);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            line-height: 1;
        }
        .stat-item .num small {
            font-size: 16px;
            margin-left: 2px;
            -webkit-text-fill-color: #4dabf7;
        }
        .stat-item .label {
            font-size: 12px;
            color: #5a7fa8;
            margin-top: 8px;
            letter-spacing: 0.05em;
        }

        /* ============================================================
           ⑥ 右侧登录卡片（玻璃拟态 + 霓虹边）
           ============================================================ */
        .card-side {
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.4s cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        .login-card {
            position: relative;
            background: rgba(15, 25, 45, 0.65);
            border-radius: 24px;
            padding: 44px 40px 36px;
            backdrop-filter: blur(24px) saturate(180%);
            -webkit-backdrop-filter: blur(24px) saturate(180%);
            border: 1px solid rgba(77, 171, 247, 0.18);
            box-shadow:
                0 20px 60px rgba(0, 0, 0, 0.5),
                0 0 0 1px rgba(255, 255, 255, 0.03) inset,
                0 0 80px rgba(77, 171, 247, 0.08);
            overflow: hidden;
            transform-style: preserve-3d;
        }

        /* 顶部扫描光带 */
        .login-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 2px;
            background: linear-gradient(90deg,
                transparent,
                #4dabf7,
                #00d4ff,
                #4dabf7,
                transparent);
            animation: scan 4s linear infinite;
        }
        @keyframes scan {
            0%   { left: -100%; }
            100% { left: 100%; }
        }

        /* 角落装饰 */
        .login-card::after {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 24px;
            padding: 1px;
            background: linear-gradient(135deg,
                rgba(77, 171, 247, 0.6),
                transparent 30%,
                transparent 70%,
                rgba(106, 92, 255, 0.6));
            -webkit-mask:
                linear-gradient(#000 0 0) content-box,
                linear-gradient(#000 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            pointer-events: none;
        }

        /* 卡片头部 */
        .card-head {
            text-align: center;
            margin-bottom: 30px;
        }
        .card-logo {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 60px;
            height: 60px;
            border-radius: 18px;
            background: linear-gradient(135deg, rgba(77, 171, 247, 0.2), rgba(106, 92, 255, 0.15));
            border: 1px solid rgba(77, 171, 247, 0.3);
            margin-bottom: 18px;
            position: relative;
            box-shadow: 0 0 40px rgba(77, 171, 247, 0.25);
        }
        .card-logo::before {
            content: '';
            position: absolute;
            inset: -2px;
            border-radius: 18px;
            background: linear-gradient(135deg, #4dabf7, #6a5cff, #00d4ff);
            opacity: 0.4;
            filter: blur(12px);
            z-index: -1;
            animation: glow 3s ease-in-out infinite;
        }
        @keyframes glow {
            0%, 100% { opacity: 0.3; }
            50%      { opacity: 0.6; }
        }
        .card-logo i {
            font-size: 26px;
            color: #4dabf7;
            filter: drop-shadow(0 0 8px rgba(77, 171, 247, 0.8));
        }

        .card-title {
            font-size: 22px;
            font-weight: 700;
            color: #fff;
            letter-spacing: 0.02em;
        }
        .card-desc {
            font-size: 13px;
            color: #7a9cc7;
            margin-top: 6px;
        }

        /* 错误提示 */
        .error-box {
            background: rgba(181, 26, 63, 0.12);
            border: 1px solid rgba(181, 26, 63, 0.4);
            color: #ff6b8a;
            padding: 10px 14px;
            border-radius: 10px;
            font-size: 13px;
            margin-bottom: 16px;
            display: none;
            align-items: center;
            gap: 8px;
            animation: shake 0.35s;
        }
        .error-box.show { display: flex; }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25%      { transform: translateX(-6px); }
            75%      { transform: translateX(6px); }
        }

        /* 表单 */
        .form-group { margin-bottom: 18px; }
        .form-group label {
            display: block;
            font-size: 12px;
            font-weight: 500;
            color: #7a9cc7;
            margin-bottom: 8px;
            letter-spacing: 0.05em;
            text-transform: uppercase;
        }
        .input-wrap {
            position: relative;
            border-radius: 12px;
            background: rgba(5, 12, 25, 0.5);
            border: 1px solid rgba(77, 171, 247, 0.15);
            transition: 0.2s;
        }
        .input-wrap:focus-within {
            border-color: #4dabf7;
            background: rgba(5, 12, 25, 0.8);
            box-shadow: 0 0 0 4px rgba(77, 171, 247, 0.12),
                        0 0 30px rgba(77, 171, 247, 0.15);
        }
        .input-wrap i {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: #4a6a8c;
            font-size: 14px;
            transition: 0.2s;
            pointer-events: none;
        }
        .input-wrap:focus-within i { color: #4dabf7; }
        .input-wrap input {
            width: 100%;
            padding: 14px 16px 14px 46px;
            background: transparent;
            border: none;
            outline: none;
            font-size: 14px;
            color: #fff;
            font-family: inherit;
            letter-spacing: 0.02em;
        }
        .input-wrap input::placeholder {
            color: #4a6a8c;
        }
        /* 自动填充去掉黄色背景 */
        .input-wrap input:-webkit-autofill,
        .input-wrap input:-webkit-autofill:hover,
        .input-wrap input:-webkit-autofill:focus {
            -webkit-text-fill-color: #fff;
            transition: background-color 5000s ease-in-out 0s;
        }

        /* 密码显示切换 */
        .toggle-pwd {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: #4a6a8c;
            cursor: pointer;
            font-size: 14px;
            transition: 0.2s;
        }
        .toggle-pwd:hover { color: #4dabf7; }

        /* 记住我 + 忘记密码 */
        .row-between {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 22px;
            font-size: 13px;
        }
        .row-between label {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #7a9cc7;
            cursor: pointer;
            user-select: none;
        }
        .row-between label input[type="checkbox"] {
            appearance: none;
            -webkit-appearance: none;
            width: 16px;
            height: 16px;
            border-radius: 5px;
            border: 1px solid rgba(77, 171, 247, 0.4);
            background: rgba(5, 12, 25, 0.5);
            cursor: pointer;
            position: relative;
            transition: 0.15s;
        }
        .row-between label input[type="checkbox"]:checked {
            background: linear-gradient(135deg, #4dabf7, #6a5cff);
            border-color: #4dabf7;
        }
        .row-between label input[type="checkbox"]:checked::after {
            content: '';
            position: absolute;
            left: 4px;
            top: 1px;
            width: 5px;
            height: 9px;
            border: solid #fff;
            border-width: 0 2px 2px 0;
            transform: rotate(45deg);
        }
        .row-between a {
            color: #4dabf7;
            text-decoration: none;
            transition: 0.15s;
        }
        .row-between a:hover {
            color: #00d4ff;
            text-shadow: 0 0 12px rgba(0, 212, 255, 0.5);
        }

        /* 登录按钮 */
        .login-btn {
            position: relative;
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(135deg, #1e6fd9 0%, #4dabf7 50%, #00d4ff 100%);
            background-size: 200% 200%;
            color: #fff;
            font-size: 15px;
            font-weight: 600;
            letter-spacing: 0.1em;
            cursor: pointer;
            transition: 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            overflow: hidden;
            box-shadow:
                0 8px 24px rgba(77, 171, 247, 0.3),
                0 0 0 1px rgba(255, 255, 255, 0.1) inset;
        }
        .login-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg,
                transparent,
                rgba(255, 255, 255, 0.3),
                transparent);
            transition: 0.6s;
        }
        .login-btn:hover::before { left: 100%; }
        .login-btn:hover {
            background-position: 100% 0;
            transform: translateY(-2px);
            box-shadow:
                0 12px 32px rgba(77, 171, 247, 0.5),
                0 0 0 1px rgba(255, 255, 255, 0.15) inset;
        }
        .login-btn:active { transform: translateY(0); }
        .login-btn:disabled {
            background: #2a3a52;
            cursor: not-allowed;
            box-shadow: none;
            color: #5a7fa8;
        }
        .login-btn:disabled:hover { transform: none; }

        /* 卡片底部 */
        .card-foot {
            margin-top: 26px;
            padding-top: 20px;
            border-top: 1px solid rgba(77, 171, 247, 0.12);
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 12px;
            color: #5a7fa8;
        }
        .card-foot .demo {
            display: flex;
            gap: 6px;
            align-items: center;
        }
        .card-foot .demo b { color: #4dabf7; font-weight: 600; }
        .card-foot .secure {
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .card-foot .secure i { color: #0d7c4f; font-size: 11px; }

        /* ============================================================
           ⑦ 加载动画
           ============================================================ */
        .spinner {
            display: inline-block;
            width: 14px;
            height: 14px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* ============================================================
           ⑧ Toast
           ============================================================ */
        .toast {
            position: fixed;
            bottom: 36px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(15, 25, 45, 0.95);
            color: #e6f1ff;
            padding: 13px 28px;
            border-radius: 40px;
            font-size: 14px;
            border: 1px solid rgba(77, 171, 247, 0.3);
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.4),
                        0 0 20px rgba(77, 171, 247, 0.2);
            backdrop-filter: blur(20px);
            display: none;
            z-index: 9999;
            white-space: nowrap;
        }
        .toast.show {
            display: block;
            animation: toastIn 0.35s ease;
        }
        @keyframes toastIn {
            from { opacity: 0; transform: translateX(-50%) translateY(20px); }
            to   { opacity: 1; transform: translateX(-50%) translateY(0); }
        }

        /* ============================================================
           ⑨ 响应式
           ============================================================ */
        @media (max-width: 900px) {
            .login-wrap {
                grid-template-columns: 1fr;
                gap: 30px;
                max-width: 440px;
            }
            .brand-side { text-align: center; }
            .brand-title { font-size: 36px; }
            .brand-subtitle { min-height: auto; }
            .brand-stats {
                justify-content: center;
                gap: 30px;
            }
            .brand-stats .stat-item .num { font-size: 26px; }
        }
        @media (max-width: 480px) {
            .login-card { padding: 32px 24px 28px; }
            .brand-title { font-size: 28px; }
            .card-title { font-size: 19px; }
        }
    </style>
</head>
<body>

<!-- 背景画布 -->
<canvas id="bgCanvas"></canvas>

<!-- 光晕 -->
<div class="aurora a1"></div>
<div class="aurora a2"></div>
<div class="aurora a3"></div>

<!-- 网格 -->
<div class="grid-bg"></div>

<!-- ============================================================
     登录容器
     ============================================================ -->
<div class="login-wrap">

    <!-- 左侧品牌区 -->
    <div class="brand-side">
        <div class="brand-tag">
            <i class="fas fa-circle"></i>
            AI 驱动的电商运营系统 v3.0
        </div>
        <h1 class="brand-title">
            智控电商<br>
            <span class="gradient-text">AI 中台 · 全渠道</span>
        </h1>
        <p class="brand-subtitle" id="typewriter"></p>

        <div class="brand-stats">
            <div class="stat-item">
                <div class="num" data-target="98"><small>%</small></div>
                <div class="label">AI 自动化率</div>
            </div>
            <div class="stat-item">
                <div class="num" data-target="1283">0</div>
                <div class="label">在售商品数</div>
            </div>
            <div class="stat-item">
                <div class="num" data-target="4"><small>个</small></div>
                <div class="label">渠道已接入</div>
            </div>
        </div>
    </div>

    <!-- 右侧登录卡片 -->
    <div class="card-side" id="cardSide">
        <div class="login-card">
            <div class="card-head">
                <div class="card-logo">
                    <i class="fas fa-bolt"></i>
                </div>
                <div class="card-title">欢迎回来</div>
                <div class="card-desc">登录后进入 AI 运营控制台</div>
            </div>

            <div class="error-box" id="errorBox">
                <i class="fas fa-exclamation-circle"></i>
                <span id="errorText">账号或密码错误</span>
            </div>

            <form id="loginForm" onsubmit="return handleLogin(event)">
                <div class="form-group">
                    <label>账号</label>
                    <div class="input-wrap">
                        <i class="fas fa-user"></i>
                        <input type="text" id="username" placeholder="请输入账号"
                               autocomplete="username" required>
                    </div>
                </div>

                <div class="form-group">
                    <label>密码</label>
                    <div class="input-wrap">
                        <i class="fas fa-lock"></i>
                        <input type="password" id="password" placeholder="请输入密码"
                               autocomplete="current-password" required>
                        <span class="toggle-pwd" onclick="togglePwd(this)">
                            <i class="fas fa-eye"></i>
                        </span>
                    </div>
                </div>

                <div class="row-between">
                    <label>
                        <input type="checkbox" id="remember" checked>
                        记住账号
                    </label>
                    <a href="javascript:showToast('请联系管理员重置密码')">忘记密码？</a>
                </div>

                <button type="submit" class="login-btn" id="loginBtn">
                    <i class="fas fa-sign-in-alt"></i>
                    <span>登 录 控 制 台</span>
                </button>
            </form>

            <div class="card-foot">
                <div class="demo">
                    <i class="fas fa-key" style="color:#4dabf7;"></i>
                    演示: <b>admin</b> / <b>123456</b>
                </div>
                <div class="secure">
                    <i class="fas fa-shield-alt"></i>
                    数据加密
                </div>
            </div>
        </div>
    </div>

</div>

<div class="toast" id="toast"></div>

<!-- ============================================================
     脚本
     ============================================================ -->
<script src="js/auth.js"></script>
<script>
    /* ============================================================
       1. 已登录直接进后台
       ============================================================ */
    redirectIfLoggedIn();

    /* ============================================================
       2. 粒子背景（Canvas）
       ============================================================ */
    (function initParticles() {
        const canvas = document.getElementById('bgCanvas');
        const ctx = canvas.getContext('2d');
        let w, h, particles = [], lines = [];
        const PARTICLE_COUNT = 90;
        const MAX_DIST = 140;

        function resize() {
            w = canvas.width  = window.innerWidth;
            h = canvas.height = window.innerHeight;
        }
        resize();
        window.addEventListener('resize', resize);

        // 生成粒子
        for (let i = 0; i < PARTICLE_COUNT; i++) {
            particles.push({
                x: Math.random() * w,
                y: Math.random() * h,
                vx: (Math.random() - 0.5) * 0.3,
                vy: (Math.random() - 0.5) * 0.3,
                r: Math.random() * 1.8 + 0.4,
                alpha: Math.random() * 0.5 + 0.3
            });
        }

        // 鼠标位置
        let mouse = { x: -9999, y: -9999 };
        window.addEventListener('mousemove', function (e) {
            mouse.x = e.clientX;
            mouse.y = e.clientY;
        });

        function draw() {
            ctx.clearRect(0, 0, w, h);

            // 绘制粒子连线
            for (let i = 0; i < particles.length; i++) {
                for (let j = i + 1; j < particles.length; j++) {
                    const dx = particles[i].x - particles[j].x;
                    const dy = particles[i].y - particles[j].y;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    if (dist < MAX_DIST) {
                        const alpha = (1 - dist / MAX_DIST) * 0.22;
                        ctx.strokeStyle = `rgba(77, 171, 247, ${alpha})`;
                        ctx.lineWidth = 0.6;
                        ctx.beginPath();
                        ctx.moveTo(particles[i].x, particles[i].y);
                        ctx.lineTo(particles[j].x, particles[j].y);
                        ctx.stroke();
                    }
                }
            }

            // 鼠标连线（近距离更亮）
            for (let i = 0; i < particles.length; i++) {
                const dx = particles[i].x - mouse.x;
                const dy = particles[i].y - mouse.y;
                const dist = Math.sqrt(dx * dx + dy * dy);
                if (dist < 180) {
                    const alpha = (1 - dist / 180) * 0.45;
                    ctx.strokeStyle = `rgba(0, 212, 255, ${alpha})`;
                    ctx.lineWidth = 0.8;
                    ctx.beginPath();
                    ctx.moveTo(particles[i].x, particles[i].y);
                    ctx.lineTo(mouse.x, mouse.y);
                    ctx.stroke();
                }
            }

            // 绘制粒子
            for (const p of particles) {
                p.x += p.vx;
                p.y += p.vy;
                if (p.x < 0 || p.x > w) p.vx *= -1;
                if (p.y < 0 || p.y > h) p.vy *= -1;

                ctx.beginPath();
                ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(77, 171, 247, ${p.alpha})`;
                ctx.shadowColor = 'rgba(77, 171, 247, 0.7)';
                ctx.shadowBlur = 8;
                ctx.fill();
                ctx.shadowBlur = 0;
            }

            requestAnimationFrame(draw);
        }
        draw();
    })();

    /* ============================================================
       3. 打字机效果
       ============================================================ */
    (function typewriter() {
        const el = document.getElementById('typewriter');
        const text = '全渠道数据聚合 · AI 智能诊断 · 自动化运营 · 让经营更简单。';
        let i = 0;
        el.innerHTML = '<span class="cursor"></span>';

        function tick() {
            if (i <= text.length) {
                el.innerHTML = text.slice(0, i) + '<span class="cursor"></span>';
                i++;
                setTimeout(tick, 55);
            }
        }
        setTimeout(tick, 800);
    })();

    /* ============================================================
       4. 数字滚动
       ============================================================ */
    (function countUp() {
        document.querySelectorAll('.stat-item .num').forEach(function (el) {
            const target = parseInt(el.dataset.target, 10);
            const hasSmall = el.querySelector('small');
            const smallHTML = hasSmall ? hasSmall.outerHTML : '';
            let cur = 0;
            const step = Math.max(1, target / 45);

            function run() {
                cur += step;
                if (cur >= target) {
                    el.innerHTML = target.toLocaleString() + smallHTML;
                    return;
                }
                el.innerHTML = Math.floor(cur).toLocaleString() + smallHTML;
                requestAnimationFrame(run);
            }
            setTimeout(run, 1200);
        });
    })();

    /* ============================================================
       5. 登录卡片 3D 倾斜跟随鼠标
       ============================================================ */
    (function tiltCard() {
        const side = document.getElementById('cardSide');
        const wrap = document.querySelector('.login-wrap');

        wrap.addEventListener('mousemove', function (e) {
            const rect = side.getBoundingClientRect();
            const cx = rect.left + rect.width / 2;
            const cy = rect.top + rect.height / 2;
            const dx = (e.clientX - cx) / rect.width;
            const dy = (e.clientY - cy) / rect.height;
            const maxTilt = 6;
            side.style.transform =
                `rotateY(${dx * maxTilt}deg) rotateX(${-dy * maxTilt}deg) translateZ(0)`;
        });

        wrap.addEventListener('mouseleave', function () {
            side.style.transform = 'rotateY(0) rotateX(0)';
        });
    })();

    /* ============================================================
       6. 显示 / 隐藏密码
       ============================================================ */
    function togglePwd(el) {
        const input = document.getElementById('password');
        const icon = el.querySelector('i');
        if (input.type === 'password') {
            input.type = 'text';
            icon.classList.remove('fa-eye');
            icon.classList.add('fa-eye-slash');
        } else {
            input.type = 'password';
            icon.classList.remove('fa-eye-slash');
            icon.classList.add('fa-eye');
        }
    }

    /* ============================================================
       7. 处理登录
       ============================================================ */
    function handleLogin(e) {
        e.preventDefault();
        const btn = document.getElementById('loginBtn');
        const errBox = document.getElementById('errorBox');
        const errText = document.getElementById('errorText');
        const username = document.getElementById('username').value.trim();
        const password = document.getElementById('password').value;

        if (!username || !password) {
            errText.textContent = '请输入账号和密码';
            errBox.classList.add('show');
            return false;
        }

        // loading
        btn.disabled = true;
        btn.innerHTML = '<span class="spinner"></span> <span>验证中...</span>';

        setTimeout(function () {
            const result = doLogin(username, password);

            if (result.ok) {
                if (document.getElementById('remember').checked) {
                    localStorage.setItem('aicontrol_last_user', username);
                } else {
                    localStorage.removeItem('aicontrol_last_user');
                }
                errBox.classList.remove('show');
                btn.innerHTML = '<i class="fas fa-check"></i> <span>登录成功，正在进入...</span>';

                setTimeout(function () {
                    location.href = 'index.html';
                }, 600);
            } else {
                errText.textContent = result.msg;
                errBox.classList.add('show');
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-sign-in-alt"></i> <span>登 录 控 制 台</span>';
            }
        }, 700);
    }

    /* ============================================================
       8. 回填上次登录账号
       ============================================================ */
    window.addEventListener('DOMContentLoaded', function () {
        const last = localStorage.getItem('aicontrol_last_user');
        if (last) document.getElementById('username').value = last;
        setTimeout(function () {
            document.getElementById('password').focus();
        }, 1500);
    });

    /* ============================================================
       9. 简易 Toast
       ============================================================ */
    function showToast(msg) {
        const t = document.getElementById('toast');
        t.textContent = msg;
        t.classList.add('show');
        clearTimeout(t._timer);
        t._timer = setTimeout(() => t.classList.remove('show'), 2200);
    }
</script>
